<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI制单 - 缓存优化版</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js"></script>
<script src="pinyin_match.js?v=20260523kw"></script>
<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes matchSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 10px 20px;
}
.container {
  max-width: calc(100vw - 520px);
  margin: 0;
  padding-left: 24px;
}
.header {
  text-align: center;
  color: #1f2937;
  margin-bottom: 10px;
}
.header h1 { font-size: 22px; }

.main-layout {
  display: block;
}

.result-section {
  background: white;
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  min-height: calc(100vh - 80px);
  display: flex;
  flex-direction: column;
}
.result-section.active { display: flex; }

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #f0f0f0;
  flex-shrink: 0;
}
.result-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-value {
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
}
.stat-value.confirmed {
  background: #dcfce7;
  color: #166534;
}
.stat-value.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #999;
  flex: 1;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}
.empty-icon i {
  font-size: 48px;
}
.empty-text {
  font-size: 14px;
  line-height: 1.8;
}

/* 客户识别区域 */
.customer-section {
  margin-bottom: 12px;
  flex-shrink: 0;
}
.field-label {
  font-size: 12px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.customer-card {
  background: #f8f9fa;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.customer-card:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.customer-card.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.customer-card.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.customer-avatar {
  width: 36px;
  height: 36px;
  background: #3b82f6;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
}
.customer-info { flex: 1; }
.customer-name {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 2px;
}
.customer-meta {
  font-size: 11px;
  color: #888;
}
.customer-status {
  padding: 5px 10px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
}
.customer-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.customer-status.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 产品区域 */
.product-section {
  margin-bottom: 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.product-actions {
  display: flex;
  gap: 8px;
}
.action-btn {
  padding: 6px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  background: white;
  font-size: 12px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
}
.action-btn.primary {
  background: #3b82f6;
  color: white;
  border-color: transparent;
}
.action-btn.primary:hover {
  opacity: 0.9;
}

/* 产品列表 */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: none;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  padding-right: 4px;
}
.product-list::-webkit-scrollbar {
  width: 4px;
}
.product-list::-webkit-scrollbar-track {
  background: #f0f0f0;
  border-radius: 2px;
}
.product-list::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 2px;
}

/* 产品项 */
.product-item {
  background: #fafbfc;
  border: 2px solid #e8e8e8;
  border-radius: 8px;
  padding: 8px 10px;
  transition: all 0.2s;
  position: relative;
}
.product-item:hover {
  border-color: #bfdbfe;
  background: #eff6ff;
}
.product-item.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.product-item.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.product-item.error {
  border-color: #f87171;
  background: #fef2f2;
}
.product-item.new {
  border-color: #60a5fa;
  background: #eff6ff;
}

.product-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0;
}
.product-index {
  width: 22px;
  height: 22px;
  background: #e8e8e8;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
  flex-shrink: 0;
}
.product-item.confirmed .product-index {
  background: #4ade80;
  color: white;
}
.product-item.pending .product-index {
  background: #fbbf24;
  color: white;
}
.product-item.error .product-index {
  background: #f87171;
  color: white;
}
.product-item.new .product-index {
  background: #60a5fa;
  color: white;
}
.product-main { flex: 1; min-width: 0; }
.product-name-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 0;
}
.product-name {
  font-size: 13px;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-match-type {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
}
.product-match-type.sku { background: #dbeafe; color: #1e40af; }
.product-match-type.manual { background: #e0e7ff; color: #3730a3; }
.product-match-type.code { background: #dcfce7; color: #166534; }
.product-match-type.name { background: #fef3c7; color: #92400e; }
.product-match-type.exact { background: #dcfce7; color: #166534; }
.product-match-type.auto { background: #d1fae5; color: #065f46; }
.product-match-type.candidate { background: #fef3c7; color: #92400e; }
.product-match-type.fuzzy { background: #ffedd5; color: #9a3412; }
.product-match-type.none { background: #fee2e2; color: #991b1b; }
.product-match-type.new { background: #dbeafe; color: #1e40af; }

.product-code {
  font-size: 11px;
  color: #333;
}
.product-status {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.2s;
}
.product-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.product-status.pending {
  background: #fef3c7;
  color: #92400e;
}
.product-status.error {
  background: #fee2e2;
  color: #991b1b;
}
.product-status.new {
  background: #dbeafe;
  color: #1e40af;
}
.product-status:hover {
  opacity: 0.8;
}

.product-details {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-shrink: 0;
  margin-left: auto;
  padding-left: 12px;
}
.detail-item {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: center;
}
.detail-label {
  font-size: 9px;
  color: #999;
  line-height: 1;
}
.detail-value {
  font-size: 12px;
  color: #333;
  font-weight: 500;
  line-height: 1.4;
}
.detail-value.editable {
  cursor: pointer;
  border-bottom: 1px dashed #d1d5db;
  transition: all 0.2s;
  min-width: 40px;
  display: inline-block;
}
.detail-value.editable:hover {
  border-bottom-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
  border-radius: 2px;
}
.detail-value.editing {
  border-bottom: none;
  padding: 0;
}
.detail-value.editing input {
  width: 100%;
  padding: 2px 6px;
  border: 1px solid #3b82f6;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  color: #333;
  background: #fafbff;
  outline: none;
}
.detail-value .edit-hint {
  font-size: 9px;
  color: #9ca3af;
  margin-left: 2px;
}
.detail-value.modified {
  position: relative;
}
.detail-value.modified::after {
  content: '已改';
  font-size: 9px;
  color: #f59e0b;
  margin-left: 4px;
  font-weight: 400;
}

.product-actions-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed #e0e0e0;
}
.product-action-btn {
  padding: 2px 8px;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  background: white;
  font-size: 10px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
}
.product-action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
}
.product-action-btn.new {
  background: #dbeafe;
  border-color: #60a5fa;
  color: #1e40af;
}
.product-action-btn.new:hover {
  background: #60a5fa;
  color: white;
}
.product-action-btn.delete:hover {
  border-color: #f87171;
  color: #f87171;
}

/* 批量操作栏 */
.batch-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #f8f9fa;
  border-radius: 8px;
  margin-bottom: 12px;
}
.batch-info {
  font-size: 12px;
  color: #666;
}
.batch-actions {
  display: flex;
  gap: 8px;
}

/* 添加产品按钮 */
.add-product-btn {
  width: 100%;
  padding: 12px;
  border: 2px dashed #bfdbfe;
  border-radius: 10px;
  background: #fafbfc;
  font-size: 13px;
  color: #3b82f6;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}
.add-product-btn:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}

/* 操作按钮 */
.action-bar {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #f0f0f0;
  flex-shrink: 0;
}
.btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.btn-secondary {
  background: #f0f0f0;
  color: #666;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-primary {
  background: #3b82f6;
  color: white;
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.btn-success {
  background: #16a34a;
  color: white;
}
.btn-success:hover {
  opacity: 0.9;
}

/* 候选弹窗 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow: hidden;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid #f0f0f0;
}
.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: #333;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 12px;
  color: #999;
}
.modal-body {
  padding: 14px 22px;
  max-height: 50vh;
  overflow-y: auto;
}
.candidate-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.candidate-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 2px solid #f0f0f0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.candidate-item:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-item.selected {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-rank {
  width: 26px;
  height: 26px;
  background: #f0f0f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
}
.candidate-item:hover .candidate-rank,
.candidate-item.selected .candidate-rank {
  background: #3b82f6;
  color: white;
}
.candidate-info { flex: 1; }
.candidate-name {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin-bottom: 2px;
}
.candidate-meta {
  font-size: 11px;
  color: #999;
}
.candidate-similarity {
  padding: 3px 10px;
  background: #dcfce7;
  color: #166534;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid #f0f0f0;
  display: flex;
  gap: 10px;
}

/* 新建产品弹窗样式 */
.create-product-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 12px;
  color: #666;
  font-weight: 500;
}
.form-label .required {
  color: #f87171;
  margin-left: 2px;
}
.form-input, .form-select {
  padding: 10px 14px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  transition: all 0.2s;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: #3b82f6;
  background: #fafbff;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-hint {
  font-size: 11px;
  color: #999;
  margin-top: 2px;
}
.original-info-box {
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
  padding: 12px 14px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 16px;
}
.original-info-box .label {
  font-size: 11px;
  color: #3b82f6;
  margin-bottom: 4px;
}
.original-info-box .value {
  font-size: 13px;
  color: #333;
  font-weight: 500;
}

.customer-avatar i,
.recognition-icon i {
  font-size: inherit;
  line-height: 1;
}

/* Toast动画 */
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes slideUp {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
}


.paste-btn:hover { background:#059669; }
.search-input-wrapper { position:relative; margin-bottom:12px; }
.search-input-wrapper i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9ca3af; }
.search-input-wrapper input { padding-left:36px; }
.search-token-tag { display:inline-flex;align-items:center;padding:4px 12px;border-radius:14px;font-size:12px;cursor:pointer;border:1px solid #d1d5db;background:#f9fafb;color:#374151;transition:all 0.15s ease;white-space:nowrap; }
.search-token-tag:hover { background:#dbeafe;color:#1d4ed8;border-color:#93c5fd; }
.search-token-tag:active { transform:scale(0.95); }
.search-token-tag.active { background:#3b82f6;color:#fff;border-color:#3b82f6; }
.search-token-tag.active:hover { background:#2563eb;border-color:#2563eb; }
.order-success-icon { width:56px;height:56px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px; }
.order-detail-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px; }
.order-detail-row:last-child { border-bottom:none; }
.order-detail-label { color:#6b7280; }
.order-detail-value { color:#1f2937;font-weight:500; }
.match-mode-switcher { display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap; }
.match-mode-label { font-size:12px;color:#6b7280;white-space:nowrap; }
.match-mode-btn { padding:3px 12px;border-radius:12px;font-size:12px;border:1px solid #d1d5db;background:#f9fafb;color:#374151;cursor:pointer;transition:all 0.15s ease;outline:none; }
.match-mode-btn:hover { background:#dbeafe;color:#1d4ed8;border-color:#93c5fd; }
.match-mode-btn.active { background:#3b82f6;color:#fff;border-color:#3b82f6; }
.match-mode-btn.active:hover { background:#2563eb;border-color:#2563eb; }
.match-mode-hint { font-size:11px;color:#f59e0b;margin-top:-6px;margin-bottom:6px;padding-left:4px;white-space:nowrap; }
.match-mode-hint.hidden { display:none; }
.kw-highlight { background:#fef08a;color:#92400e;border-radius:2px;padding:0 1px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="ri-robot-2-line"></i> AI制单 <span style="font-size:12px;color:#8b5cf6;font-weight:400;">缓存优化版</span></h1>
  </div>

  <div id="cozeConfigPanel" style="background:white;border-radius:12px;padding:14px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <i class="ri-robot-2-line" style="color:#3b82f6;font-size:18px;"></i>
      <span style="font-size:13px;font-weight:600;color:#333;">Coze 智能体</span>
    </div>
    <button id="connectCozeBtn" onclick="initCozeSDK()" style="padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;">
      <i class="ri-play-line" style="font-size:14px;"></i>
      <span>启动智能体</span>
    </button>

  </div>

<script>

var currentCustomer = null;
var currentProducts = [];
var selectedCustomerId = null;
var editingProductIndex = null;
var creatingProductIndex = null;
var nextProductId = 100;

// ===== Coze SDK 初始化 =====

var cozeClient = null;
var cozeAccessToken = null;
var lastDetectedJSON = '';

async function fetchCozeToken() {
  try {
    var response = await fetch('/system/bot/token.xt');
    if (!response.ok) throw new Error('令牌接口返回错误: ' + response.status);
    var data = await response.json();
    if (data.ok !== 1 || !data.accessToken) throw new Error(data.msg || '获取令牌失败');
    return data.accessToken;
  } catch (e) {
    console.error('fetchCozeToken error:', e);
    throw e;
  }
}

async function initCozeSDK() {
  var btn = document.getElementById('connectCozeBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ri-loader-4-line" style="font-size:16px;animation:spin 1s linear infinite;"></i><span>获取授权...</span>';
  document.getElementById('apiStatus').textContent = '正在获取授权...';

  try {
    cozeAccessToken = await fetchCozeToken();

    if (typeof CozeWebSDK === 'undefined') {
      throw new Error('Coze SDK 未加载，请刷新页面');
    }

    if (cozeClient && typeof cozeClient.destroy === 'function') {
      cozeClient.destroy();
    }

    cozeClient = new CozeWebSDK.WebChatClient({
      config: {
        bot_id: '7638933573109792777',
      },
      auth: {
        type: 'token',
        token: cozeAccessToken,
        onRefreshToken: async function () {
          try {
            cozeAccessToken = await fetchCozeToken();
            return cozeAccessToken;
          } catch (e) {
            console.error('onRefreshToken error:', e);
            return cozeAccessToken;
          }
        }
      },
      ui: {
        base: {
          lang: 'zh-CN',
          zIndex: 50
        },
        asstBtn: {
          isNeed: true
        },
        chatBot: {
          title: '智能制单助手',
          uploadable: true,
          width: 460,
        },
        header: {
          isShow: true,
          isNeedClose: false
        }
      }
    });

    setTimeout(function() {
      if (cozeClient && typeof cozeClient.showChatBot === 'function') {
        cozeClient.showChatBot();
      }
    }, 500);

    document.getElementById('apiStatus').textContent = '已连接 ✅';
    document.getElementById('apiStatus').style.color = '#16a34a';

    btn.disabled = false;
    btn.innerHTML = '<i class="ri-check-line" style="font-size:14px;"></i><span>已连接</span>';
    btn.style.background = '#16a34a';

    showToast('智能体已启动');

  } catch (e) {
    console.error('Coze SDK 初始化失败:', e);
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-play-line" style="font-size:16px;"></i><span>启动智能体</span>';
    btn.style.background = '';
    document.getElementById('apiStatus').textContent = e.message;
    document.getElementById('apiStatus').style.color = '#e5484d';
    showToast('启动失败: ' + e.message);
  }
}

function isInCozeSDKArea(el) {
  while (el) {
    if (el.className && typeof el.className === 'string') {
      if (el.className.indexOf('coze-chat-sdk') !== -1 || el.className.indexOf('coz-') !== -1) {
        return true;
      }
    }
    el = el.parentElement;
  }
  return false;
}

function injectImageToCozeSDK(e) {
  try {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;

    var hasImage = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        hasImage = true;
        break;
      }
    }
    if (!hasImage) return;

    if (!isInCozeSDKArea(e.target)) return;

    var fileInput = document.querySelector('input.coze-chat-sdk-semi-upload-hidden-input');
    if (!fileInput) return;

    e.preventDefault();
    e.stopPropagation();

    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        var file = items[i].getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length === 0) return;

    var dataTransfer = new DataTransfer();
    files.forEach(function(f) { dataTransfer.items.add(f); });
    fileInput.files = dataTransfer.files;
    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
  } catch (e) {
    console.warn('injectImageToCozeSDK error:', e);
  }
}

document.addEventListener('paste', injectImageToCozeSDK, true);

// ===== 剪贴板监听逻辑 =====

var lastClipboardContent = '';
var clipboardPollTimer = null;

function isOrderJSON(text) {
  if (!text || text.length < 10) return false;
  if (text.indexOf('{') === -1) return false;
  return text.indexOf('"customer_name"') !== -1 ||
         text.indexOf('"customerName"') !== -1 ||
         text.indexOf('"customer"') !== -1 ||
         text.indexOf('"客户"') !== -1 ||
         text.indexOf('"doc_type"') !== -1 ||
         text.indexOf('"products"') !== -1 ||
         text.indexOf('"items"') !== -1 ||
         text.indexOf('"产品"') !== -1;
}

function tryReadClipboard() {
  if (!document.hasFocus()) return;
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  navigator.clipboard.readText().then(function(text) {
    if (text !== lastClipboardContent && text !== lastDetectedJSON && isOrderJSON(text)) {
      lastClipboardContent = text;
      handleClipboardText(text);
    }
  }).catch(function() {});
}

var resultArea = document.getElementById('resultSection');
if (resultArea) {
  resultArea.addEventListener('paste', function(e) {
    var text = (e.clipboardData || window.clipboardData).getData('text');
    if (text && isOrderJSON(text)) {
      lastClipboardContent = text;
      handleClipboardText(text);
    }
  });
}

window.addEventListener('focus', function() {
  setTimeout(tryReadClipboard, 200);
  setTimeout(tryReadClipboard, 800);
  setTimeout(tryReadClipboard, 1500);
});

document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(tryReadClipboard, 300);
    if (!clipboardPollTimer) clipboardPollTimer = setInterval(tryReadClipboard, 3000);
  } else {
    if (clipboardPollTimer) { clearInterval(clipboardPollTimer); clipboardPollTimer = null; }
  }
});

clipboardPollTimer = setInterval(tryReadClipboard, 3000);

if (navigator.clipboard && navigator.clipboard.readText) {
  navigator.clipboard.readText().then(function(text) {
    if (text) lastClipboardContent = text;
  }).catch(function() {});
}

function showMatchingLoading() {
  var emptyState = document.getElementById('emptyState');
  emptyState.style.display = 'none';

  var progressDiv = document.getElementById('matchProgress');
  if (!progressDiv) {
    progressDiv = document.createElement('div');
    progressDiv.id = 'matchProgress';
    progressDiv.style.cssText = 'background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:14px 16px; margin-bottom:12px;';
    var resultSection = document.getElementById('resultSection');
    resultSection.insertBefore(progressDiv, resultSection.firstChild);
  }

  progressDiv.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">'
    + '<div style="width:16px;height:16px;border:2px solid #93c5fd;border-top-color:#3b82f6;border-radius:50%;animation:matchSpin 0.8s linear infinite;"></div>'
    + '<span style="font-size:13px;font-weight:600;color:#3b82f6;">正在匹配客户和产品...</span></div>'
    + '<div style="font-size:12px;color:#6b7280;">正在查询拼音索引，请稍候</div>';

  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('productSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('resultSection').classList.add('active');
}

async function handleClipboardText(text) {
  var jsonStr = PinyinMatch.extractOrderJSON(text);
  if (!jsonStr) return;

  if (text === lastDetectedJSON) return;
  lastDetectedJSON = text;

  var t0 = performance.now();
  try {
    showMatchingLoading();
    await new Promise(function(resolve) { setTimeout(resolve, 30); });
    var normalized = PinyinMatch.normalizeOrderJSON(jsonStr);
    var matchStart = performance.now();
    var matchedProducts = await PinyinMatch.matchProductsFromRawList(normalized.products);
    var matchTime = (performance.now() - matchStart).toFixed(1);
    console.log('[Cache] handleClipboardText: matchProductsFromRawList took ' + matchTime + 'ms');

    var orderDraft = {
      source: 'clipboard',
      customer: {
        originalName: normalized.customer.originalName,
        recv: normalized.customer.recv || '',
        addr: normalized.customer.addr || '',
        matchType: 'none',
        status: 'pending'
      },
      products: matchedProducts,
      _matchTime: matchTime
    };

    showMatchProgress(orderDraft);
    showToast('已捕获订单JSON，匹配耗时 ' + matchTime + 'ms', 'success');
  } catch (e) {
    showToast('订单JSON解析失败', 'error');
  }
}

async function getLSCustomers() { return await PinyinMatch.getCustomersCached(); }
async function getLSProducts() { return await PinyinMatch.getProductsCached(); }
async function getLSProductMap() { return await PinyinMatch.getProductMapCached(); }
async function getLSCustomerMap() { return await PinyinMatch.getCustomerMapCached(); }

async function hasPinyinData() {
  return await PinyinMatch.hasPinyinDataAsync();
}

async function getPinyinDataStats() {
  return await PinyinMatch.getPinyinDataStatsAsync();
}

function showMatchProgress(data) {
  var emptyState = document.getElementById('emptyState');
  emptyState.style.display = 'none';

  var progressDiv = document.getElementById('matchProgress');
  if (!progressDiv) {
    progressDiv = document.createElement('div');
    progressDiv.id = 'matchProgress';
    progressDiv.style.cssText = 'background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:14px 16px; margin-bottom:12px;';
    var resultSection = document.getElementById('resultSection');
    resultSection.insertBefore(progressDiv, resultSection.firstChild);
  }

  progressDiv.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;"><i class="ri-search-line" style="color:#3b82f6;font-size:16px;"></i><span style="font-size:13px;font-weight:600;color:#3b82f6;">匹配中...</span></div>' +
    '<div style="font-size:12px;color:#6b7280;">正在查询客户和产品拼音索引</div>';

  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('productSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('resultSection').classList.add('active');

  setTimeout(async function() {
    try {
    await identifyCustomer(data.customer.originalName);

    var customerMatchType = 'none';
    var customerEl = document.getElementById('customerStatus');
    if (customerEl) {
      if (customerEl.classList.contains('confirmed')) customerMatchType = 'exact';
      else if (customerEl.classList.contains('pending')) customerMatchType = 'fuzzy';
    }

    var confirmedCount = data.products.filter(function(p) { return p.status === 'confirmed'; }).length;
    var pendingCount = data.products.filter(function(p) { return p.status === 'pending'; }).length;
    var errorCount = data.products.filter(function(p) { return p.status === 'error'; }).length;

    var matchHtml = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><i class="ri-check-double-line" style="color:#16a34a;font-size:16px;"></i><span style="font-size:13px;font-weight:600;color:#16a34a;">匹配完成</span></div>';

    matchHtml += '<div style="font-size:12px;margin-bottom:6px;"><strong>客户：</strong>' + data.customer.originalName + ' → ';
    if (customerMatchType === 'exact') {
      matchHtml += '<span style="color:#16a34a;">' + document.getElementById('customerName').textContent + '</span>（精确匹配）';
    } else if (customerMatchType === 'fuzzy') {
      matchHtml += '<span style="color:#f59e0b;">' + document.getElementById('customerName').textContent + '</span>（模糊匹配）';
    } else {
      matchHtml += '<span style="color:#ef4444;">未匹配</span>';
    }
    matchHtml += '</div>';

    matchHtml += '<div style="font-size:12px;margin-bottom:4px;"><strong>产品：</strong>';
    matchHtml += '<span style="color:#16a34a;">' + confirmedCount + '个确认</span>';
    if (pendingCount > 0) matchHtml += ' · <span style="color:#f59e0b;">' + pendingCount + '个待确认</span>';
    if (errorCount > 0) matchHtml += ' · <span style="color:#ef4444;">' + errorCount + '个未匹配</span>';
    if (data._matchTime) matchHtml += ' · <span style="color:#8b5cf6;">⏱ ' + data._matchTime + 'ms</span>';
    matchHtml += '</div>';

    matchHtml += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:4px;">';
    data.products.forEach(function(p, i) {
      var icon = p.status === 'confirmed' ? '✓' : p.status === 'error' ? '✗' : '○';
      var color = p.status === 'confirmed' ? '#16a34a' : p.status === 'error' ? '#ef4444' : '#f59e0b';
      matchHtml += '<div style="font-size:12px;color:#374151;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + icon + ' <span style="color:#6b7280;background:#f3f4f6;border:1px solid #e5e7eb;padding:1px 6px;border-radius:4px;font-size:11px;">原始: <strong>' + p.originalName + '</strong></span>';
      if (p.matchedName && p.matchedName !== p.originalName) {
        matchHtml += ' → <span style="color:' + color + ';font-weight:500;">' + p.matchedName + '</span>';
      }
      matchHtml += '</div>';
    });
    matchHtml += '</div>';

    progressDiv.innerHTML = matchHtml;

    await fillOrderDraft(data);
    } catch (e) {
      console.error('[Error] showMatchProgress:', e);
      progressDiv.innerHTML = '<div style="display:flex;align-items:center;gap:8px;"><i class="ri-error-warning-line" style="color:#ef4444;font-size:16px;"></i><span style="font-size:13px;font-weight:600;color:#ef4444;">匹配出错：' + e.message + '</span></div>';
    }
  }, 50);
}

async function identifyCustomer(customerName) {
  if (!customerName || !customerName.trim()) {
    currentCustomer = null;
    document.getElementById('customerName').textContent = '未提供客户名称';
    document.getElementById('customerMeta').textContent = '可在左侧手动搜索或新建';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
    return;
  }
  var customers = await getLSCustomers();
  var indexDb = await PinyinMatch.getCustomerIndexDbCached();
  var customerMap = await getLSCustomerMap();
  console.log('[Cache] identifyCustomer: customers=' + customers.length + ', indexDb=' + indexDb.length);
  if (customers.length === 0) {
    currentCustomer = null;
    document.getElementById('customerName').textContent = '未识别到客户';
    document.getElementById('customerMeta').textContent = '拼音数据未就绪';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
    return;
  }

  var exactKey = customerName.toLowerCase();
  var exactMatch = customers.find(function(c) { return c.name && c.name.toLowerCase() === exactKey; });
  if (exactMatch) {
    var cData = customerMap[String(exactMatch.id)];
    currentCustomer = [{ id: exactMatch.id, name: exactMatch.name, similarity: 100, address: cData ? (cData.address || '') : '', contact: cData ? (cData.contact || '') : '' }];
    await selectCustomer(currentCustomer[0]);
    updateCustomerMatchInfo(customerName, { id: exactMatch.id, name: exactMatch.name }, 'exact');
    return;
  }

  var asrPy = PinyinMatch.generatePinyinForText(customerName);
  var queryTokens = PinyinMatch.tokenizePinyin(asrPy.full);
  var minOverlap = PinyinMatch.getMinOverlap(queryTokens.length);
  var cInvertedIndex = await PinyinMatch.getCustomerTokenInvertedIndexCached();
  var candidateIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, cInvertedIndex, minOverlap);
  console.log('[Index] identifyCustomer: tokens=' + queryTokens.length + ', minOverlap=' + minOverlap + ', candidates=' + candidateIndices.length + '/' + indexDb.length);
  var matches = PinyinMatch.pinyinMatchWithCandidates(customerName, indexDb, candidateIndices, { threshold: 0.45 });
  if (matches.length === 0 && minOverlap > 1) {
    var fallbackIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, cInvertedIndex, 1);
    matches = PinyinMatch.pinyinMatchWithCandidates(customerName, indexDb, fallbackIndices, { threshold: 0.45 });
  }

  if (matches.length === 0) {
    currentCustomer = null;
    document.getElementById('customerName').textContent = '未识别到客户';
    document.getElementById('customerMeta').textContent = '点击手动搜索或新建';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
    return;
  }

  currentCustomer = matches.map(function(m) {
    var lsC = customerMap[String(m.id)];
    return { id: m.id, name: m.name, similarity: Math.round(m.score * 100), address: lsC ? (lsC.address || '') : '', contact: lsC ? (lsC.contact || '') : '' };
  });

  var best = matches[0];
  if (best.score >= 0.9) {
    await selectCustomer({ id: best.id, name: best.name });
    updateCustomerMatchInfo(customerName, { id: best.id, name: best.name }, 'exact');
  } else if (matches.length === 1 && best.score >= 0.8) {
    await selectCustomer({ id: best.id, name: best.name });
    updateCustomerMatchInfo(customerName, { id: best.id, name: best.name }, 'exact');
  } else {
    showCustomerCard(currentCustomer[0], 'pending');
    updateCustomerMatchInfo(customerName, currentCustomer[0], 'fuzzy');
  }
}

function updateCustomerMatchInfo(originalName, matchedCustomer, matchType) {
  var matchInfoEl = document.getElementById('customerMatchInfo');
  if (!matchInfoEl) {
    matchInfoEl = document.createElement('div');
    matchInfoEl.id = 'customerMatchInfo';
    matchInfoEl.style.cssText = 'font-size:11px;color:#6b7280;margin-top:4px;';
    var customerInfo = document.querySelector('.customer-info');
    if (customerInfo) customerInfo.appendChild(matchInfoEl);
  }

  if (matchType === 'exact') {
    matchInfoEl.innerHTML = '<i class="ri-check-line" style="color:#16a34a;"></i> <span style="color:#16a34a;">精确匹配</span> · <span style="color:#6b7280;background:#f3f4f6;border:1px solid #e5e7eb;padding:1px 6px;border-radius:4px;font-size:11px;"><i class="ri-voice-recognition-line" style="font-size:10px;color:#8b5cf6;"></i> 原始: <strong>' + PinyinMatch.escapeHtml(originalName) + '</strong></span>';
  } else if (matchType === 'fuzzy') {
    matchInfoEl.innerHTML = '<i class="ri-question-line" style="color:#f59e0b;"></i> <span style="color:#f59e0b;">模糊匹配</span> · <span style="color:#6b7280;background:#f3f4f6;border:1px solid #e5e7eb;padding:1px 6px;border-radius:4px;font-size:11px;"><i class="ri-voice-recognition-line" style="font-size:10px;color:#8b5cf6;"></i> 原始: <strong>' + PinyinMatch.escapeHtml(originalName) + '</strong></span> → ' + (matchedCustomer ? PinyinMatch.escapeHtml(matchedCustomer.name) : '');
  } else {
    matchInfoEl.innerHTML = '<i class="ri-close-line" style="color:#ef4444;"></i> <span style="color:#ef4444;">未匹配</span> · <span style="color:#6b7280;background:#f3f4f6;border:1px solid #e5e7eb;padding:1px 6px;border-radius:4px;font-size:11px;"><i class="ri-voice-recognition-line" style="font-size:10px;color:#8b5cf6;"></i> 原始: <strong>' + PinyinMatch.escapeHtml(originalName) + '</strong></span>';
  }
}

function calculateSubtotal(qty, price) {
  if (!qty || !price) return '-';
  var qtyNum = parseFloat(qty.replace(/[^0-9.]/g, ''));
  var priceNum = parseFloat(price.replace(/[^0-9.]/g, ''));
  if (isNaN(qtyNum) || isNaN(priceNum)) return '-';
  return '¥' + Math.round(qtyNum * priceNum).toLocaleString();
}

function editField(el, productIndex, fieldName) {
  if (el.classList.contains('editing')) return;

  var product = currentProducts[productIndex];
  var currentValue = fieldName === 'price'
    ? (product.price ? product.price.replace('元', '') : '')
    : fieldName === 'qty'
    ? (product.qty || '')
    : (product.note || '');

  var input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = fieldName === 'price' ? '输入单价' : fieldName === 'qty' ? '输入数量' : '输入备注';

  el.classList.add('editing');
  el.classList.remove('editable');
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  async function finishEdit() {
    var newValue = input.value.trim();

    if (fieldName === 'price') {
      var originalPrice = product.originalPrice || product.price || '';
      if (newValue) {
        product.price = newValue + '元';
        product._priceModified = (newValue + '元') !== originalPrice;
      } else {
        product.price = '';
        product._priceModified = !!originalPrice;
      }
    } else if (fieldName === 'qty') {
      var originalQty = product.originalQty || product.qty || '';
      product.qty = newValue;
      product._qtyModified = newValue !== originalQty;
    } else if (fieldName === 'note') {
      var originalNote = product.originalSpec || product.note || '';
      product.note = newValue;
      product._noteModified = newValue !== originalNote;
    }

    await renderProductList();
  }

  input.addEventListener('blur', finishEdit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    } else if (e.key === 'Escape') {
      input.removeEventListener('blur', finishEdit);
      (async function() { await renderProductList(); })();
    }
  });
}

function updateStats() {
  var confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  var pending = currentProducts.filter(function(p) { return p.status === 'pending' || p.status === 'error'; }).length;
  var total = currentProducts.length;

  document.getElementById('confirmedCount').textContent = confirmed + '/' + total;
  document.getElementById('pendingCount').textContent = pending + '/' + total;

  var generateBtn = document.getElementById('generateBtn');
  var customerConfirmed = selectedCustomerId && document.getElementById('customerCard').classList.contains('confirmed');
  if (pending > 0 || total === 0) {
    generateBtn.disabled = true;
    generateBtn.textContent = '还有' + pending + '个产品待确认';
  } else if (!customerConfirmed) {
    generateBtn.disabled = true;
    generateBtn.textContent = '请先确认客户';
  } else {
    generateBtn.disabled = false;
    generateBtn.textContent = '生成销售订单';
  }
}

var _matchMode = 'keyword';

async function fuzzyMatchByPinyin(name, limit) {
  if (!name) return [];
  var nameIndex = await PinyinMatch.getProductNameIndexCached();
  var indexDb = await PinyinMatch.getProductIndexDbCached();
  if (indexDb.length === 0) return [];
  var exactKey = name.toLowerCase();
  if (nameIndex[exactKey] && nameIndex[exactKey].length > 0) {
    return nameIndex[exactKey].slice(0, limit || 5).map(function(p) {
      return { id: p.id, name: p.name, spec: p.spec || '', model: p.model || '', code: 'PRD-' + p.id, sku: p.model || '-', category: '', matchScore: 100, score: 1, status: nameIndex[exactKey].length === 1 ? 'confirmed' : 'pending', matchType: nameIndex[exactKey].length === 1 ? 'auto' : 'candidate' };
    });
  }
  var asrPy = PinyinMatch.generatePinyinForText(name);
  var queryTokens = PinyinMatch.tokenizePinyin(asrPy.full);
  var minOverlap = PinyinMatch.getMinOverlap(queryTokens.length);
  var invertedIndex = await PinyinMatch.getTokenInvertedIndexCached();
  var candidateIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, invertedIndex, minOverlap);
  var matches = PinyinMatch.pinyinMatchWithCandidates(name, indexDb, candidateIndices, { threshold: 0.45 });
  if (matches.length === 0 && minOverlap > 1) {
    var fallbackIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, invertedIndex, 1);
    matches = PinyinMatch.pinyinMatchWithCandidates(name, indexDb, fallbackIndices, { threshold: 0.45 });
  }
  var confirmedId = null;
  if (matches.length > 0 && matches[0].score >= 0.9) confirmedId = matches[0].id;
  return matches.slice(0, limit || 5).map(function(m) {
    var isConfirmed = String(m.id) === String(confirmedId);
    return { id: m.id, name: m.name, spec: m.spec || '', model: m.model || '', code: 'PRD-' + m.id, sku: m.model || '-', category: '', matchScore: Math.round(m.score * 100), score: m.score, status: isConfirmed ? 'confirmed' : 'pending', matchType: isConfirmed ? 'auto' : (m.score >= 0.7 ? 'candidate' : 'fuzzy') };
  });
}

async function fuzzyMatchByKeyword(name, limit) {
  if (!name) return [];
  var nameIndex = await PinyinMatch.getProductNameIndexCached();
  var indexDb = await PinyinMatch.getProductIndexDbCached();
  var kwCache = await PinyinMatch.getProductKeywordCache();
  var kwInvertedIndex = await PinyinMatch.getKeywordInvertedIndexCached();
  if (indexDb.length === 0) return [];
  var exactKey = name.toLowerCase();
  if (nameIndex[exactKey] && nameIndex[exactKey].length > 0) {
    return nameIndex[exactKey].slice(0, limit || 5).map(function(p) {
      return { id: p.id, name: p.name, spec: p.spec || '', model: p.model || '', code: 'PRD-' + p.id, sku: p.model || '-', category: '', matchScore: 100, score: 1, status: nameIndex[exactKey].length === 1 ? 'confirmed' : 'pending', matchType: nameIndex[exactKey].length === 1 ? 'auto' : 'candidate' };
    });
  }
  var queryKwTokens = PinyinMatch.tokenizeChinese(name);
  var kwMinOverlap = queryKwTokens.length <= 2 ? 1 : Math.ceil(queryKwTokens.length * 0.3);
  var kwCandidateIndices = PinyinMatch.getKeywordCandidates(queryKwTokens, kwInvertedIndex, kwMinOverlap);
  var kwMatches = [];
  for (var kmi = 0; kmi < kwCandidateIndices.length; kmi++) {
    var kwIdx = kwCandidateIndices[kmi];
    var kwRec = kwCache[kwIdx];
    if (!kwRec) continue;
    var kwScore = PinyinMatch.keywordMatchScore(queryKwTokens, kwRec.keywords);
    if (kwScore >= 0.3) {
      var idxRec = indexDb[kwIdx];
      kwMatches.push({ id: idxRec ? idxRec.id : kwRec.id, name: idxRec ? idxRec.name : kwRec.name, model: idxRec ? (idxRec.model || '') : (kwRec.model || ''), spec: idxRec ? (idxRec.spec || '') : (kwRec.spec || ''), score: kwScore });
    }
  }
  kwMatches.sort(function(a, b) { return b.score - a.score; });
  var confirmedId = null;
  if (kwMatches.length > 0 && kwMatches[0].score >= 0.9) confirmedId = kwMatches[0].id;
  return kwMatches.slice(0, limit || 5).map(function(km) {
    var isConfirmed = String(km.id) === String(confirmedId);
    return { id: km.id, name: km.name, spec: km.spec || '', model: km.model || '', code: 'PRD-' + km.id, sku: km.model || '-', category: '', matchScore: Math.round(km.score * 100), score: km.score, status: isConfirmed ? 'confirmed' : 'pending', matchType: isConfirmed ? 'auto' : (km.score >= 0.7 ? 'candidate' : 'fuzzy') };
  });
}

async function fuzzyMatchProducts(name, limit, modelValue) {

}

async function fuzzyMatchByMixed(name, limit) {
  if (!name) return [];
  var nameIndex = await PinyinMatch.getProductNameIndexCached();
  var productMap = await getLSProductMap();
  var indexDb = await PinyinMatch.getProductIndexDbCached();
  var kwCache = await PinyinMatch.getProductKeywordCache();
  var kwInvertedIndex = await PinyinMatch.getKeywordInvertedIndexCached();
  console.log('[Cache] fuzzyMatchProducts: indexDb=' + indexDb.length);
  if (indexDb.length === 0) return [];

  var exactKey = name.toLowerCase();
  if (nameIndex[exactKey] && nameIndex[exactKey].length > 0) {
    return nameIndex[exactKey].slice(0, limit || 5).map(function(p) {
      return {
        id: p.id, name: p.name, spec: p.spec || '', model: p.model || '',
        code: 'PRD-' + p.id, sku: p.model || '-', category: '',
        matchScore: 100, score: 1,
        status: nameIndex[exactKey].length === 1 ? 'confirmed' : 'pending',
        matchType: nameIndex[exactKey].length === 1 ? 'auto' : 'candidate'
      };
    });
  }

  var asrPy = PinyinMatch.generatePinyinForText(name);
  var queryTokens = PinyinMatch.tokenizePinyin(asrPy.full);
  var minOverlap = PinyinMatch.getMinOverlap(queryTokens.length);
  var invertedIndex = await PinyinMatch.getTokenInvertedIndexCached();
  var candidateIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, invertedIndex, minOverlap);

  var queryKwTokens = PinyinMatch.tokenizeChinese(name);
  var kwMinOverlap = queryKwTokens.length <= 2 ? 1 : Math.ceil(queryKwTokens.length * 0.3);
  var kwCandidateIndices = PinyinMatch.getKeywordCandidates(queryKwTokens, kwInvertedIndex, kwMinOverlap);

  var allCandSet = {};
  for (var aci = 0; aci < candidateIndices.length; aci++) {
    allCandSet[candidateIndices[aci]] = true;
  }
  for (var aki = 0; aki < kwCandidateIndices.length; aki++) {
    allCandSet[kwCandidateIndices[aki]] = true;
  }
  var mergedIndices = [];
  for (var aidx in allCandSet) {
    mergedIndices.push(parseInt(aidx, 10));
  }

  console.log('[Index] fuzzyMatchProducts: pinyinCandidates=' + candidateIndices.length + ', kwCandidates=' + kwCandidateIndices.length + ', merged=' + mergedIndices.length + '/' + indexDb.length);

  var matches = PinyinMatch.pinyinMatchWithCandidates(name, indexDb, mergedIndices, { threshold: 0.45 });
  if (matches.length === 0 && minOverlap > 1) {
    var fallbackIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, invertedIndex, 1);
    matches = PinyinMatch.pinyinMatchWithCandidates(name, indexDb, fallbackIndices, { threshold: 0.45 });
  }

  var kwMatches = [];
  for (var kmi = 0; kmi < mergedIndices.length; kmi++) {
    var kwIdx = mergedIndices[kmi];
    var kwRec = kwCache[kwIdx];
    if (!kwRec) continue;
    var kwScore = PinyinMatch.keywordMatchScore(queryKwTokens, kwRec.keywords);
    if (kwScore >= 0.3) {
      var idxRec = indexDb[kwIdx];
      kwMatches.push({
        id: idxRec ? idxRec.id : kwRec.id,
        name: idxRec ? idxRec.name : kwRec.name,
        model: idxRec ? (idxRec.model || '') : (kwRec.model || ''),
        spec: idxRec ? (idxRec.spec || '') : (kwRec.spec || ''),
        score: kwScore,
        matchSource: 'keyword'
      });
    }
  }

  var fusedMap = {};
  for (var mi = 0; mi < matches.length; mi++) {
    var m = matches[mi];
    fusedMap[m.id] = { id: m.id, name: m.name, model: m.model, spec: m.spec, pinyinScore: m.score, kwScore: 0 };
  }
  for (var kj = 0; kj < kwMatches.length; kj++) {
    var km = kwMatches[kj];
    if (fusedMap[km.id]) {
      fusedMap[km.id].kwScore = km.score;
    } else {
      fusedMap[km.id] = { id: km.id, name: km.name, model: km.model, spec: km.spec, pinyinScore: 0, kwScore: km.score };
    }
  }

  var fusedResults = [];
  for (var fid in fusedMap) {
    var fr = fusedMap[fid];
    fr.fusedScore = fr.pinyinScore * 0.55 + fr.kwScore * 0.45;
    fusedResults.push(fr);
  }
  fusedResults.sort(function(a, b) { return b.fusedScore - a.fusedScore; });

  var confirmedId = null;
  if (fusedResults.length > 0 && fusedResults[0].fusedScore >= 0.9) {
    confirmedId = fusedResults[0].id;
  }
  return fusedResults.slice(0, limit || 5).map(function(fr) {
    var isConfirmed = String(fr.id) === String(confirmedId);
    return {
      id: fr.id, name: fr.name, spec: fr.spec || '', model: fr.model || '',
      code: 'PRD-' + fr.id, sku: fr.model || '-', category: '',
      matchScore: Math.round(fr.fusedScore * 100), score: fr.fusedScore,
      status: isConfirmed ? 'confirmed' : 'pending',
      matchType: isConfirmed ? 'auto' : (fr.fusedScore >= 0.7 ? 'candidate' : 'fuzzy')
    };
  });
}

function generateProductCode() {
  var prefix = 'PRD-NEW';
  var suffix = String(nextProductId).padStart(3, '0');
  nextProductId++;
  return prefix + '-' + suffix;
}

function extractUnit(qty) {
  if (!qty) return '个';
  var units = ['箱', '盒', '包', '本', '个', '套', '件'];
  for (var i = 0; i < units.length; i++) {
    if (qty.includes(units[i])) return units[i];
  }
  return '个';
}

async function searchCustomerByInput() {
  var keyword = document.getElementById('customerSearchInput').value.trim();
  var container = document.getElementById('customerSearchResults');
  if (!keyword) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">请输入关键字搜索</div>';
    return;
  }

  var results = [];
  var customers = await getLSCustomers();
  var customerMap = await getLSCustomerMap();
  var indexDb = await PinyinMatch.getCustomerIndexDbCached();
  if (customers.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#f59e0b;font-size:13px;"><i class="ri-alert-line"></i> 拼音数据未就绪，请先打开拼音工具获取数据</div>';
    return;
  }

  var exactKey = keyword.toLowerCase();
  var exactMatch = customers.find(function(c) { return c.name && c.name.toLowerCase() === exactKey; });
  if (exactMatch) {
    var cData = customerMap[String(exactMatch.id)];
    results = [{ id: exactMatch.id, name: exactMatch.name, address: cData ? (cData.address || '') : '', contact: cData ? (cData.contact || '') : '', similarity: 100 }];
  } else {
    var asrPy = PinyinMatch.generatePinyinForText(keyword);
    var queryTokens = PinyinMatch.tokenizePinyin(asrPy.full);
    var minOverlap = PinyinMatch.getMinOverlap(queryTokens.length);
    var cInvertedIndex = await PinyinMatch.getCustomerTokenInvertedIndexCached();
    var candidateIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, cInvertedIndex, minOverlap);
    var matches = PinyinMatch.pinyinMatchWithCandidates(keyword, indexDb, candidateIndices, { threshold: 0.45 });
    if (matches.length === 0 && minOverlap > 1) {
      var fallbackIndices = PinyinMatch.getCandidatesByTokenOverlap(queryTokens, cInvertedIndex, 1);
      matches = PinyinMatch.pinyinMatchWithCandidates(keyword, indexDb, fallbackIndices, { threshold: 0.45 });
    }
    results = matches.map(function(m) {
      var cData = customerMap[String(m.id)];
      return { id: m.id, name: m.name, address: cData ? (cData.address || '') : '', contact: cData ? (cData.contact || '') : '', similarity: Math.round(m.score * 100) };
    });
  }

  if (results.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配客户</div>';
    return;
  }
  results.sort(function(a, b) { return (b.similarity || 0) - (a.similarity || 0); });
  container.innerHTML = results.map(function(c, i) {
    return '<div class="candidate-item" onclick="selectCustomerFromSearch(\'' + PinyinMatch.escapeHtml(c.id) + '\')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + PinyinMatch.escapeHtml(c.name) + '</div>' +
        '<div class="candidate-meta">' + PinyinMatch.escapeHtml(c.address || '') + (c.contact ? ' | ' + PinyinMatch.escapeHtml(c.contact) : '') + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + (c.similarity || '-') + (c.similarity >= 90 ? '%' : '') + '</div>' +
    '</div>';
  }).join('');
}

  document.getElementById('productModalSubtitle').textContent = '搜索产品';
  document.querySelector('#productModal .modal-footer').innerHTML =
    '<button class="btn btn-secondary" onclick="closeModal(\'productModal\')">取消</button>';
  setTimeout(function() {
    var input = document.getElementById('productSearchInput');
    if (input) {
      input.focus();
      if (input.value.trim()) {
        initSearchTokenTags(input.value.trim());
        searchProductByInput();
      }
    }
  }, 100);
}

var _searchAllTokens = [];
var _searchSelectedTokens = [];

function onProductSearchInput() {
  var input = document.getElementById('productSearchInput');
  if (input) {
    var text = input.value.trim();
    _searchAllTokens = tokenizeChineseText(text);
    _searchSelectedTokens = _searchAllTokens.slice();
    renderSearchTokenTags();
  }
  PinyinMatch.debounce(searchProductByInput, 250)();
}

function tokenizeChineseText(text) {
  if (!text || !text.trim()) return [];
  var tokens = [];
  var current = '';
  var currentIsChinese = null;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    var isChinese = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch);
    var isAlphaNum = /[a-zA-Z0-9]/.test(ch);
    if (isChinese) {
      if (current && !currentIsChinese) {
        if (current.trim()) tokens.push(current.trim());
        current = '';
      }
      current += ch;
    } else if (isAlphaNum) {
      if (current && currentIsChinese) {
        if (current.trim()) tokens.push(current.trim());
        current = '';
      }
      current += ch;
    } else {
      if (current.trim()) tokens.push(current.trim());
      current = '';
    }
    currentIsChinese = isChinese;
  }
  if (current.trim()) tokens.push(current.trim());

  var result = [];
  for (var j = 0; j < tokens.length; j++) {
    var t = tokens[j];
    var isCh = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(t.charAt(0));
    if (isCh && t.length > 3) {
      var pos = 0;
      while (pos < t.length) {
        var remaining = t.length - pos;
        var chunkLen = 2;
        if (remaining === 3) chunkLen = 3;
        if (remaining === 1) chunkLen = 1;
        var chunk = t.substring(pos, pos + chunkLen);
        if (chunk.length >= 2) result.push(chunk);
        pos += chunkLen;
      }
    } else if (t.length >= 2) {
      result.push(t);
    }
  }
  return result;
}

function renderSearchTokenTags() {
  var container = document.getElementById('productSearchTokenTags');
  if (!container) return;
  if (_searchAllTokens.length <= 1) {
    container.innerHTML = '';
    return;
  }
  var html = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">';
  for (var i = 0; i < _searchAllTokens.length; i++) {
    var token = _searchAllTokens[i];
    var isSelected = _searchSelectedTokens.indexOf(token) >= 0;
    var cls = isSelected ? 'search-token-tag active' : 'search-token-tag';
    html += '<button class="' + cls + '" onclick="toggleSearchToken(this)" data-token="' + PinyinMatch.escapeHtml(token) + '">' + PinyinMatch.escapeHtml(token) + '</button>';
  }
  html += '</div>';
  container.innerHTML = html;
}

function toggleSearchToken(btn) {
  var token = btn.getAttribute('data-token');
  if (!token) return;
  var idx = _searchSelectedTokens.indexOf(token);
  if (idx >= 0) {
    _searchSelectedTokens.splice(idx, 1);
  } else {
    _searchSelectedTokens.push(token);
  }
  var input = document.getElementById('productSearchInput');
  if (input) {
    input.value = _searchSelectedTokens.join(' ');
  }
  renderSearchTokenTags();
  searchProductByInput();
  if (input) input.focus();
}

function initSearchTokenTags(text) {
  _searchAllTokens = tokenizeChineseText(text);
  _searchSelectedTokens = _searchAllTokens.slice();
  renderSearchTokenTags();
}

function highlightKeywords(html, tokens) {
  if (!tokens || tokens.length === 0) return html;
  var sorted = tokens.slice().sort(function(a, b) { return b.length - a.length; });
  for (var ti = 0; ti < sorted.length; ti++) {
    var t = sorted[ti];
    if (!t) continue;
    var escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(escaped, 'gi'), '<span class="kw-highlight">$&</span>');
  }
  return html;
}

function highlightKeywordsInText(text, tokens) {
  return highlightKeywords(PinyinMatch.escapeHtml(text), tokens);
}

async function searchProductByInput() {
  var keyword = (document.getElementById('productSearchInput') || {}).value || '';
  var trimmed = keyword.trim();
  var resultsContainer = document.getElementById('productSearchResults');
  if (!resultsContainer) return;
  if (!trimmed) {
    resultsContainer.innerHTML = '';
    return;
  }
  var results = await fuzzyMatchProducts(trimmed, 30);
  if (results.length === 0) {
    resultsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配产品</div>';
    return;
  }
  var kwTokens = (_matchMode === 'keyword' || _matchMode === 'mixed') ? _searchSelectedTokens : [];
  resultsContainer.innerHTML = results.map(function(p, i) {
    var nameDisplay = kwTokens.length > 0 ? highlightKeywordsInText(p.name, kwTokens) : PinyinMatch.escapeHtml(p.name);
    if (p.model) nameDisplay += ' <span style="color:#8b5cf6;font-size:11px;">' + PinyinMatch.escapeHtml(p.model) + '</span>';
    if (p.spec) nameDisplay += ' <span style="color:#9ca3af;font-size:11px;">' + PinyinMatch.escapeHtml(p.spec) + '</span>';
    var matchLabel = p.matchType === 'auto' ? '<span style="color:#16a34a;font-size:10px;">自动确认</span>' : p.matchType === 'candidate' ? '<span style="color:#d97706;font-size:10px;">候选推荐</span>' : '<span style="color:#9ca3af;font-size:10px;">模糊匹配</span>';
    return '<div class="candidate-item" onclick="selectProductForEdit(\'' + PinyinMatch.escapeHtml(p.id) + '\')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + nameDisplay + '</div>' +
        '<div class="candidate-meta">' + PinyinMatch.escapeHtml(p.code) + ' | SKU: ' + PinyinMatch.escapeHtml(p.sku) + ' ' + matchLabel + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + p.matchScore + '%</div>' +
    '</div>';
  }).join('');
}

function toggleProductSelect(index) {
  currentProducts[index].selected = !currentProducts[index].selected;
  var allChecked = currentProducts.every(function(p) { return p.selected; });
  var selectAllEl = document.getElementById('selectAll');
  if (selectAllEl) selectAllEl.checked = allChecked;
}

async function toggleSelectAll() {
  var checked = document.getElementById('selectAll').checked;
  currentProducts.forEach(function(p) { p.selected = checked; });
  await renderProductList();
}

async function batchConfirm() {
  var selectedCount = currentProducts.filter(function(p) { return p.selected; }).length;
  if (selectedCount === 0) {
    showToast('请先选择产品', 'warning');
    return;
  }
  var confirmed = 0, skipped = 0;
  var productMap = await getLSProductMap();
  for (var bi = 0; bi < currentProducts.length; bi++) {
    if (currentProducts[bi].selected && currentProducts[bi].status !== 'error') { currentProducts[bi].status = 'confirmed'; await fillProductStandardData(currentProducts[bi], productMap); confirmed++; }
    else if (currentProducts[bi].selected && currentProducts[bi].status === 'error') { skipped++; }
  }
  await renderProductList();
  if (skipped > 0) {
    showToast('已确认 ' + confirmed + ' 个，' + skipped + ' 个未匹配产品需手动处理', 'warning');
  } else {
    showToast('已确认 ' + confirmed + ' 个产品', 'success');
  }
}

function batchDelete() {
  var toDelete = currentProducts.filter(function(p) { return p.selected; });
  if (toDelete.length === 0) return;
  showConfirm('确定删除选中的' + toDelete.length + '个产品吗？', async function() {
    currentProducts = currentProducts.filter(function(p) { return !p.selected; });
    currentProducts.forEach(function(p, i) { p.index = i + 1; });
    await renderProductList();
  });
}

function resetForm() {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('productSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  document.getElementById('customerExtraFields').style.display = 'none';
  document.getElementById('contactField').style.display = 'none';
  document.getElementById('addressField').style.display = 'none';
  document.getElementById('contactValue').textContent = '-';
  document.getElementById('addressValue').textContent = '-';
  document.getElementById('confirmedCount').textContent = '0/0';
  document.getElementById('pendingCount').textContent = '0/0';
  currentProducts = [];
  currentCustomer = null;
  selectedCustomerId = null;
  editingProductIndex = null;
  creatingProductIndex = null;
  lastDetectedJSON = '';
  var progressDiv = document.getElementById('matchProgress');
  if (progressDiv) progressDiv.remove();
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function(text) {
      lastClipboardContent = text || '';
    }).catch(function() {
      lastClipboardContent = '';
    });
  } else {
    lastClipboardContent = '';
  }
}

function generateOrder() {
  var confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  var totalAmount = currentProducts.reduce(function(sum, p) {
    var subtotal = calculateSubtotal(p.qty, p.price);
    if (subtotal !== '-') {
      return sum + parseInt(subtotal.replace(/[^0-9]/g, ''));
    }
    return sum;
  }, 0);

  var newProducts = currentProducts.filter(function(p) { return p.status === 'new'; }).length;

  var body = document.getElementById('orderSuccessBody');
  body.innerHTML =
    '<div class="order-detail-row"><span class="order-detail-label">客户</span><span class="order-detail-value">' + document.getElementById('customerName').textContent + '</span></div>' +
    '<div class="order-detail-row"><span class="order-detail-label">产品数量</span><span class="order-detail-value">' + confirmed + '个</span></div>' +
    (newProducts > 0 ? '<div class="order-detail-row"><span class="order-detail-label">新建产品</span><span class="order-detail-value">' + newProducts + '个</span></div>' : '') +
    '<div class="order-detail-row"><span class="order-detail-label">订单总额</span><span class="order-detail-value" style="color:#16a34a;font-size:16px;">¥' + totalAmount.toLocaleString() + '</span></div>';

  document.getElementById('orderSuccessModal').classList.add('active');
}

window.onclick = function(event) {
  if (event.target.classList.contains('modal-overlay') && event.target.id !== 'productModal') {
    event.target.classList.remove('active');
  }
};

async function refreshPinyinStatus() {
  var el = document.getElementById('pinyinDataStatus');
  if (!el) return;
  if (await hasPinyinData()) {
    var stats = await getPinyinDataStats();
    el.innerHTML = '<span style="color:#16a34a;"><i class="ri-check-line"></i> 已就绪</span> · 客户 <strong>' + stats.customers + '</strong> 条（拼音 ' + stats.customerPinyin + '） · 产品 <strong>' + stats.products + '</strong> 条（拼音 ' + stats.productPinyin + '）';
  } else {
    el.innerHTML = '<span style="color:#f59e0b;"><i class="ri-alert-line"></i> 未就绪</span> · 请先打开拼音工具获取数据并生成拼音';
  }
}

PinyinMatch.init().then(function() {
  refreshPinyinStatus();
});

window.addEventListener('focus', function() {
  refreshPinyinStatus();
});
</script>
