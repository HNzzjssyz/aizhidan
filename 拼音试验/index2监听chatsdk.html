function identifyCustomer(customerName) {
  var customers = getLSCustomers();
  var cp = getLSCustomerPinyin();
  if (customers.length === 0) {
    currentCustomer = null;
    document.getElementById('customerName').textContent = '未识别到客户';
    document.getElementById('customerMeta').textContent = '拼音数据未就绪';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
    return;
  }
  var indexDb = customers.filter(function(c) { return cp[c.id]; }).map(function(c) {
    var py = cp[c.id];
    return { id: c.id, name: c.name, pinyin: py.pinyin, pinyin_abbr: py.pinyin_abbr };
  });

  var matches = pinyinMatch(customerName, indexDb, { threshold: 0.45 });

  if (matches.length === 0) {
    currentCustomer = null;
    document.getElementById('customerName').textContent = '未识别到客户';
    document.getElementById('customerMeta').textContent = '点击手动搜索或新建';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
  } else if (matches[0].score >= 0.9) {
    currentCustomer = matches.map(function(m) {
      var lsC = null;
      for (var k = 0; k < customers.length; k++) { if (String(customers[k].id) === String(m.id)) { lsC = customers[k]; break; } }
      return { id: m.id, name: m.name, similarity: Math.round(m.score * 100), address: lsC ? (lsC.address || '') : '', contact: lsC ? (lsC.contact || '') : '' };
    });
    var best = matches[0];
    selectCustomer({ id: best.id, name: best.name });
    updateCustomerMatchInfo(customerName, { id: best.id, name: best.name }, 'exact');
  } else {
    currentCustomer = matches.map(function(m) {
      var lsC = null;
      for (var k = 0; k < customers.length; k++) { if (String(customers[k].id) === String(m.id)) { lsC = customers[k]; break; } }
      return { id: m.id, name: m.name, similarity: Math.round(m.score * 100), address: lsC ? (lsC.address || '') : '', contact: lsC ? (lsC.contact || '') : '' };
    });
    showCustomerCard(currentCustomer[0], 'pending');
    updateCustomerMatchInfo(customerName, currentCustomer[0], 'fuzzy');
  }
}

function updateCustomerMatchInfo(originalName, matchedCustomer, matchType) {
  let matchInfoEl = document.getElementById('customerMatchInfo');
  if (!matchInfoEl) {
    matchInfoEl = document.createElement('div');
    matchInfoEl.id = 'customerMatchInfo';
    matchInfoEl.style.cssText = 'font-size:11px;color:#6b7280;margin-top:4px;';
    const customerInfo = document.querySelector('.customer-info');
    if (customerInfo) customerInfo.appendChild(matchInfoEl);
  }

  if (matchType === 'exact') {
    matchInfoEl.innerHTML = '<i class="ri-check-line" style="color:#16a34a;"></i> <span style="color:#16a34a;">精确匹配</span> · 原始: ' + originalName;
  } else if (matchType === 'fuzzy') {
    matchInfoEl.innerHTML = '<i class="ri-question-line" style="color:#f59e0b;"></i> <span style="color:#f59e0b;">模糊匹配</span> · 原始: ' + originalName + ' → ' + (matchedCustomer ? matchedCustomer.name : '');
  } else {
    matchInfoEl.innerHTML = '<i class="ri-close-line" style="color:#ef4444;"></i> <span style="color:#ef4444;">未匹配</span> · 原始: ' + originalName;
  }
}

function showCustomerCard(customer, status) {
  document.getElementById('customerName').textContent = customer.name;
  var metaParts = [];
  if (customer.address) metaParts.push(customer.address);
  if (customer.contact) metaParts.push(customer.contact);
  document.getElementById('customerMeta').textContent = metaParts.length > 0 ? metaParts.join(' | ') : '点击查看候选或手动搜索';

  const statusEl = document.getElementById('customerStatus');
  const cardEl = document.getElementById('customerCard');

  if (status === 'confirmed') {
    statusEl.textContent = '已确认';
    statusEl.className = 'customer-status confirmed';
    cardEl.className = 'customer-card confirmed';
  } else {
    statusEl.textContent = '多候选';
    statusEl.className = 'customer-status pending';
    cardEl.className = 'customer-card pending';
  }
}

function selectCustomer(customer) {
  selectedCustomerId = customer.id;
  var lsCustomers = getLSCustomers();
  var standardCustomer = null;
  for (var i = 0; i < lsCustomers.length; i++) {
    if (String(lsCustomers[i].id) === String(customer.id)) {
      standardCustomer = { id: lsCustomers[i].id, name: lsCustomers[i].name, address: lsCustomers[i].address || '', contact: lsCustomers[i].contact || '' };
      break;
    }
  }
  showCustomerCard(standardCustomer || customer, 'confirmed');
}

function showCustomerModal() {
  if (!currentCustomer || currentCustomer.length === 0) {
    searchCustomer();
    return;
  }

  const container = document.getElementById('customerCandidateList');
  container.innerHTML = currentCustomer.map(function(c, i) {
    return '<div class="candidate-item ' + (String(selectedCustomerId) === String(c.id) ? 'selected' : '') + '" onclick="selectCustomerFromModal(\'' + c.id + '\')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + c.name + '</div>' +
        '<div class="candidate-meta">' + (c.address || '') + (c.contact ? ' | ' + c.contact : '') + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + c.similarity + '%</div>' +
    '</div>';
  }).join('');

  document.getElementById('customerModal').classList.add('active');
}

function selectCustomerFromModal(id) {
  var customer = null;
  var customers = getLSCustomers();
  for (var i = 0; i < customers.length; i++) {
    if (String(customers[i].id) === String(id)) { customer = { id: customers[i].id, name: customers[i].name, address: customers[i].address || '', contact: customers[i].contact || '' }; break; }
  }
  if (customer) {
    currentCustomer = currentCustomer || [];
    for (var j = 0; j < currentCustomer.length; j++) {
      if (String(currentCustomer[j].id) === String(id)) {
        currentCustomer[j].address = customer.address;
        currentCustomer[j].contact = customer.contact;
        break;
      }
    }
    selectCustomer(customer);
    closeModal('customerModal');
  }
}

function renderProductList() {
  const container = document.getElementById('productList');
  document.getElementById('productCount').textContent = '(' + currentProducts.length + '个)';

  var batchBar = document.getElementById('batchBar');
  if (currentProducts.length > 1) {
    batchBar.style.display = 'flex';
  } else {
    batchBar.style.display = 'none';
  }

  if (currentProducts.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon"><i class="ri-inbox-line" style="font-size:48px;"></i></div>' +
        '<div class="empty-text">暂无产品，请通过对话添加</div>' +
      '</div>';
    return;
  }

  var allLsProducts = getLSProducts();

  container.innerHTML = currentProducts.map(function(product, idx) {
    var productInfo = null;
    var lookupId = product.matchedId || product.id;
    if (lookupId) {
      for (var i = 0; i < allLsProducts.length; i++) {
        if (String(allLsProducts[i].id) === String(lookupId)) {
          productInfo = { id: allLsProducts[i].id, name: allLsProducts[i].name, code: 'PRD-' + allLsProducts[i].id, sku: allLsProducts[i].model || '-', spec: allLsProducts[i].spec || '', category: '' };
          break;
        }
      }
    }
    productInfo = productInfo || {};
    const statusClass = product.status;
    const statusText = product.status === 'confirmed' ? '已确认' :
                      product.status === 'error' ? '未匹配' :
                      product.status === 'new' ? '新建' : '待确认';
    const matchTypeClass = product.matchType || 'none';
    const matchTypeText = {
      'sku': 'SKU匹配',
      'code': '编号匹配',
      'name': '品名匹配',
      'none': '未匹配',
      'new': '新建产品'
    }[product.matchType] || '待匹配';

    const displayName = productInfo.name || product.matchedName || product.originalName;
    const displaySpec = productInfo.spec || product.matchedSpec || product.originalSpec || '';
    const nameChanged = product.originalName && product.matchedName && product.originalName !== product.matchedName;

    const actionButtons = product.status === 'error'
      ? '<button class="product-action-btn new" onclick="showCreateProductModal(' + idx + ')"><i class="ri-add-line"></i> 新建产品</button>' +
        '<button class="product-action-btn" onclick="showProductModalForEdit(' + idx + ')"><i class="ri-refresh-line"></i> 重新匹配</button>' +
        '<button class="product-action-btn delete" onclick="deleteProduct(' + idx + ')"><i class="ri-delete-bin-line"></i> 删除</button>'
      : (product.status === 'confirmed' || product.status === 'new'
        ? '<button class="product-action-btn" onclick="unconfirmProduct(' + idx + ')"><i class="ri-close-line"></i> 取消确认</button>' +
          '<button class="product-action-btn" onclick="showProductModalForEdit(' + idx + ')"><i class="ri-refresh-line"></i> 重新匹配</button>' +
          '<button class="product-action-btn delete" onclick="deleteProduct(' + idx + ')"><i class="ri-delete-bin-line"></i> 删除</button>'
        : '<button class="product-action-btn new" onclick="confirmProduct(' + idx + ')"><i class="ri-check-line"></i> 确认</button>' +
          '<button class="product-action-btn" onclick="showProductModalForEdit(' + idx + ')"><i class="ri-refresh-line"></i> 重新匹配</button>' +
          '<button class="product-action-btn delete" onclick="deleteProduct(' + idx + ')"><i class="ri-delete-bin-line"></i> 删除</button>'
      );

    return '<div class="product-item ' + statusClass + '" data-index="' + idx + '">' +
      '<div class="product-header">' +
        '<input type="checkbox" ' + (product.selected ? 'checked' : '') + ' onchange="toggleProductSelect(' + idx + ')" style="margin-right:4px;flex-shrink:0;cursor:pointer;">' +
        '<div class="product-index">' + product.index + '</div>' +
        '<div class="product-main">' +
          '<div class="product-name-row">' +
            '<div class="product-name">' + displayName + ' ' + displaySpec + '</div>' +
            '<span class="product-match-type ' + matchTypeClass + '">' + matchTypeText + '</span>' +
          '</div>' +
          (nameChanged ? '<div style="font-size:10px;color:#9ca3af;margin-top:1px;"><i class="ri-arrow-right-line" style="font-size:10px;"></i> 原始: ' + product.originalName + '</div>' : '') +
          '<div class="product-code">' + (productInfo.code || product.matchedCode || product.newCode || '未识别编号') + ' | SKU: ' + (productInfo.sku || product.matchedSku || product.newSku || '-') + '</div>' +
        '</div>' +
        '<div class="product-status ' + statusClass + '" onclick="' + (product.status === 'error' ? 'showCreateProductModal(' + idx + ')' : 'showProductModalForEdit(' + idx + ')') + '">' + statusText + '</div>' +
      '</div>' +
      '<div class="product-details">' +
        '<div class="detail-item"><div class="detail-label">数量</div><div class="detail-value editable ' + (!product.qty ? 'empty' : '') + (product._qtyModified ? ' modified' : '') + '" onclick="editField(this,' + idx + ',\'qty\')">' + (product.qty || '-') + '</div></div>' +
        '<div class="detail-item"><div class="detail-label">单价</div><div class="detail-value editable ' + (!product.price ? 'empty' : '') + (product._priceModified ? ' modified' : '') + '" onclick="editField(this,' + idx + ',\'price\')">' + (product.price || '待询价') + '</div></div>' +
        '<div class="detail-item"><div class="detail-label">小计</div><div class="detail-value">' + calculateSubtotal(product.qty, product.price) + '</div></div>' +
        '<div class="detail-item"><div class="detail-label">备注</div><div class="detail-value editable ' + (!product.note ? 'empty' : '') + (product._noteModified ? ' modified' : '') + '" onclick="editField(this,' + idx + ',\'note\')">' + (product.note || '-') + '</div></div>' +
      '</div>' +
      '<div class="product-actions-row">' + actionButtons + '</div>' +
    '</div>';
  }).join('');

  updateStats();
}

function calculateSubtotal(qty, price) {
  if (!qty || !price) return '-';
  const qtyNum = parseInt(qty.replace(/[^0-9]/g, ''));
  const priceNum = parseInt(price.replace(/[^0-9]/g, ''));
  if (isNaN(qtyNum) || isNaN(priceNum)) return '-';
  return '¥' + (qtyNum * priceNum).toLocaleString();
}

function editField(el, productIndex, fieldName) {
  if (el.classList.contains('editing')) return;

  const product = currentProducts[productIndex];
  const currentValue = fieldName === 'price'
    ? (product.price ? product.price.replace('元', '') : '')
    : fieldName === 'qty'
    ? (product.qty || '')
    : (product.note || '');

  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = fieldName === 'price' ? '输入单价' : fieldName === 'qty' ? '输入数量' : '输入备注';

  el.classList.add('editing');
  el.classList.remove('editable');
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  function finishEdit() {
    const newValue = input.value.trim();

    if (fieldName === 'price') {
      const originalPrice = product.originalPrice || product.price || '';
      if (newValue) {
        product.price = newValue + '元';
        product._priceModified = (newValue + '元') !== originalPrice;
      } else {
        product.price = '';
        product._priceModified = !!originalPrice;
      }
    } else if (fieldName === 'qty') {
      const originalQty = product.originalQty || product.qty || '';
      product.qty = newValue;
      product._qtyModified = newValue !== originalQty;
    } else if (fieldName === 'note') {
      const originalNote = product.originalSpec || product.note || '';
      product.note = newValue;
      product._noteModified = newValue !== originalNote;
    }

    renderProductList();
  }

  input.addEventListener('blur', finishEdit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    } else if (e.key === 'Escape') {
      input.removeEventListener('blur', finishEdit);
      renderProductList();
    }
  });
}

function updateStats() {
  const confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  const pending = currentProducts.filter(function(p) { return p.status === 'pending' || p.status === 'error'; }).length;
  const total = currentProducts.length;

  document.getElementById('confirmedCount').textContent = confirmed + '/' + total;
  document.getElementById('pendingCount').textContent = pending + '/' + total;

  const generateBtn = document.getElementById('generateBtn');
  var customerConfirmed = selectedCustomerId && document.getElementById('customerCard').classList.contains('confirmed');
  if (pending > 0 || total === 0) {
    generateBtn.disabled = true;
    generateBtn.textContent = '还有' + pending + '个产品待确认';
  } else if (!customerConfirmed) {
    generateBtn.disabled = true;
    generateBtn.textContent = '请先确认客户';
  } else {
    generateBtn.disabled = false;
    generateBtn.textContent = '生成销售订单';
  }
}

function showProductModalForEdit(index) {
  editingProductIndex = index;
  creatingProductIndex = index;
  const product = currentProducts[index];

  const candidates = fuzzyMatchProducts(product.originalName || product.matchedName, 5);

  const container = document.getElementById('productCandidateList');
  document.getElementById('productModalSubtitle').textContent = '重新匹配: ' + (product.originalName || product.matchedName);

  if (candidates.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:32px;color:#999;"><i class="ri-search-line" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.4;"></i>未找到相似产品<br><span style="font-size:11px;">请点击下方"新建产品"创建</span></div>';
  } else {
    container.innerHTML = candidates.map(function(p, i) {
      return '<div class="candidate-item ' + (String(product.matchedId || product.id) === String(p.id) ? 'selected' : '') + '" onclick="selectProductForEdit(\'' + p.id + '\')">' +
        '<div class="candidate-rank">' + (i + 1) + '</div>' +
        '<div class="candidate-info">' +
          '<div class="candidate-name">' + p.name + ' ' + p.spec + '</div>' +
          '<div class="candidate-meta">' + p.code + ' | SKU: ' + p.sku + ' | ' + p.category + '</div>' +
        '</div>' +
        '<div class="candidate-similarity">' + p.matchScore + '%</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('productModal').classList.add('active');
}

function fuzzyMatchProducts(name, limit) {
  if (!name) return [];
  return fuzzyMatchProductsFromLS(name, limit);
}

function fuzzyMatchProductsFromLS(name, limit) {
  var products = getLSProducts();
  var pp = getLSProductPinyin();
  if (products.length === 0) return [];
  var indexDb = products.filter(function(p) { return pp[p.id]; }).map(function(p) {
    var py = pp[p.id];
    return { id: p.id, name: p.name, model: p.model || '', spec: p.spec || '', pinyin: py.pinyin, pinyin_abbr: py.pinyin_abbr };
  });

  var matches = pinyinMatch(name, indexDb, { threshold: 0.45 });

  return matches.slice(0, limit || 5).map(function(m) {
    return {
      id: m.id, name: m.name, spec: m.spec || '', model: m.model || '',
      code: 'PRD-' + m.id, sku: m.model || '-', category: '',
      matchScore: Math.round(m.score * 100), matchType: m.score >= 0.9 ? 'auto' : m.score >= 0.7 ? 'candidate' : 'fuzzy'
    };
  });
}

function createNewProductFromModal() {
  closeModal('productModal');
  if (creatingProductIndex !== null) {
    showCreateProductModal(creatingProductIndex);
  }
}

function showCreateProductModal(index) {
  creatingProductIndex = index;
  const product = currentProducts[index];

  const originalInfo = (product.originalName + ' ' + product.qty + ' ' + product.price + ' ' + (product.note || '')).trim();
  document.getElementById('originalProductInfo').textContent = originalInfo || '无原始识别信息';

  document.getElementById('newProductName').value = product.originalName || product.matchedName || '';
  document.getElementById('newProductCode').value = generateProductCode();
  document.getElementById('newProductSku').value = '';
  document.getElementById('newProductSpec').value = '';
  document.getElementById('newProductUnit').value = extractUnit(product.qty) || '个';
  document.getElementById('newProductCategory').value = '其他';
  document.getElementById('newProductNote').value = product.note || '';

  document.getElementById('createProductModal').classList.add('active');
}

function generateProductCode() {
  const prefix = 'PRD-NEW';
  const suffix = String(nextProductId).padStart(3, '0');
  nextProductId++;
  return prefix + '-' + suffix;
}

function extractUnit(qty) {
  if (!qty) return '个';
  const units = ['箱', '盒', '包', '本', '个', '套', '件'];
  for (let i = 0; i < units.length; i++) {
    if (qty.includes(units[i])) return units[i];
  }
  return '个';
}

function saveNewProduct() {
  const name = document.getElementById('newProductName').value.trim();
  const code = document.getElementById('newProductCode').value.trim();

  if (!name || !code) {
    showToast('请填写必填项：产品名称和产品编号');
    return;
  }

  if (creatingProductIndex !== null) {
    const product = currentProducts[creatingProductIndex];

    product.matchedName = name;
    product.originalName = product.originalName || name;
    product.newCode = code;
    product.newSku = document.getElementById('newProductSku').value.trim();
    product.spec = document.getElementById('newProductSpec').value.trim();
    product.unit = document.getElementById('newProductUnit').value;
    product.category = document.getElementById('newProductCategory').value;
    product.note = document.getElementById('newProductNote').value.trim();
    product.status = 'new';
    product.matchType = 'new';
    product.id = nextProductId - 1;

    renderProductList();
    closeModal('createProductModal');
    creatingProductIndex = null;

    showToast('产品新建成功并已确认');
  }
}

function showToast(message, type) {
  var bgColor = type === 'warning' ? '#f59e0b' : type === 'error' ? '#ef4444' : '#16a34a';
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:' + bgColor + ';color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;animation:slideDown 0.3s ease;';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(function() {
    toast.style.animation = 'slideUp 0.3s ease';
    setTimeout(function() { toast.remove(); }, 300);
  }, 2000);
}

function showConfirm(message, onConfirm) {
  document.getElementById('confirmModalBody').textContent = message;
  const okBtn = document.getElementById('confirmModalOkBtn');
  const newBtn = okBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(newBtn, okBtn);
  newBtn.addEventListener('click', function() {
    closeModal('confirmModal');
    if (onConfirm) onConfirm();
  });
  document.getElementById('confirmModal').classList.add('active');
}

function selectProductForEdit(productId) {
  if (editingProductIndex !== null) {
    var matchedProduct = null;
    var products = getLSProducts();
    for (var i = 0; i < products.length; i++) {
      if (String(products[i].id) === String(productId)) {
        matchedProduct = { id: products[i].id, name: products[i].name, code: 'PRD-' + products[i].id, sku: products[i].model || '-', spec: products[i].spec || '' };
        break;
      }
    }
    currentProducts[editingProductIndex].id = productId;
    currentProducts[editingProductIndex].matchedId = productId;
    currentProducts[editingProductIndex].matchedName = matchedProduct ? matchedProduct.name : '';
    currentProducts[editingProductIndex].matchedCode = matchedProduct ? matchedProduct.code : '';
    currentProducts[editingProductIndex].matchedSku = matchedProduct ? matchedProduct.sku : '';
    currentProducts[editingProductIndex].matchedSpec = matchedProduct ? matchedProduct.spec : '';
    currentProducts[editingProductIndex].status = 'confirmed';
    currentProducts[editingProductIndex].matchType = 'sku';
    renderProductList();
    closeModal('productModal');
    editingProductIndex = null;
    creatingProductIndex = null;
  }
}

function confirmAllProducts() {
  var confirmed = 0, skipped = 0;
  currentProducts.forEach(function(p) {
    if (p.status !== 'error') { p.status = 'confirmed'; fillProductStandardData(p); confirmed++; }
    else { skipped++; }
  });
  renderProductList();
  if (skipped > 0) {
    showToast('已确认 ' + confirmed + ' 个产品，' + skipped + ' 个未匹配产品需手动处理', 'warning');
  } else {
    showToast('全部 ' + confirmed + ' 个产品已确认', 'success');
  }
}

function addProduct() {
  const newIndex = currentProducts.length + 1;
  currentProducts.push({
    index: newIndex,
    originalName: '新产品',
    matchedName: '',
    matchedCode: '',
    matchedSku: '',
    matchedSpec: '',
    qty: '',
    price: '',
    note: '',
    status: 'error',
    matchType: 'none',
    id: null
  });
  renderProductList();

  setTimeout(function() {
    const list = document.getElementById('productList');
    list.scrollTop = list.scrollHeight;
  }, 100);
}

function fillProductStandardData(product) {
  var lookupId = product.matchedId || product.id;
  if (!lookupId) return;
  var lsProducts = getLSProducts();
  for (var i = 0; i < lsProducts.length; i++) {
    if (String(lsProducts[i].id) === String(lookupId)) {
      product.matchedName = lsProducts[i].name || product.matchedName;
      product.matchedCode = 'PRD-' + lsProducts[i].id;
      product.matchedSku = lsProducts[i].model || '-';
      product.matchedSpec = lsProducts[i].spec || '';
      break;
    }
  }
}

function confirmProduct(index) {
  var product = currentProducts[index];
  product.status = 'confirmed';
  fillProductStandardData(product);
  renderProductList();
}

function unconfirmProduct(index) {
  currentProducts[index].status = 'pending';
  renderProductList();
}

function deleteProduct(index) {
  showConfirm('确定删除此产品吗？', function() {
    currentProducts.splice(index, 1);
    currentProducts.forEach(function(p, i) { p.index = i + 1; });
    renderProductList();
  });
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function searchCustomer() {
  closeModal('customerModal');
  var originalName = document.getElementById('customerName').textContent;
  if (originalName === '未识别到客户' || originalName === '-') originalName = '';
  var matchInfoEl = document.getElementById('customerMatchInfo');
  if (matchInfoEl && !originalName) {
    var text = matchInfoEl.textContent || '';
    var m = text.match(/原始:\s*(.+)/);
    if (m) originalName = m[1].trim();
  }
  const searchInput = document.getElementById('customerSearchInput');
  searchInput.value = originalName;
  document.getElementById('customerSearchResults').innerHTML = '';
  document.getElementById('customerSearchModal').classList.add('active');
  setTimeout(function() {
    searchInput.focus();
    if (originalName.trim()) searchCustomerByInput();
  }, 100);
}

function searchCustomerByInput() {
  const keyword = document.getElementById('customerSearchInput').value.trim();
  const container = document.getElementById('customerSearchResults');
  if (!keyword) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">请输入关键字搜索</div>';
    return;
  }

  var results = [];
  var customers = getLSCustomers();
  var cp = getLSCustomerPinyin();
  if (customers.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#f59e0b;font-size:13px;"><i class="ri-alert-line"></i> 拼音数据未就绪，请先打开拼音工具获取数据</div>';
    return;
  }
  var indexDb = customers.filter(function(c) { return cp[c.id]; }).map(function(c) {
    var py = cp[c.id];
    return { id: c.id, name: c.name, pinyin: py.pinyin, pinyin_abbr: py.pinyin_abbr };
  });
  var matches = pinyinMatch(keyword, indexDb, { threshold: 0.45 });
  results = matches.map(function(m) {
    return { id: m.id, name: m.name, address: '', contact: '', similarity: Math.round(m.score * 100) };
  });

  if (results.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配客户</div>';
    return;
  }
  results.sort(function(a, b) { return (b.similarity || 0) - (a.similarity || 0); });
  container.innerHTML = results.map(function(c, i) {
    return '<div class="candidate-item" onclick="selectCustomerFromSearch(\'' + c.id + '\')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + c.name + '</div>' +
        '<div class="candidate-meta">' + (c.address || '') + (c.contact ? ' | ' + c.contact : '') + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + (c.similarity || '-') + (c.similarity >= 90 ? '%' : '') + '</div>' +
    '</div>';
  }).join('');
}

function selectCustomerFromSearch(id) {
  var customer = null;
  var customers = getLSCustomers();
  for (var i = 0; i < customers.length; i++) {
    if (String(customers[i].id) === String(id)) { customer = { id: customers[i].id, name: customers[i].name, address: customers[i].address || '', contact: customers[i].contact || '' }; break; }
  }
  if (customer) {
    currentCustomer = [{ id: customer.id, name: customer.name, similarity: 100, address: customer.address, contact: customer.contact }];
    selectCustomer(customer);
    closeModal('customerSearchModal');
  }
}

function searchProduct() {
  var currentName = '';
  if (editingProductIndex !== null && currentProducts[editingProductIndex]) {
    currentName = currentProducts[editingProductIndex].originalName || currentProducts[editingProductIndex].matchedName || '';
  }
  var container = document.getElementById('productCandidateList');
  container.innerHTML =
    '<div style="margin-bottom:8px;"><button class="action-btn" onclick="backToProductCandidates()" style="font-size:11px;padding:4px 10px;"><i class="ri-arrow-left-line"></i> 返回候选列表</button></div>' +
    '<div class="search-input-wrapper">' +
      '<i class="ri-search-line"></i>' +
      '<input type="text" id="productSearchInput" class="form-input" placeholder="输入产品名称、拼音或首字母搜索..." oninput="searchProductByInput()" style="width:100%;" value="' + currentName.replace(/"/g, '&quot;') + '">' +
    '</div>' +
    '<div id="productSearchResults"></div>';
  document.getElementById('productModalSubtitle').textContent = '搜索产品';
  setTimeout(function() {
    var input = document.getElementById('productSearchInput');
    if (input) {
      input.focus();
      if (input.value.trim()) searchProductByInput();
    }
  }, 100);
}

function backToProductCandidates() {
  if (editingProductIndex !== null) {
    showProductModalForEdit(editingProductIndex);
  }
}

function searchProductByInput() {
  var keyword = (document.getElementById('productSearchInput') || {}).value || '';
  var trimmed = keyword.trim();
  var resultsContainer = document.getElementById('productSearchResults');
  if (!resultsContainer) return;
  if (!trimmed) {
    resultsContainer.innerHTML = '';
    return;
  }
  var results = fuzzyMatchProducts(trimmed, 10);
  if (results.length === 0) {
    resultsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配产品</div>';
    return;
  }
  resultsContainer.innerHTML = results.map(function(p, i) {
    var nameDisplay = p.name;
    if (p.model) nameDisplay += ' <span style="color:#8b5cf6;font-size:11px;">' + p.model + '</span>';
    if (p.spec) nameDisplay += ' <span style="color:#9ca3af;font-size:11px;">' + p.spec + '</span>';
    var matchLabel = p.matchType === 'auto' ? '<span style="color:#16a34a;font-size:10px;">自动确认</span>' : p.matchType === 'candidate' ? '<span style="color:#d97706;font-size:10px;">候选推荐</span>' : '<span style="color:#9ca3af;font-size:10px;">模糊匹配</span>';
    return '<div class="candidate-item" onclick="selectProductForEdit(\'' + p.id + '\')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + nameDisplay + '</div>' +
        '<div class="candidate-meta">' + p.code + ' | SKU: ' + p.sku + ' ' + matchLabel + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + p.matchScore + '%</div>' +
    '</div>';
  }).join('');
}

function toggleProductSelect(index) {
  currentProducts[index].selected = !currentProducts[index].selected;
  var allChecked = currentProducts.every(function(p) { return p.selected; });
  var selectAllEl = document.getElementById('selectAll');
  if (selectAllEl) selectAllEl.checked = allChecked;
}

function toggleSelectAll() {
  const checked = document.getElementById('selectAll').checked;
  currentProducts.forEach(function(p) { p.selected = checked; });
  renderProductList();
}

function batchConfirm() {
  var selectedCount = currentProducts.filter(function(p) { return p.selected; }).length;
  if (selectedCount === 0) {
    showToast('请先选择产品', 'warning');
    return;
  }
  var confirmed = 0, skipped = 0;
  currentProducts.forEach(function(p) {
    if (p.selected && p.status !== 'error') { p.status = 'confirmed'; fillProductStandardData(p); confirmed++; }
    else if (p.selected && p.status === 'error') { skipped++; }
  });
  renderProductList();
  if (skipped > 0) {
    showToast('已确认 ' + confirmed + ' 个，' + skipped + ' 个未匹配产品需手动处理', 'warning');
  } else {
    showToast('已确认 ' + confirmed + ' 个产品', 'success');
  }
}

function batchDelete() {
  const toDelete = currentProducts.filter(function(p) { return p.selected; });
  if (toDelete.length === 0) return;
  showConfirm('确定删除选中的' + toDelete.length + '个产品吗？', function() {
    currentProducts = currentProducts.filter(function(p) { return !p.selected; });
    currentProducts.forEach(function(p, i) { p.index = i + 1; });
    renderProductList();
  });
}

function resetForm() {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('productSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  currentProducts = [];
  currentCustomer = null;
  selectedCustomerId = null;
  editingProductIndex = null;
  creatingProductIndex = null;
  lastDetectedJSON = '';
  cozeLastMsgIds = {};
  initialMessageIds = {};
  isPollingInitialized = false;
  updatePollUI('listening');
  const progressDiv = document.getElementById('matchProgress');
  if (progressDiv) progressDiv.remove();
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function(text) {
      lastClipboardContent = text || '';
    }).catch(function() {
      lastClipboardContent = '';
    });
  } else {
    lastClipboardContent = '';
  }
  
  // 重新初始化轮询，记录新的已有消息基准
  startCozePolling();
}

function generateOrder() {
  const confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  const totalAmount = currentProducts.reduce(function(sum, p) {
    const subtotal = calculateSubtotal(p.qty, p.price);
    if (subtotal !== '-') {
      return sum + parseInt(subtotal.replace(/[^0-9]/g, ''));
    }
    return sum;
  }, 0);

  const newProducts = currentProducts.filter(function(p) { return p.status === 'new'; }).length;

  const body = document.getElementById('orderSuccessBody');
  body.innerHTML =
    '<div class="order-detail-row"><span class="order-detail-label">客户</span><span class="order-detail-value">' + document.getElementById('customerName').textContent + '</span></div>' +
    '<div class="order-detail-row"><span class="order-detail-label">产品数量</span><span class="order-detail-value">' + confirmed + '个</span></div>' +
    (newProducts > 0 ? '<div class="order-detail-row"><span class="order-detail-label">新建产品</span><span class="order-detail-value">' + newProducts + '个</span></div>' : '') +
    '<div class="order-detail-row"><span class="order-detail-label">订单总额</span><span class="order-detail-value" style="color:#16a34a;font-size:16px;">¥' + totalAmount.toLocaleString() + '</span></div>';

  document.getElementById('orderSuccessModal').classList.add('active');
}

window.onclick = function(event) {
  if (event.target.classList.contains('modal-overlay')) {
    event.target.classList.remove('active');
  }
};

function refreshPinyinStatus() {
  var el = document.getElementById('pinyinDataStatus');
  if (!el) return;
  if (hasPinyinData()) {
    var stats = getPinyinDataStats();
    el.innerHTML = '<span style="color:#16a34a;"><i class="ri-check-line"></i> 已就绪</span> · 客户 <strong>' + stats.customers + '</strong> 条（拼音 ' + stats.customerPinyin + '） · 产品 <strong>' + stats.products + '</strong> 条（拼音 ' + stats.productPinyin + '）';
  } else {
    el.innerHTML = '<span style="color:#f59e0b;"><i class="ri-alert-line"></i> 未就绪</span> · 请先打开拼音工具获取数据并生成拼音';
  }
}

refreshPinyinStatus();

window.addEventListener('storage', function(e) {
  if (e.key && e.key.indexOf('pinyin_tool_') === 0) {
    refreshPinyinStatus();
  }
});

window.addEventListener('focus', function() {
  refreshPinyinStatus();
});
</script>
</body>
</html>
