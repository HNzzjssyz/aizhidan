<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI制单 - Coze消息轮询版</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: calc(100vw - 750px);
  margin: 0;
  padding-left: 24px;
}
.header {
  text-align: center;
  color: #1f2937;
  margin-bottom: 24px;
}
.header h1 { font-size: 26px; }

.main-layout {
  display: block;
}

/* 识别结果区域 */
.result-section {
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  min-height: calc(100vh - 120px);
}
.result-section.active { display: block; }

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid #f0f0f0;
}
.result-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-value {
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
}
.stat-value.confirmed {
  background: #dcfce7;
  color: #166534;
}
.stat-value.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}
.empty-icon i {
  font-size: 48px;
}
.empty-text {
  font-size: 14px;
  line-height: 1.8;
}

/* 客户识别区域 */
.customer-section {
  margin-bottom: 20px;
}
.field-label {
  font-size: 12px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.customer-card {
  background: #f8f9fa;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.customer-card:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.customer-card.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.customer-card.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.customer-avatar {
  width: 44px;
  height: 44px;
  background: #3b82f6;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
}
.customer-info { flex: 1; }
.customer-name {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 2px;
}
.customer-meta {
  font-size: 11px;
  color: #888;
}
.customer-status {
  padding: 5px 10px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
}
.customer-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.customer-status.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 产品区域 */
.product-section {
  margin-bottom: 20px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.product-actions {
  display: flex;
  gap: 8px;
}
.action-btn {
  padding: 6px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  background: white;
  font-size: 12px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
}
.action-btn.primary {
  background: #3b82f6;
  color: white;
  border-color: transparent;
}
.action-btn.primary:hover {
  opacity: 0.9;
}

/* 产品列表 */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 480px;
  overflow-y: auto;
  padding-right: 4px;
}
.product-list::-webkit-scrollbar {
  width: 4px;
}
.product-list::-webkit-scrollbar-track {
  background: #f0f0f0;
  border-radius: 2px;
}
.product-list::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 2px;
}

/* 产品项 */
.product-item {
  background: #fafbfc;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  transition: all 0.2s;
  position: relative;
}
.product-item:hover {
  border-color: #bfdbfe;
  background: #eff6ff;
}
.product-item.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.product-item.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.product-item.error {
  border-color: #f87171;
  background: #fef2f2;
}
.product-item.new {
  border-color: #60a5fa;
  background: #eff6ff;
}

.product-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.product-index {
  width: 28px;
  height: 28px;
  background: #e8e8e8;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #666;
  flex-shrink: 0;
}
.product-item.confirmed .product-index {
  background: #4ade80;
  color: white;
}
.product-item.pending .product-index {
  background: #fbbf24;
  color: white;
}
.product-item.error .product-index {
  background: #f87171;
  color: white;
}
.product-item.new .product-index {
  background: #60a5fa;
  color: white;
}
.product-main { flex: 1; min-width: 0; }
.product-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.product-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-match-type {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
}
.product-match-type.sku { background: #dbeafe; color: #1e40af; }
.product-match-type.code { background: #dcfce7; color: #166534; }
.product-match-type.name { background: #fef3c7; color: #92400e; }
.product-match-type.none { background: #fee2e2; color: #991b1b; }
.product-match-type.new { background: #dbeafe; color: #1e40af; }

.product-code {
  font-size: 11px;
  color: #888;
}
.product-status {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.2s;
}
.product-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.product-status.pending {
  background: #fef3c7;
  color: #92400e;
}
.product-status.error {
  background: #fee2e2;
  color: #991b1b;
}
.product-status.new {
  background: #dbeafe;
  color: #1e40af;
}
.product-status:hover {
  opacity: 0.8;
}

.product-details {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding-top: 12px;
  border-top: 1px solid #e8e8e8;
}
.detail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.detail-label {
  font-size: 10px;
  color: #999;
}
.detail-value {
  font-size: 13px;
  color: #333;
  font-weight: 500;
}
.detail-value.editable {
  cursor: pointer;
  border-bottom: 1px dashed #d1d5db;
  transition: all 0.2s;
  min-width: 40px;
  display: inline-block;
}
.detail-value.editable:hover {
  border-bottom-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
  border-radius: 2px;
}
.detail-value.editing {
  border-bottom: none;
  padding: 0;
}
.detail-value.editing input {
  width: 100%;
  padding: 2px 6px;
  border: 1px solid #3b82f6;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  color: #333;
  background: #fafbff;
  outline: none;
}
.detail-value .edit-hint {
  font-size: 9px;
  color: #9ca3af;
  margin-left: 2px;
}
.detail-value.modified {
  position: relative;
}
.detail-value.modified::after {
  content: '已改';
  font-size: 9px;
  color: #f59e0b;
  margin-left: 4px;
  font-weight: 400;
}

.product-actions-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #e0e0e0;
}
.product-action-btn {
  padding: 4px 10px;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  background: white;
  font-size: 11px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
}
.product-action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
}
.product-action-btn.new {
  background: #dbeafe;
  border-color: #60a5fa;
  color: #1e40af;
}
.product-action-btn.new:hover {
  background: #60a5fa;
  color: white;
}
.product-action-btn.delete:hover {
  border-color: #f87171;
  color: #f87171;
}

/* 批量操作栏 */
.batch-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #f8f9fa;
  border-radius: 8px;
  margin-bottom: 12px;
}
.batch-info {
  font-size: 12px;
  color: #666;
}
.batch-actions {
  display: flex;
  gap: 8px;
}

/* 添加产品按钮 */
.add-product-btn {
  width: 100%;
  padding: 12px;
  border: 2px dashed #bfdbfe;
  border-radius: 10px;
  background: #fafbfc;
  font-size: 13px;
  color: #3b82f6;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}
.add-product-btn:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}

/* 操作按钮 */
.action-bar {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #f0f0f0;
}
.btn {
  flex: 1;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.btn-secondary {
  background: #f0f0f0;
  color: #666;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-primary {
  background: #3b82f6;
  color: white;
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.btn-success {
  background: #16a34a;
  color: white;
}
.btn-success:hover {
  opacity: 0.9;
}

/* 候选弹窗 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow: hidden;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid #f0f0f0;
}
.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: #333;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 12px;
  color: #999;
}
.modal-body {
  padding: 14px 22px;
  max-height: 50vh;
  overflow-y: auto;
}
.candidate-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.candidate-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 2px solid #f0f0f0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.candidate-item:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-item.selected {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-rank {
  width: 26px;
  height: 26px;
  background: #f0f0f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
}
.candidate-item:hover .candidate-rank,
.candidate-item.selected .candidate-rank {
  background: #3b82f6;
  color: white;
}
.candidate-info { flex: 1; }
.candidate-name {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin-bottom: 2px;
}
.candidate-meta {
  font-size: 11px;
  color: #999;
}
.candidate-similarity {
  padding: 3px 10px;
  background: #dcfce7;
  color: #166534;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid #f0f0f0;
  display: flex;
  gap: 10px;
}

/* 新建产品弹窗样式 */
.create-product-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 12px;
  color: #666;
  font-weight: 500;
}
.form-label .required {
  color: #f87171;
  margin-left: 2px;
}
.form-input, .form-select {
  padding: 10px 14px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  transition: all 0.2s;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: #3b82f6;
  background: #fafbff;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-hint {
  font-size: 11px;
  color: #999;
  margin-top: 2px;
}
.original-info-box {
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
  padding: 12px 14px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 16px;
}
.original-info-box .label {
  font-size: 11px;
  color: #3b82f6;
  margin-bottom: 4px;
}
.original-info-box .value {
  font-size: 13px;
  color: #333;
  font-weight: 500;
}

.customer-avatar i,
.recognition-icon i {
  font-size: inherit;
  line-height: 1;
}

/* Toast动画 */
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes slideUp {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
}


.paste-btn:hover { background:#059669; }
.search-input-wrapper { position:relative; margin-bottom:12px; }
.search-input-wrapper i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9ca3af; }
.search-input-wrapper input { padding-left:36px; }
.order-success-icon { width:56px;height:56px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px; }
.order-detail-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px; }
.order-detail-row:last-child { border-bottom:none; }
.order-detail-label { color:#6b7280; }
.order-detail-value { color:#1f2937;font-weight:500; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="ri-robot-2-line"></i> AI制单</h1>
  </div>

  <div id="cozeConfigPanel" style="background:white;border-radius:12px;padding:14px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <i class="ri-robot-2-line" style="color:#3b82f6;font-size:18px;"></i>
      <span style="font-size:13px;font-weight:600;color:#333;">Coze 智能体</span>
    </div>
    <input type="text" id="botIdInput" value="7638933573109792777" placeholder="Bot ID" style="flex:1;min-width:120px;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;font-family:monospace;background:white;">
    <input type="password" id="tokenInput" value="pat_zwWR14W4YEjLnqpD2BhItuhzKhC4VYH52oWfwYoeiB2Y9JuKBR1g1TfRzFDTbWQe" placeholder="PAT Token" style="flex:2;min-width:160px;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;font-family:monospace;background:white;">
    <button id="connectCozeBtn" onclick="initCozeSDK()" style="padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;">
      <i class="ri-play-line" style="font-size:14px;"></i>
      <span>启动 Coze</span>
    </button>
    <span id="apiStatus" style="font-size:11px;color:#9ca3af;"></span>
    <div id="pollStatus" style="display:none;font-size:11px;color:#6b7280;display:flex;align-items:center;gap:6px;">
      <span id="pollDot" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block;"></span>
      <span id="pollText">消息监听中</span>
    </div>
  </div>

  <div id="pinyinDataPanel" style="background:white;border-radius:12px;padding:14px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <i class="ri-database-2-line" style="color:#8b5cf6;font-size:18px;"></i>
      <span style="font-size:13px;font-weight:600;color:#333;">拼音数据</span>
    </div>
    <span id="pinyinDataStatus" style="font-size:12px;color:#9ca3af;flex:1;"></span>
    <button onclick="window.open('get_cus_pro.html','_blank')" style="padding:6px 14px;background:#8b5cf6;color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;">
      <i class="ri-external-link-line" style="font-size:13px;"></i>
      <span>打开拼音工具</span>
    </button>
    <button onclick="refreshPinyinStatus()" style="padding:6px 10px;background:white;color:#8b5cf6;border:1px solid #ddd6fe;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;">
      <i class="ri-refresh-line" style="font-size:13px;"></i>
    </button>
  </div>

  <div class="main-layout">
    <!-- 左侧：单据草稿区 -->
    <div class="result-section" id="resultSection">
      <!-- 结果头部 -->
      <div class="result-header">
        <div class="result-title"><i class="ri-list-check"></i> 单据草稿</div>
        <div class="result-stats">
          <div class="stat-item">
            <span>已确认</span>
            <span class="stat-value confirmed" id="confirmedCount">0/0</span>
          </div>

<script>

let currentCustomer = null;
let currentProducts = [];
let selectedCustomerId = null;
let editingProductIndex = null;
let creatingProductIndex = null;
let nextProductId = 100;

// ===== Coze SDK 初始化 =====

let cozeClient = null;
let lastDetectedJSON = '';

function initCozeSDK() {
  const botId = document.getElementById('botIdInput').value.trim();
  const token = document.getElementById('tokenInput').value.trim();

  if (!botId || !token) {
    document.getElementById('apiStatus').textContent = '请输入 Bot ID 和 Token';
    return;
  }

  const btn = document.getElementById('connectCozeBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ri-loader-4-line" style="font-size:16px;animation:spin 1s linear infinite;"></i><span>初始化中...</span>';
  document.getElementById('apiStatus').textContent = '正在初始化...';

  try {
    if (typeof CozeWebSDK === 'undefined') {
      throw new Error('Coze SDK 未加载，请刷新页面');
    }

    if (cozeClient && typeof cozeClient.destroy === 'function') {
      cozeClient.destroy();
    }

    cozeClient = new CozeWebSDK.WebChatClient({
      config: {
        bot_id: botId,
      },
      auth: {
        type: 'token',
        token: token,
        onRefreshToken: function () {
          return token;
        }
      },
      ui: {
        base: {
          lang: 'zh-CN',
          zIndex: 50
        },
        asstBtn: {
          isNeed: true
        },
        chatBot: {
          title: '智能制单助手',
          uploadable: true,
          width: 700,
        },
        header: {
          isShow: true,
          isNeedClose: false
        }
      }
    });

    setTimeout(function() {
      if (cozeClient && typeof cozeClient.showChatBot === 'function') {
        cozeClient.showChatBot();
      }
    }, 500);

    document.getElementById('apiStatus').textContent = '已连接 ✅';
    document.getElementById('apiStatus').style.color = '#16a34a';

    btn.disabled = false;
    btn.innerHTML = '<i class="ri-check-line" style="font-size:14px;"></i><span>已连接</span>';
    btn.style.background = '#16a34a';

    startCozePolling();

    showToast('Coze 智能体初始化成功！消息轮询已启动');

  } catch (e) {
    console.error('Coze SDK 初始化失败:', e);
    btn.disabled = false;
    btn.innerHTML = '<i class="ri-play-line" style="font-size:16px;"></i><span>初始化 Coze</span>';
    document.getElementById('apiStatus').textContent = '初始化失败';
    document.getElementById('apiStatus').style.color = '#e5484d';
    showToast('初始化失败: ' + e.message);
  }
}

// ===== Coze消息轮询模块 =====

var cozePollTimer = null;
var cozeLastMsgIds = {};
var cozePollConversationId = null;
var initialMessageIds = {}; // 初始加载时已有的消息ID
var isPollingInitialized = false;

function getCozeToken() {
  return document.getElementById('tokenInput').value.trim();
}

function getCozeBotId() {
  return document.getElementById('botIdInput').value.trim();
}

function cozeApiGet(path) {
  return new Promise(function(resolve, reject) {
    var token = getCozeToken();
    if (!token) { reject(new Error('未配置Token')); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://api.coze.cn' + path);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(e); }
      } else if (xhr.status === 0) {
        reject(new Error('CORS'));
      } else {
        var errMsg = 'API ' + xhr.status;
        try {
          var errBody = JSON.parse(xhr.responseText);
          if (errBody.msg) errMsg += ': ' + errBody.msg;
          if (errBody.code) errMsg += ' (code=' + errBody.code + ')';
        } catch (e2) {}
        console.error('[Coze API GET]', path, xhr.status, xhr.responseText.substring(0, 300));
        reject(new Error(errMsg));
      }
    };
    xhr.onerror = function() { reject(new Error('CORS')); };
    xhr.send();
  });
}

function cozeApiPost(path, body) {
  return new Promise(function(resolve, reject) {
    var token = getCozeToken();
    if (!token) { reject(new Error('未配置Token')); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.coze.cn' + path);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function() {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(e); }
      } else if (xhr.status === 0) {
        reject(new Error('CORS'));
      } else {
        var errMsg = 'API ' + xhr.status;
        try {
          var errBody = JSON.parse(xhr.responseText);
          if (errBody.msg) errMsg += ': ' + errBody.msg;
          if (errBody.code) errMsg += ' (code=' + errBody.code + ')';
        } catch (e2) {}
        console.error('[Coze API POST]', path, xhr.status, xhr.responseText.substring(0, 300));
        reject(new Error(errMsg));
      }
    };
    xhr.onerror = function() { reject(new Error('CORS')); };
    xhr.send(body ? JSON.stringify(body) : '{}');
  });
}

var cozeProxyAvailable = true;

function cozeApiGetWithProxy(path) {
  if (!cozeProxyAvailable) {
    return Promise.reject(new Error('代理不可用'));
  }
  return cozeApiGet(path).catch(handleCorsError);
}

function cozeApiPostWithProxy(path, body) {
  if (!cozeProxyAvailable) {
    return Promise.reject(new Error('代理不可用'));
  }
  return cozeApiPost(path, body).catch(handleCorsError);
}

function handleCorsError(e) {
  if (e.message === 'CORS') {
    cozeProxyAvailable = false;
    console.warn('Coze API CORS受限，消息轮询已暂停。请使用剪贴板方式，或配置后端代理。');
    stopCozePolling();
    var pollEl = document.getElementById('pollStatus');
    if (pollEl) {
      pollEl.style.display = 'flex';
      document.getElementById('pollDot').style.background = '#ef4444';
      document.getElementById('pollText').textContent = 'CORS受限，请手动复制';
    }
    showToast('Coze API跨域受限，消息轮询不可用。请继续使用剪贴板方式。', 'warning');
  }
  throw e;
}

function fetchLatestConversation() {
  return cozeApiGetWithProxy('/v1/conversations?bot_id=' + getCozeBotId() + '&connector_id=999&page_size=1&sort_order=desc')
    .then(function(res) {
      if (res.code === 0 && res.data && res.data.conversations && res.data.conversations.length > 0) {
        return res.data.conversations[0];
      }
      return null;
    });
}

function fetchConversationMessages(conversationId) {
  return cozeApiPostWithProxy('/v1/conversation/message/list?conversation_id=' + conversationId, {
    order: 'desc',
    limit: 10
  })
    .then(function(res) {
      if (res.code === 0 && res.data) {
        return res.data;
      }
      return [];
    });
}

function extractJSONFromText(text) {
  if (!text) return null;
  var jsonPatterns = [
    /\{[\s\S]*?"customer"[\s\S]*?"products"[\s\S]*?\}/,
    /\{[\s\S]*?"客户"[\s\S]*?"产品"[\s\S]*?\}/,
    /\{[\s\S]*?"customerName"[\s\S]*?"items"[\s\S]*?\}/,
    /\{[\s\S]*?"customer_name"[\s\S]*?"products"[\s\S]*?\}/,
    /\`\`\`json\s*([\s\S]*?)\s*\`\`\`/,
    /\`\`\`\s*([\s\S]*?)\s*\`\`\`/,
  ];
  for (var i = 0; i < jsonPatterns.length; i++) {
    var match = text.match(jsonPatterns[i]);
    if (match) {
      var candidate = match[1] || match[0];
      try {
        var obj = JSON.parse(candidate);
        if (obj && (obj.customer || obj['客户'] || obj.customerName || obj.customer_name) && (obj.products || obj['产品'] || obj.items)) {
          return candidate;
        }
      } catch (e) {}
    }
  }
  try {
    var obj2 = JSON.parse(text);
    if (obj2 && (obj2.customer || obj2['客户'] || obj2.customerName || obj2.customer_name) && (obj2.products || obj2['产品'] || obj2.items)) {
      return text;
    }
  } catch (e) {}
  return null;
}

function normalizeCozeJSON(jsonStr) {
  var obj = JSON.parse(jsonStr);
  if (obj.customerName && obj.items) {
    return {
      customer: { originalName: obj.customerName },
      products: obj.items.map(function(item) {
        return {
          originalName: item.name || item.productName || '',
          qty: item.quantity || item.qty || '',
          price: item.price ? (String(item.price).indexOf('元') === -1 ? item.price + '元' : String(item.price)) : '',
          note: item.note || item.remark || ''
        };
      })
    };
  }
  if (obj.customer_name && obj.products) {
    return {
      customer: { originalName: obj.customer_name },
      products: obj.products.map(function(item) {
        return {
          originalName: item.name || item.productName || item.product_name || '',
          qty: item.qty || item.quantity || '',
          price: item.price ? (String(item.price).indexOf('元') === -1 ? item.price + '元' : String(item.price)) : '',
          note: item.note || item.remark || ''
        };
      })
    };
  }
  if (obj['客户'] && obj['产品']) {
    return {
      customer: { originalName: obj['客户'] },
      products: obj['产品'].map(function(item) {
        return {
          originalName: item['品名'] || item['名称'] || item.name || '',
          qty: item['数量'] || item.qty || '',
          price: item['单价'] || item.price || '',
          note: item['备注'] || item.note || ''
        };
      })
    };
  }
  return obj;
}

function startCozePolling() {
  if (cozePollTimer) clearInterval(cozePollTimer);
  var pollEl = document.getElementById('pollStatus');
  if (pollEl) pollEl.style.display = 'flex';
  updatePollUI('listening');
  
  // 初始化：先获取当前所有消息，记录它们的ID作为基准，不处理这些已有消息
  if (!isPollingInitialized) {
    updatePollUI('checking');
    fetchLatestConversation().then(function(conv) {
      if (conv) {
        fetchConversationMessages(conv.id).then(function(messages) {
          var answerMsgs = messages.filter(function(m) {
            return m.role === 'assistant' && m.type === 'answer';
          });
          answerMsgs.forEach(function(m) {
            initialMessageIds[conv.id + '_' + m.id] = true;
          });
          isPollingInitialized = true;
          updatePollUI('listening');
        });
      } else {
        isPollingInitialized = true;
        updatePollUI('listening');
      }
    });
  }
  
  cozePollTimer = setInterval(pollCozeMessages, 3000);
  setTimeout(pollCozeMessages, 1000);
}

function stopCozePolling() {
  if (cozePollTimer) { clearInterval(cozePollTimer); cozePollTimer = null; }
  var pollEl = document.getElementById('pollStatus');
  if (pollEl) pollEl.style.display = 'none';
}

function updatePollUI(state, extra) {
  var dot = document.getElementById('pollDot');
  var text = document.getElementById('pollText');
  if (!dot || !text) return;
  if (state === 'listening') {
    dot.style.background = '#10b981';
    text.textContent = '消息监听中';
  } else if (state === 'checking') {
    dot.style.background = '#3b82f6';
    text.textContent = '检测新消息...';
  } else if (state === 'found') {
    dot.style.background = '#f59e0b';
    text.textContent = '发现JSON，解析中...';
  } else if (state === 'matched') {
    dot.style.background = '#16a34a';
    text.textContent = '已自动匹配 ✅';
  } else if (state === 'error') {
    dot.style.background = '#ef4444';
    text.textContent = extra || '轮询出错';
  }
}

var pollRetryCount = 0;

function pollCozeMessages() {
  if (!getCozeToken() || !getCozeBotId()) return;
  if (!isPollingInitialized) {
    updatePollUI('listening');
    return;
  }

  updatePollUI('checking');

  fetchLatestConversation().then(function(conv) {
    if (!conv) { updatePollUI('listening'); return; }

    return fetchConversationMessages(conv.id).then(function(messages) {
      var answerMsgs = messages.filter(function(m) {
        return m.role === 'assistant' && m.type === 'answer';
      });

      if (answerMsgs.length > 0) {
        var latestAnswer = answerMsgs[0];
        var msgKey = conv.id + '_' + latestAnswer.id;
        
        // 检查是否是已有消息（初始加载时的消息，或已处理过的消息）
        if (initialMessageIds[msgKey] || cozeLastMsgIds[msgKey]) {
          updatePollUI('listening');
        } else {
          var jsonStr = extractJSONFromText(latestAnswer.content);
          
          if (jsonStr) {
            updatePollUI('found');

            try {
              var parsedObj = JSON.parse(jsonStr);

              var customerName = parsedObj.customer_name || parsedObj.customerName || parsedObj.customer || parsedObj['客户'] || '';
              var rawProducts = parsedObj.products || parsedObj.items || parsedObj['产品'] || [];

              var orderDraft = {
                source: 'coze_poll',
                customer: {
                  originalName: customerName,
                  matchType: 'none',
                  status: 'pending'
                },
                products: rawProducts.map(function(p) {
                  var pName = p.name || p.productName || p.product_name || p['品名'] || p['名称'] || '';
                  var pQty = p.qty || p.quantity || p['数量'] || 0;
                  var pUnit = p.unit || p['单位'] || '';
                  var pPrice = p.price || p['单价'] || 0;
                  var pSpec = p.spec || p.specification || p['规格'] || '';
                  var hasSpec = !!(pSpec && String(pSpec).trim());
                  var match = findProductFuzzyMatch(pName, hasSpec, String(pSpec));
                  var matchedProduct = null;
                  if (match.matchId) {
                    var lsProducts = getLSProducts();
                    for (var j = 0; j < lsProducts.length; j++) {
                      if (String(lsProducts[j].id) === String(match.matchId)) {
                        matchedProduct = { id: lsProducts[j].id, name: lsProducts[j].name, code: 'PRD-' + lsProducts[j].id, sku: lsProducts[j].model || '-', spec: lsProducts[j].spec || '' };
                        break;
                      }
                    }
                  }
                  return {
                    originalName: pName,
                    originalQty: pQty + pUnit,
                    originalPrice: pPrice ? pPrice + '元' : '',
                    originalSpec: String(pSpec),
                    matchedId: match.matchId,
                    matchedName: matchedProduct ? matchedProduct.name : '',
                    matchedCode: matchedProduct ? matchedProduct.code : '',
                    matchedSku: matchedProduct ? matchedProduct.sku : '',
                    matchedSpec: matchedProduct ? matchedProduct.spec : '',
                    matchType: match.matchType,
                    status: match.status,
                    qty: pQty + pUnit,
                    price: pPrice ? pPrice + '元' : '',
                    note: String(pSpec)
                  };
                })
              };

              showMatchProgress(orderDraft);
              cozeLastMsgIds[msgKey] = true;
              lastDetectedJSON = jsonStr;
              updatePollUI('matched');
              showToast('Coze对话中检测到订单数据，已自动匹配', 'success');
            } catch (e) {
              updatePollUI('listening');
            }
          } else {
            updatePollUI('listening');
          }
        }
      } else {
        updatePollUI('listening');
      }

      pollRetryCount = 0;
    });
  }).catch(function(e) {
    pollRetryCount++;
    if (pollRetryCount >= 5) {
      updatePollUI('error', '轮询失败: ' + e.message);
      pollRetryCount = 0;
    } else {
      updatePollUI('listening');
    }
  });
}

let lastClipboardContent = '';

function isOrderJSON(text) {
  if (!text || text.length < 10) return false;
  if (text.indexOf('{') === -1) return false;
  return text.indexOf('"customer_name"') !== -1 ||
         text.indexOf('"products"') !== -1 ||
         text.indexOf('"doc_type"') !== -1;
}

function tryReadClipboard() {
  if (!document.hasFocus()) return;
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  navigator.clipboard.readText().then(function(text) {
    if (text !== lastClipboardContent && text !== lastDetectedJSON && isOrderJSON(text)) {
      lastClipboardContent = text;
      handleClipboardText(text);
    }
  }).catch(function() {});
}

function isInCozeSDKArea(el) {
  while (el) {
    if (el.className && typeof el.className === 'string') {
      if (el.className.indexOf('coze-chat-sdk') !== -1 || el.className.indexOf('coz-') !== -1) {
        return true;
      }
    }
    el = el.parentElement;
  }
  return false;
}

function injectImageToCozeSDK(e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;

  var hasImage = false;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      hasImage = true;
      break;
    }
  }
  if (!hasImage) return;

  if (!isInCozeSDKArea(e.target)) return;

  var fileInput = document.querySelector('input.coze-chat-sdk-semi-upload-hidden-input');
  if (!fileInput) return;

  e.preventDefault();
  e.stopPropagation();

  var files = [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      var file = items[i].getAsFile();
      if (file) files.push(file);
    }
  }
  if (files.length === 0) return;

  var dataTransfer = new DataTransfer();
  files.forEach(function(f) { dataTransfer.items.add(f); });
  fileInput.files = dataTransfer.files;
  fileInput.dispatchEvent(new Event('change', { bubbles: true }));
}

function extractJSON(text) {
  const patterns = [
    /```json\s*([\s\S]*?)```/,
    /```\s*([\s\S]*?)```/,
    /(\{[\s\S]*"doc_type"[\s\S]*\})/,
    /(\{[\s\S]*"customer_name"[\s\S]*\})/,
    /(\{[\s\S]*"products"[\s\S]*\})/
  ];
  for (let i = 0; i < patterns.length; i++) {
    const match = text.match(patterns[i]);
    if (match && match[1]) {
      try {
        const obj = JSON.parse(match[1].trim());
        if (obj.doc_type || obj.customer_name || obj.products) return obj;
      } catch (e) { continue; }
    }
  }
  try {
    const obj = JSON.parse(text.trim());
    if (obj.doc_type || obj.customer_name || obj.products) return obj;
  } catch (e) {}
  return null;
}

function handleClipboardText(text) {
  const data = extractJSON(text);
  if (!data) return;

  if (text === lastDetectedJSON) return;
  lastDetectedJSON = text;

  const orderDraft = {
    source: 'clipboard',
    customer: {
      originalName: data.customer_name || '',
      matchType: 'none',
      status: 'pending'
    },
    products: (data.products || []).map(function(p) {
      const hasSpec = !!(p.spec && p.spec.trim());
      const match = findProductFuzzyMatch(p.name, hasSpec, p.spec || '');
      var matchedProduct = null;
      if (match.matchId) {
        var lsProducts = getLSProducts();
        for (var i = 0; i < lsProducts.length; i++) {
          if (String(lsProducts[i].id) === String(match.matchId)) {
            matchedProduct = { id: lsProducts[i].id, name: lsProducts[i].name, code: 'PRD-' + lsProducts[i].id, sku: lsProducts[i].model || '-', spec: lsProducts[i].spec || '' };
            break;
          }
        }
      }
      return {
        originalName: p.name || '',
        originalQty: (p.qty || 0) + (p.unit || ''),
        originalPrice: p.price ? p.price + '元' : '',
        originalSpec: p.spec || '',
        matchedId: match.matchId,
        matchedName: matchedProduct ? matchedProduct.name : '',
        matchedCode: matchedProduct ? matchedProduct.code : '',
        matchedSku: matchedProduct ? matchedProduct.sku : '',
        matchedSpec: matchedProduct ? matchedProduct.spec : '',
        matchType: match.matchType,
        status: match.status,
        qty: (p.qty || 0) + (p.unit || ''),
        price: p.price ? p.price + '元' : '',
        note: p.spec || ''
      };
    })
  };

  showMatchProgress(orderDraft);
  showToast('已捕获 JSON，正在填充表单...');
}

function findProductFuzzyMatch(name, hasSpec, specValue) {
  return findProductFuzzyMatchFromLS(name, hasSpec, specValue);
}

function findProductFuzzyMatchFromLS(name, hasSpec, specValue) {
  var products = getLSProducts();
  var pp = getLSProductPinyin();
  if (products.length === 0) {
    return { matchId: null, status: 'error', matchType: 'none' };
  }
  var indexDb = products.filter(function(p) { return pp[p.id]; }).map(function(p) {
    var py = pp[p.id];
    return { id: p.id, name: p.name, model: p.model || '', spec: p.spec || '', pinyin: py.pinyin, pinyin_abbr: py.pinyin_abbr };
  });

  var matches = pinyinMatch(name, indexDb, { threshold: 0.45 });

  if (matches.length === 0) {
    return { matchId: null, status: 'error', matchType: 'none' };
  }

  var best = matches[0];

  if (best.score >= 0.9) {
    var sameNameProducts = products.filter(function(p) { return p.name === best.name; });
    if (sameNameProducts.length > 1 && specValue) {
      var specMatch = sameNameProducts.find(function(p) {
        return p.spec && p.spec.toLowerCase().indexOf(specValue.toLowerCase()) !== -1;
      });
      if (specMatch) {
        return { matchId: specMatch.id, status: 'confirmed', matchType: 'sku' };
      }
    }
    if (sameNameProducts.length === 1) {
      return { matchId: best.id, status: 'confirmed', matchType: best.score >= 0.95 ? 'exact' : 'name' };
    }
    return { matchId: best.id, status: 'pending', matchType: 'name' };
  }

  if (best.score >= 0.7) {
    return { matchId: best.id, status: 'pending', matchType: 'name' };
  }

  if (matches.length === 1 && best.score >= 0.4) {
    return { matchId: best.id, status: 'pending', matchType: 'name' };
  }

  if (matches.length > 1 && best.score >= 0.4) {
    return { matchId: best.id, status: 'pending', matchType: 'name' };
  }

  return { matchId: null, status: 'error', matchType: 'none' };
}

function levenshteinDistance(a, b) {
  var m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  var dp = [];
  for (var i = 0; i <= m; i++) { dp[i] = [i]; }
  for (var j = 0; j <= n; j++) { dp[0][j] = j; }
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      var cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

function longestCommonSubsequence(a, b) {
  var m = a.length, n = b.length;
  if (m === 0 || n === 0) return 0;
  var dp = [];
  for (var i = 0; i <= m; i++) {
    dp[i] = [];
    for (var j = 0; j <= n; j++) { dp[i][j] = 0; }
  }
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      if (a.charAt(i - 1) === b.charAt(j - 1)) { dp[i][j] = dp[i - 1][j - 1] + 1; }
      else { dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]); }
    }
  }
  return dp[m][n];
}

function calcStringSimilarity(a, b) {
  if (!a && !b) return 1;
  if (!a || !b) return 0;
  var maxLen = Math.max(a.length, b.length);
  if (maxLen === 0) return 1;
  var levDist = levenshteinDistance(a, b);
  var levScore = (1 - levDist / maxLen);
  var lcsLen = longestCommonSubsequence(a, b);
  var lcsScore = (2 * lcsLen) / (a.length + b.length);
  return (levScore + lcsScore) / 2;
}

function pinyinWordBagSimilarity(asrFull, recordFull) {
  var asrWords = asrFull.split('_').filter(function(w) { return w.length > 0; });
  var recWords = recordFull.split('_').filter(function(w) { return w.length > 0; });
  if (asrWords.length === 0 && recWords.length === 0) return 1;
  if (asrWords.length === 0 || recWords.length === 0) return 0;
  var asrCount = {};
  asrWords.forEach(function(w) { asrCount[w] = (asrCount[w] || 0) + 1; });
  var recCount = {};
  recWords.forEach(function(w) { recCount[w] = (recCount[w] || 0) + 1; });
  var allWords = new Set(Object.keys(asrCount).concat(Object.keys(recCount)));
  var dotProduct = 0, asrNorm = 0, recNorm = 0;
  allWords.forEach(function(w) {
    var a = asrCount[w] || 0;
    var r = recCount[w] || 0;
    dotProduct += a * r;
    asrNorm += a * a;
    recNorm += r * r;
  });
  var denominator = Math.sqrt(asrNorm) * Math.sqrt(recNorm);
  return denominator > 0 ? dotProduct / denominator : 0;
}

function pinyinMatch(asrText, indexDb, options) {
  var threshold = (options && options.threshold) || 0.7;
  var businessWeight = (options && options.businessWeight) || 0;

  var asrPy = generatePinyinForText(asrText);
  var asrFull = asrPy.full.toLowerCase();
  var asrAbbr = asrPy.abbr.toLowerCase();
  var kw = asrText.toLowerCase();

  var candidates = [];

  for (var i = 0; i < indexDb.length; i++) {
    var record = indexDb[i];
    var scores = {};

    if (record.name && record.name.toLowerCase() === kw) {
      scores.pinyin = 1; scores.abbr = 1; scores.wordBag = 1; scores.length = 1; scores.business = businessWeight;
    } else if (record.name && record.name.toLowerCase().indexOf(kw) !== -1) {
      scores.pinyin = 0.95; scores.abbr = 0.9; scores.wordBag = 1; scores.length = 0.9; scores.business = businessWeight;
    } else {
      var recordFull = (record.pinyin || '').toLowerCase();
      var recordAbbr = (record.pinyin_abbr || '').toLowerCase();
      scores.pinyin = calcStringSimilarity(asrFull, recordFull);
      scores.abbr = calcStringSimilarity(asrAbbr, recordAbbr);
      scores.wordBag = pinyinWordBagSimilarity(asrFull, recordFull);
      var maxLen = Math.max(asrFull.length, recordFull.length);
      var lenDiff = Math.abs(asrFull.length - recordFull.length);
      scores.length = maxLen > 0 ? Math.max(0, 1 - lenDiff / maxLen) : 1;
      scores.business = businessWeight;
    }

    var finalScore = scores.pinyin * 0.30 + scores.abbr * 0.20 + scores.wordBag * 0.25 + scores.length * 0.10 + scores.business * 0.15;

    if (finalScore >= threshold) {
      candidates.push({
        id: record.id, name: record.name, model: record.model || '', spec: record.spec || '',
        score: finalScore, details: scores
      });
    }
  }

  candidates.sort(function(a, b) { return b.score - a.score; });
  return candidates;
}

function generatePinyinForText(text) {
  if (!text || typeof text !== 'string') return { full: '', abbr: '' };
  try {
    var segments = [];
    var current = '';
    var currentIsChinese = null;
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      var isChinese = /[\u4e00-\u9fff\u3400-\u4dbf]/.test(ch);
      if (currentIsChinese === null) { currentIsChinese = isChinese; current = ch; }
      else if (isChinese === currentIsChinese) { current += ch; }
      else { segments.push({ text: current, isChinese: currentIsChinese }); current = ch; currentIsChinese = isChinese; }
    }
    if (current) segments.push({ text: current, isChinese: currentIsChinese });
    var fullParts = [], abbrParts = [];
    for (var j = 0; j < segments.length; j++) {
      var seg = segments[j];
      if (seg.isChinese) {
        var py = pinyinPro.pinyin(seg.text, { toneType: 'none', type: 'array' });
        for (var k = 0; k < py.length; k++) fullParts.push(py[k].toLowerCase());
        var abbrPy = pinyinPro.pinyin(seg.text, { pattern: 'first', toneType: 'none', type: 'array' });
        for (var k = 0; k < abbrPy.length; k++) abbrParts.push(abbrPy[k].toLowerCase());
      } else {
        var trimmed = seg.text.trim();
        if (!trimmed) continue;
        fullParts.push(trimmed.toLowerCase().replace(/\s+/g, '_'));
        abbrParts.push(trimmed.toLowerCase().replace(/\s+/g, ''));
      }
    }
    return { full: fullParts.join('_'), abbr: abbrParts.join('') };
  } catch (e) { return { full: '', abbr: '' }; }
}
