<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能制单</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5; --card: #fff; --border: #e5e9ef;
  --text: #1f2937; --text2: #6b7280; --text3: #9ca3af;
  --primary: #3b82f6; --primary-light: #eff6ff; --primary-border: #bfdbfe;
  --green: #10b981; --green-light: #ecfdf5; --green-border: #a7f3d0;
  --amber: #f59e0b; --amber-light: #fffbeb; --amber-border: #fde68a;
  --red: #ef4444; --red-light: #fef2f2; --red-border: #fecaca;
  --purple: #8b5cf6; --purple-light: #f5f3ff; --purple-border: #ddd6fe;
  --cyan: #06b6d4; --cyan-light: #ecfeff; --cyan-border: #a5f3fc;
  --radius: 10px;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.8} }
@keyframes typingDot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.chat-container { flex:1; display:flex; flex-direction:column; min-height:0; max-width:800px; width:100%; margin:0 auto; }

.message-list { flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:10px; }
.message-list::-webkit-scrollbar { width:3px; }
.message-list::-webkit-scrollbar-thumb { background:#d1d5db; border-radius:2px; }

.msg { display:flex; gap:6px; max-width:90%; animation:fadeIn .25s ease; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg.ai { align-self:flex-start; }
.msg.system { align-self:center; max-width:90%; }

.msg-avatar { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; flex-shrink:0; }
.msg.user .msg-avatar { background:var(--primary); }
.msg.ai .msg-avatar { background:linear-gradient(135deg,#3b82f6,#8b5cf6); }

.msg-body { min-width:0; }
.msg-bubble { padding:8px 12px; border-radius:12px; font-size:13px; line-height:1.6; word-break:break-word; }
.msg.user .msg-bubble { background:var(--primary); color:#fff; border-bottom-right-radius:3px; }
.msg.ai .msg-bubble { background:#fff; color:var(--text); border-bottom-left-radius:3px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
.msg.system .msg-bubble { background:transparent; color:var(--text3); font-size:10px; text-align:center; padding:2px 10px; }
.msg.system.error .msg-bubble { color:var(--red); }
.msg-meta { font-size:9px; color:var(--text3); margin-top:3px; }
.msg.user .msg-meta { text-align:right; }

.rich-preview { margin-top:6px; background:#fff; border:1px solid var(--green-border); border-radius:8px; overflow:hidden; }
.rich-preview-header { padding:6px 10px; background:var(--green-light); font-size:11px; font-weight:700; color:#065f46; display:flex; align-items:center; gap:5px; }
.rich-preview-body { padding:8px 10px; font-size:12px; line-height:1.7; }
.rich-preview-row { display:flex; gap:6px; padding:1px 0; }
.rich-preview-row .label { color:var(--text2); min-width:60px; flex-shrink:0; font-size:11px; }
.rich-preview-row .value { font-weight:600; font-size:11px; }
.rich-preview-row .value.editable { cursor:pointer; border-bottom:1px dashed var(--primary-border); padding-bottom:1px; }
.rich-preview-row .value.editable:hover { color:var(--primary); border-bottom-color:var(--primary); }
.rich-preview-actions { padding:6px 10px; border-top:1px solid var(--green-border); display:flex; gap:5px; justify-content:flex-end; }

.rich-match { margin-top:3px; padding:2px 6px; border-radius:3px; font-size:10px; display:inline-flex; align-items:center; gap:3px; }
.rich-match.confirmed { background:var(--green-light); color:#065f46; border:1px solid var(--green-border); }
.rich-match.pending { background:var(--amber-light); color:#92400e; border:1px solid var(--amber-border); }
.rich-match.new { background:var(--purple-light); color:#5b21b6; border:1px solid var(--purple-border); }

.rich-options { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.rich-option { padding:5px 12px; border:1px solid var(--primary-border); border-radius:14px; font-size:11px; font-weight:600; color:var(--primary); background:var(--primary-light); cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:3px; }
.rich-option:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.rich-option:disabled { opacity:.4; cursor:default; pointer-events:none; }
.rich-option.danger { color:var(--red); border-color:var(--red-border); background:var(--red-light); }
.rich-option.danger:hover { background:var(--red); color:#fff; border-color:var(--red); }

.rich-form { margin-top:6px; background:#f8fafc; border:1px solid var(--border); border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.rich-form-field { display:flex; flex-direction:column; gap:2px; }
.rich-form-label { font-size:10px; font-weight:600; color:var(--text2); }
.rich-form-input { padding:6px 8px; border:1px solid var(--border); border-radius:5px; font-size:12px; outline:none; background:#fff; color:var(--text); font-family:inherit; }
.rich-form-input:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(59,130,246,.1); }
.rich-form-input::placeholder { color:var(--text3); }
.rich-form-row { display:flex; gap:5px; }
.rich-form-row > .rich-form-field { flex:1; }
.rich-form-btn { padding:5px 12px; border:none; border-radius:5px; font-size:11px; font-weight:600; cursor:pointer; transition:all .2s; }
.rich-form-btn.primary { background:var(--primary); color:#fff; }
.rich-form-btn.primary:hover { background:#2563eb; }
.rich-form-btn.secondary { background:#f1f5f9; color:var(--text2); }
.rich-form-btn.success { background:var(--green); color:#fff; }

.rich-typing { display:inline-flex; gap:3px; align-items:center; }
.rich-typing span { width:5px; height:5px; border-radius:50%; background:var(--text3); animation:typingDot 1.4s infinite; }
.rich-typing span:nth-child(2) { animation-delay:.2s; }
.rich-typing span:nth-child(3) { animation-delay:.4s; }

.rich-image { max-width:200px; max-height:140px; border-radius:6px; margin-top:4px; cursor:pointer; }

.input-area { border-top:1px solid var(--border); flex-shrink:0; background:#fff; }
.input-area-inner { max-width:800px; margin:0 auto; }

.progress-bar-wrap { padding:0 12px; height:16px; display:flex; align-items:center; gap:6px; transition:all .3s; overflow:hidden; }
.progress-bar-wrap.hidden { height:0; padding:0 12px; }
.progress-track { flex:1; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.progress-fill { height:100%; background:var(--primary); border-radius:2px; transition:width .3s ease; }
.progress-label { font-size:9px; color:var(--text3); white-space:nowrap; }

.input-row-wrap { padding:6px 12px 10px; }
.file-preview-area { margin-bottom:4px; }
.file-preview { display:flex; align-items:center; gap:5px; padding:4px 8px; background:var(--amber-light); border:1px solid var(--amber-border); border-radius:5px; font-size:10px; color:#92400e; }
.file-preview .fname { flex:1; font-weight:600; }
.file-preview .fremove { cursor:pointer; color:var(--red); font-size:12px; }

.input-tools { display:flex; gap:3px; margin-bottom:4px; align-items:center; }
.input-tool-btn { width:28px; height:28px; border-radius:6px; border:1px solid var(--border); background:#fff; color:var(--text2); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; position:relative; }
.input-tool-btn:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.input-tool-btn.recording { background:var(--red); color:#fff; border-color:var(--red); animation:pulse 1.5s infinite; }
.input-tool-btn:disabled { opacity:.4; cursor:not-allowed; }
.input-tool-btn .rec-timer { position:absolute; top:-14px; font-size:9px; color:var(--red); font-weight:600; white-space:nowrap; }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--amber); flex-shrink:0; }
.status-dot.connected { background:var(--green); }

.input-row { display:flex; gap:5px; align-items:flex-end; }
.text-input { flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:10px; font-size:13px; outline:none; resize:none; min-height:36px; max-height:90px; font-family:inherit; line-height:1.4; background:#f8fafc; }
.text-input:focus { border-color:var(--primary); background:#fff; box-shadow:0 0 0 2px rgba(59,130,246,.08); }
.text-input::placeholder { color:var(--text3); }

.send-btn { width:36px; height:36px; border-radius:10px; border:none; background:var(--primary); color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0; }
.send-btn:hover { background:#2563eb; transform:scale(1.05); }
.send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

.quick-actions { display:flex; gap:4px; padding:0 12px 8px; }
.quick-action { padding:3px 8px; border-radius:10px; font-size:10px; font-weight:600; cursor:pointer; transition:all .2s; border:1px solid var(--border); background:#fff; color:var(--text2); display:flex; align-items:center; gap:3px; }
.quick-action:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.quick-action i { font-size:11px; }

.drop-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(59,130,246,.08); border:3px dashed var(--primary); display:none; align-items:center; justify-content:center; z-index:1000; font-size:14px; font-weight:600; color:var(--primary); }
.drop-overlay.active { display:flex; }

.config-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.3); z-index:499; display:none; }
.config-overlay.open { display:block; }
.config-drawer { position:fixed; top:0; right:-340px; width:340px; height:100vh; background:#fff; border-left:1px solid var(--border); z-index:500; transition:right .3s ease; display:flex; flex-direction:column; }
.config-drawer.open { right:0; }
.config-drawer-header { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; }
.config-drawer-body { padding:14px; flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.config-group { display:flex; flex-direction:column; gap:4px; }
.config-label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; }
.config-input { width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:5px; font-size:11px; font-family:monospace; background:#f8fafc; color:var(--text); outline:none; }
.config-input:focus { border-color:var(--primary); background:#fff; }
.config-drawer-footer { padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:6px; }

.output-panel { position:fixed; bottom:0; left:0; right:0; max-height:35vh; background:#1e293b; z-index:400; transform:translateY(100%); transition:transform .3s ease; display:flex; flex-direction:column; }
.output-panel.open { transform:translateY(0); }
.output-panel-header { padding:6px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; font-size:11px; font-weight:600; color:#94a3b8; }
.output-panel-body { flex:1; overflow-y:auto; padding:10px 14px; }
.output-json { color:#a5f3fc; font-size:10px; font-family:'SF Mono','Menlo',monospace; line-height:1.5; white-space:pre-wrap; }

.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-16px); padding:6px 16px; border-radius:7px; font-size:12px; font-weight:500; z-index:2000; opacity:0; transition:all .3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.success { background:var(--green); color:#fff; }
.toast.error { background:var(--red); color:#fff; }
.toast.info { background:var(--primary); color:#fff; }

@media(max-width:640px) {
  .input-row-wrap { padding:4px 8px 8px; }
}
</style>
</head>
<body>

<div class="chat-container">
  <div class="message-list" id="messageList"></div>
  <div class="input-area">
    <div class="input-area-inner">
      <div class="progress-bar-wrap hidden" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <span class="progress-label" id="progressLabel"></span>
      </div>
      <div class="input-row-wrap">
        <div class="file-preview-area" id="filePreviewArea"></div>
        <div class="input-tools">
          <button class="input-tool-btn" id="voiceBtn" onclick="toggleVoice()" title="语音"><i class="ri-mic-line"></i></button>
          <button class="input-tool-btn" onclick="document.getElementById('fileInput').click()" title="文件"><i class="ri-attachment-2"></i></button>
          <span style="flex:1;"></span>
          <span id="statusDot" class="status-dot" title="演示模式"></span>
          <button class="input-tool-btn" onclick="resetAll()" title="重置"><i class="ri-refresh-line"></i></button>
          <button class="input-tool-btn" onclick="toggleOutput()" title="输出"><i class="ri-code-box-line"></i></button>
          <button class="input-tool-btn" onclick="openConfig()" title="配置"><i class="ri-settings-3-line"></i></button>
        </div>
        <div class="input-row">
          <textarea class="text-input" id="textInput" placeholder="描述你要创建的数据..." rows="1" onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendText()" title="发送"><i class="ri-send-plane-fill"></i></button>
        </div>
      </div>
      <div class="quick-actions" id="quickActions"></div>
    </div>
  </div>
</div>

<div class="drop-overlay" id="dropOverlay"><i class="ri-image-add-line" style="margin-right:6px;"></i> 释放以添加图片</div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.docx,.doc,.png,.jpg,.jpeg,.gif,.bmp,.webp" style="display:none" onchange="handleFileSelect(event)">

<div class="config-overlay" id="configOverlay" onclick="closeConfig()"></div>
<div class="config-drawer" id="configDrawer">
  <div class="config-drawer-header">
    <span><i class="ri-settings-3-line"></i> 配置</span>
    <i class="ri-close-line" style="cursor:pointer;font-size:16px;color:var(--text2);" onclick="closeConfig()"></i>
  </div>
  <div class="config-drawer-body">
    <div class="config-group"><div class="config-label">WORKFLOW ID</div><input type="text" class="config-input" id="cfgWorkflowId" placeholder="73664689170551****"></div>
    <div class="config-group"><div class="config-label">PAT TOKEN</div><input type="password" class="config-input" id="cfgToken" placeholder="pat_xxx..."></div>
    <div class="config-group"><div class="config-label">API 基地址</div><input type="text" class="config-input" id="cfgBaseUrl" value="https://api.coze.cn"></div>
    <div class="config-group"><div class="config-label">LOAD DATA 基地址</div><input type="text" class="config-input" id="cfgLoadDataUrl" placeholder="https://your-server/api"></div>
  </div>
  <div class="config-drawer-footer">
    <button class="rich-form-btn secondary" onclick="closeConfig()" style="flex:1;">取消</button>
    <button class="rich-form-btn primary" onclick="saveAndCloseConfig()" style="flex:1;">保存</button>
  </div>
</div>

<div class="output-panel" id="outputPanel">
  <div class="output-panel-header"><span><i class="ri-code-box-line"></i> 输出</span><i class="ri-close-line" style="cursor:pointer;font-size:14px;" onclick="toggleOutput()"></i></div>
  <div class="output-panel-body"><div class="output-json" id="outputJson">暂无数据</div></div>
</div>

<script>
var DOC_TYPES = {
  order:    { id:'order',    name:'销售订单', icon:'ri-file-list-3-line',      color:'#3b82f6', desc:'客户采购订单' },
  customer: { id:'customer', name:'客户',     icon:'ri-building-line',         color:'#8b5cf6', desc:'客户档案' },
  contact:  { id:'contact',  name:'联系人',   icon:'ri-contacts-line',         color:'#06b6d4', desc:'联系人记录' },
  activity: { id:'activity', name:'行动',     icon:'ri-calendar-check-line',   color:'#f59e0b', desc:'跟进行动' },
  payment:  { id:'payment',  name:'回款',     icon:'ri-money-cny-circle-line', color:'#10b981', desc:'客户回款' }
};

var flow = { state:'init', docType:null, matchedData:null };

var config = { workflowId:'', token:'', baseUrl:'https://api.coze.cn', loadDataUrl:'', demoMode:true };

function loadConfig() {
  try { var s=localStorage.getItem('cozeflow_config_v4'); if(s){var d=JSON.parse(s);for(var k in d)if(d.hasOwnProperty(k))config[k]=d[k];} } catch(e){}
  document.getElementById('cfgWorkflowId').value=config.workflowId||'';
  document.getElementById('cfgToken').value=config.token||'';
  document.getElementById('cfgBaseUrl').value=config.baseUrl||'https://api.coze.cn';
  document.getElementById('cfgLoadDataUrl').value=config.loadDataUrl||'';
  updateStatus();
}
function saveConfig() {
  config.workflowId=document.getElementById('cfgWorkflowId').value.trim();
  config.token=document.getElementById('cfgToken').value.trim();
  config.baseUrl=document.getElementById('cfgBaseUrl').value.trim()||'https://api.coze.cn';
  config.loadDataUrl=document.getElementById('cfgLoadDataUrl').value.trim();
  try{localStorage.setItem('cozeflow_config_v4',JSON.stringify(config));}catch(e){}
  updateStatus();
}
function saveAndCloseConfig(){saveConfig();closeConfig();showToast('配置已保存','success');}
function updateStatus(){
  config.demoMode=!config.workflowId;
  var dot=document.getElementById('statusDot');
  if(dot){
    dot.className='status-dot'+(config.demoMode?'':' connected');
    dot.title=config.demoMode?'演示模式':'已连接';
  }
}
function openConfig(){document.getElementById('configDrawer').classList.add('open');document.getElementById('configOverlay').classList.add('open');}
function closeConfig(){document.getElementById('configDrawer').classList.remove('open');document.getElementById('configOverlay').classList.remove('open');}
function toggleOutput(){document.getElementById('outputPanel').classList.toggle('open');}

function selectType(typeId) {
  flow.docType = typeId;
  flow.state = 'typing';
  flow.matchedData = null;
  updatePlaceholder();
  showProgress();
  setQuickActions([]);
}

function updatePlaceholder() {
  var input = document.getElementById('textInput');
  if (flow.state === 'done') {
    input.placeholder = '继续输入，创建新的数据...';
  } else if (flow.docType) {
    var dt = DOC_TYPES[flow.docType];
    var hints = {
      order: '输入订单信息，如"帮华创科技下个单，A3打印纸100箱"...',
      customer: '输入客户信息，如"新建客户深圳华创科技有限公司，制造业"...',
      contact: '输入联系人信息，如"添加张三，华创科技，13800138000"...',
      activity: '输入行动信息，如"明天去华创科技上门拜访"...',
      payment: '输入回款信息，如"华创科技回款5万，银行转账"...'
    };
    input.placeholder = hints[flow.docType] || '描述你要创建的数据...';
  } else {
    input.placeholder = '描述你要创建的数据，如"帮华创科技下个单"...';
  }
}

function showProgress() {
  var wrap = document.getElementById('progressWrap');
  var fill = document.getElementById('progressFill');
  var label = document.getElementById('progressLabel');
  if (flow.docType && flow.state !== 'done') {
    wrap.classList.remove('hidden');
    var states = { init: 0, typing: 10, processing: 60, confirm: 90 };
    var pct = states[flow.state] || 0;
    fill.style.width = pct + '%';
    var labels = { init: '', typing: '准备输入', processing: '识别中...', confirm: '待确认' };
    label.textContent = labels[flow.state] || '';
  } else {
    wrap.classList.add('hidden');
  }
}

function setQuickActions(actions) {
  var el = document.getElementById('quickActions');
  el.innerHTML = '';
  actions.forEach(function(a) {
    var btn = document.createElement('div');
    btn.className = 'quick-action';
    btn.innerHTML = (a.icon ? '<i class="' + a.icon + '"></i>' : '') + a.label;
    btn.onclick = a.action;
    el.appendChild(btn);
  });
}

function resetAll() {
  flow = { state:'init', docType:null, matchedData:null };
  document.getElementById('messageList').innerHTML = '';
  setProcessing(false);
  showProgress();
  updatePlaceholder();
  setQuickActions([]);
  showWelcome();
}

function showWelcome() {
  addMsg('ai', '你好！我可以帮你快速创建各类业务数据。\n\n点击上方标签选择类型，或直接描述需求：');
  flow.state = 'init';
  setQuickActions([
    { icon:'ri-file-list-3-line', label:'销售订单', action:function(){selectType('order');} },
    { icon:'ri-building-line', label:'客户', action:function(){selectType('customer');} },
    { icon:'ri-contacts-line', label:'联系人', action:function(){selectType('contact');} },
    { icon:'ri-calendar-check-line', label:'行动', action:function(){selectType('activity');} },
    { icon:'ri-money-cny-circle-line', label:'回款', action:function(){selectType('payment');} }
  ]);
}

var msgIdCounter = 0;
function addMsg(type, content, enrichFn) {
  var id = ++msgIdCounter;
  var list = document.getElementById('messageList');
  var div = document.createElement('div');
  div.className = 'msg ' + type;
  div.id = 'msg-' + id;
  if (type === 'system') {
    div.innerHTML = '<div class="msg-bubble">' + escapeHtml(content) + '</div>';
  } else {
    var icon = type === 'user' ? 'ri-user-line' : 'ri-robot-2-line';
    div.innerHTML = '<div class="msg-avatar"><i class="'+icon+'"></i></div><div class="msg-body"><div class="msg-bubble">'+content+'</div><div class="msg-meta">'+formatTime(new Date())+'</div></div>';
  }
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
  if (enrichFn) setTimeout(function(){enrichFn(div);list.scrollTop=list.scrollHeight;},10);
  return id;
}

function onResult(data) { document.getElementById('outputJson').textContent=JSON.stringify(data,null,2); }

var isProcessing = false;
function setProcessing(state) {
  isProcessing = state;
  document.getElementById('sendBtn').disabled = state;
  document.getElementById('voiceBtn').disabled = state;
  document.getElementById('textInput').disabled = state;
}

function processTextInput(text) {
  addMsg('user', escapeHtml(text));

  if (!flow.docType) {
    var detected = detectDocType(text);
    selectType(detected);
  }

  flow.state = 'processing';
  showProgress();
  setQuickActions([]);

  if (config.demoMode) {
    setTimeout(function() {
      var result = generateDemoResult(flow.docType, text);
      showMatchResult(result);
    }, 500 + Math.random() * 500);
  } else {
    runWorkflow({ user_input: text });
  }
}

function detectDocType(text) {
  var t = text.toLowerCase();
  if (t.indexOf('订单')!==-1||t.indexOf('下单')!==-1||t.indexOf('制单')!==-1) return 'order';
  if (t.indexOf('客户')!==-1&&(t.indexOf('新建')!==-1||t.indexOf('创建')!==-1||t.indexOf('添加')!==-1)) return 'customer';
  if (t.indexOf('联系人')!==-1) return 'contact';
  if (t.indexOf('行动')!==-1||t.indexOf('拜访')!==-1||t.indexOf('跟进')!==-1) return 'activity';
  if (t.indexOf('回款')!==-1||t.indexOf('收款')!==-1||t.indexOf('到账')!==-1) return 'payment';
  return 'order';
}

function generateDemoResult(typeId, inputText) {
  var cn = '深圳华创科技有限公司';
  var cm = inputText.match(/([\u4e00-\u9fa5]{2,}(科技|公司|集团|商贸|实业|有限)[\u4e00-\u9fa5]*)/);
  if (cm) cn = cm[1];

  var results = {
    order: function() {
      var prods = [];
      var pm = inputText.match(/([\u4e00-\u9fa5A-Za-z0-9]+)\s*(\d+)\s*(箱|个|支|台|套|件|包|盒|瓶|桶|本|册|张)/g);
      var m;
      while(pm && (m=pm.exec(inputText))!==null) {
        prods.push({name:m[1],spec:'',qty:parseInt(m[2])||1,unit:m[3],price:0,match_status:'confirmed'});
      }
      if(prods.length===0) prods.push({name:'A3打印纸',spec:'70g',qty:100,unit:'箱',price:280,match_status:'confirmed'});
      return {
        doc_type:'销售订单', customer_name:cn,
        customer_match:{status:'confirmed',matched_name:cn},
        payment_term:'月结30天', remark:'',
        products:prods
      };
    },
    customer: function() {
      return { doc_type:'客户', cu_name:cn, cu_short:cn.substring(0,4), industry:'制造业', region:'深圳', status:'new' };
    },
    contact: function() {
      var nm = inputText.match(/([\u4e00-\u9fa5]{2,4})(?=，|,|属于|电话|职位)/);
      return { doc_type:'联系人', contact_name:nm?nm[1]:'张三', customer_name:cn, phone:'13800138000', position:'采购经理', status:'new' };
    },
    activity: function() {
      return { doc_type:'行动', customer_name:cn, act_type:'上门拜访', act_date:'明天', content:'讨论采购计划', status:'pending' };
    },
    payment: function() {
      var amt = '50000';
      if(inputText.match(/([\d,.]+)万/)) amt = (parseFloat(inputText.match(/([\d,.]+)万/)[1])*10000).toString();
      return { doc_type:'回款', customer_name:cn, amount:amt, pay_date:'今天', pay_method:'银行转账', status:'pending' };
    }
  };
  return (results[typeId]||results.order)();
}

function showMatchResult(result) {
  flow.state = 'confirm';
  flow.matchedData = result;
  showProgress();
  var dt = DOC_TYPES[flow.docType];

  addMsg('ai', '识别完成，请确认：', function(el) {
    var bubble = el.querySelector('.msg-bubble');
    var preview = document.createElement('div');
    preview.className = 'rich-preview';

    var header = document.createElement('div');
    header.className = 'rich-preview-header';
    header.innerHTML = '<i class="'+dt.icon+'"></i> '+dt.name+' 预览';
    preview.appendChild(header);

    var body = document.createElement('div');
    body.className = 'rich-preview-body';

    var fields = getPreviewFields(result);
    fields.forEach(function(f) {
      var row = document.createElement('div');
      row.className = 'rich-preview-row';
      row.innerHTML = '<span class="label">'+f.label+'</span><span class="value'+(f.editable?' editable':'')+'"'+(f.editable?' data-field="'+f.key+'"':'')+'>'+f.value+'</span>';
      body.appendChild(row);
      if (f.matchStatus) {
        var match = document.createElement('div');
        match.className = 'rich-match '+f.matchStatus;
        var ml = {confirmed:'✓ 已匹配',pending:'⚠ 待确认',new:'✦ 新建'};
        match.textContent = ml[f.matchStatus]||f.matchStatus;
        body.appendChild(match);
      }
    });

    if (result.products && result.products.length > 0) {
      var sep = document.createElement('div');
      sep.style.cssText = 'margin-top:6px;border-top:1px dashed var(--border);padding-top:6px;';
      var pl = document.createElement('div');
      pl.style.cssText = 'font-size:10px;font-weight:700;color:var(--text2);margin-bottom:3px;';
      pl.innerHTML = '<i class="ri-list-unordered"></i> 产品明细';
      sep.appendChild(pl);
      result.products.forEach(function(p,i) {
        var r = document.createElement('div');
        r.className = 'rich-preview-row';
        r.innerHTML = '<span class="label">产品'+(i+1)+'</span><span class="value">'+p.name+(p.spec?' ('+p.spec+')':'')+' × '+p.qty+p.unit+(p.price?' ¥'+p.price:'')+'</span>';
        sep.appendChild(r);
      });
      body.appendChild(sep);
    }

    preview.appendChild(body);

    var actions = document.createElement('div');
    actions.className = 'rich-preview-actions';

    var editBtn = document.createElement('button');
    editBtn.className = 'rich-form-btn secondary';
    editBtn.innerHTML = '<i class="ri-edit-line"></i> 修改';
    editBtn.onclick = function() {
      preview.style.opacity='.4'; preview.style.pointerEvents='none';
      addMsg('ai', '请输入需要修改的内容：');
      flow.state = 'typing';
      showProgress();
    };
    actions.appendChild(editBtn);

    var confirmBtn = document.createElement('button');
    confirmBtn.className = 'rich-form-btn success';
    confirmBtn.innerHTML = '<i class="ri-check-line"></i> 确认创建';
    confirmBtn.onclick = function() {
      preview.style.opacity='.4'; preview.style.pointerEvents='none';
      confirmCreate(result);
    };
    actions.appendChild(confirmBtn);

    preview.appendChild(actions);
    bubble.appendChild(preview);

    body.querySelectorAll('.value.editable').forEach(function(el) {
      el.onclick = function() {
        var field = el.dataset.field;
        var current = el.textContent;
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'rich-form-input';
        input.value = current;
        input.style.cssText = 'font-size:11px;padding:2px 6px;width:120px;';
        el.style.display = 'none';
        el.parentNode.insertBefore(input, el.nextSibling);
        input.focus();
        input.onblur = function() {
          if (input.value.trim() && input.value.trim() !== current) {
            el.textContent = input.value.trim();
            result[field] = input.value.trim();
          }
          input.remove();
          el.style.display = '';
        };
        input.onkeydown = function(e) {
          if(e.key==='Enter'){e.preventDefault();input.blur();}
          if(e.key==='Escape'){input.value=current;input.blur();}
        };
      };
    });
  });

  setQuickActions([
    { icon:'ri-check-line', label:'确认创建', action:function(){confirmCreate(result);} },
    { icon:'ri-edit-line', label:'修改', action:function(){addMsg('ai','请输入需要修改的内容：');flow.state='typing';showProgress();} }
  ]);
}

function getPreviewFields(result) {
  var f = [];
  if (result.customer_name) f.push({label:'客户',value:result.customer_name,matchStatus:result.customer_match?result.customer_match.status:null,editable:true,key:'customer_name'});
  if (result.cu_name) f.push({label:'客户名称',value:result.cu_name,matchStatus:result.status==='new'?'new':'confirmed',editable:true,key:'cu_name'});
  if (result.contact_name) f.push({label:'姓名',value:result.contact_name,editable:true,key:'contact_name'});
  if (result.customer_name&&result.contact_name) f.push({label:'所属客户',value:result.customer_name,editable:true,key:'customer_name'});
  if (result.phone) f.push({label:'电话',value:result.phone,editable:true,key:'phone'});
  if (result.position) f.push({label:'职位',value:result.position,editable:true,key:'position'});
  if (result.cu_short) f.push({label:'简称',value:result.cu_short,editable:true,key:'cu_short'});
  if (result.industry) f.push({label:'行业',value:result.industry});
  if (result.region) f.push({label:'区域',value:result.region});
  if (result.act_type) f.push({label:'类型',value:result.act_type});
  if (result.act_date) f.push({label:'日期',value:result.act_date,editable:true,key:'act_date'});
  if (result.content) f.push({label:'内容',value:result.content,editable:true,key:'content'});
  if (result.amount) f.push({label:'金额',value:'¥'+parseFloat(result.amount).toLocaleString(),editable:true,key:'amount'});
  if (result.pay_date) f.push({label:'到账日期',value:result.pay_date,editable:true,key:'pay_date'});
  if (result.pay_method) f.push({label:'方式',value:result.pay_method});
  if (result.payment_term) f.push({label:'付款条件',value:result.payment_term});
  if (result.remark) f.push({label:'备注',value:result.remark,editable:true,key:'remark'});
  return f;
}

function confirmCreate(result) {
  var dt = DOC_TYPES[flow.docType];
  addMsg('ai', '<strong style="color:'+dt.color+';">'+dt.name+'</strong>创建成功！✅');
  onResult(result);
  showToast(dt.name+'创建成功','success');
  flow.state = 'done';
  showProgress();
  updatePlaceholder();
  setQuickActions([
    { icon:'ri-repeat-line', label:'再建一个'+dt.name, action:function(){selectType(flow.docType);} },
    { icon:'ri-add-line', label:'创建其他', action:function(){flow.docType=null;showWelcome();} }
  ]);
}

async function runWorkflow(params) {
  if(isProcessing) return;
  saveConfig();
  if(config.demoMode){
    var result=generateDemoResult(flow.docType||'order',params.user_input||'');
    addMsg('system','演示模式：模拟工作流返回');
    setTimeout(function(){showMatchResult(result);},300);
    return;
  }
  setProcessing(true);
  var loadingId=addMsg('ai','<div class="rich-typing"><span></span><span></span><span></span></div> 识别中...');
  try{
    var body={workflow_id:config.workflowId,parameters:params};
    var response=await fetch(config.baseUrl+'/v1/workflow/run',{method:'POST',headers:{'Authorization':'Bearer '+config.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    var result=await response.json();
    var el=document.getElementById('msg-'+loadingId);if(el)el.remove();
    if(result.code===0&&result.data){
      var parsed=null;
      try{parsed=typeof result.data==='string'?JSON.parse(result.data):result.data;}catch(e){}
      if(parsed){showMatchResult(parsed);onResult(parsed);}
      showToast('识别完成','success');
    } else {
      addMsg('system error','执行失败: '+(result.msg||'未知错误'));
      showToast('工作流执行失败','error');
      flow.state='typing';showProgress();
    }
  }catch(e){
    var el=document.getElementById('msg-'+loadingId);if(el)el.remove();
    addMsg('system error','请求失败: '+e.message);
    showToast('请求失败','error');
    flow.state='typing';showProgress();
  }finally{setProcessing(false);}
}

function sendText() {
  var input=document.getElementById('textInput');
  var text=input.value.trim();
  if(!text||isProcessing)return;
  input.value='';autoResize(input);
  processTextInput(text);
}

function handleInputKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}

var voiceState='idle',mediaRecorder=null,audioChunks=[],recordingTimer=null,recordingSeconds=0,voiceRecordingBlob=null;

function toggleVoice(){if(isProcessing)return;if(voiceState==='idle')startVoice();else stopVoice();}

async function startVoice(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('浏览器不支持录音','error');return;}
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    voiceState='recording';audioChunks=[];recordingSeconds=0;voiceRecordingBlob=null;
    var btn=document.getElementById('voiceBtn');
    btn.classList.add('recording');
    btn.innerHTML='<i class="ri-stop-fill"></i><span class="rec-timer" id="recTimer">0s</span>';
    mediaRecorder=new MediaRecorder(stream,{mimeType:'audio/webm'});
    mediaRecorder.ondataavailable=function(e){if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      voiceRecordingBlob=new Blob(audioChunks,{type:'audio/webm'});
      addMsg('user','<i class="ri-mic-line"></i> 语音录音（'+recordingSeconds+'秒）');
      submitVoiceForRecognition(voiceRecordingBlob);
    };
    mediaRecorder.start();
    recordingTimer=setInterval(function(){
      recordingSeconds++;
      var timer=document.getElementById('recTimer');if(timer)timer.textContent=recordingSeconds+'s';
      if(recordingSeconds>=60)stopVoice();
    },1000);
  }catch(e){showToast('无法启动录音','error');}
}

function stopVoice(){
  if(voiceState==='idle')return;voiceState='idle';
  var btn=document.getElementById('voiceBtn');btn.classList.remove('recording');btn.innerHTML='<i class="ri-mic-line"></i>';
  if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null;}
  if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
}

async function submitVoiceForRecognition(blob){
  if(!blob){showToast('没有录音数据','error');return;}
  addMsg('system','正在上传语音并识别...');
  if(config.demoMode){
    setTimeout(function(){
      var demoTexts={order:'帮华创科技下个单，A3打印纸100箱',customer:'新建客户深圳华创科技有限公司，制造业，深圳',contact:'添加联系人张三，属于华创科技，电话13800138000',activity:'明天上午去华创科技上门拜访',payment:'华创科技回款5万，银行转账'};
      var text=demoTexts[flow.docType||'order']||demoTexts.order;
      addMsg('ai','语音识别结果：<strong>'+escapeHtml(text)+'</strong>',function(el){
        var bubble=el.querySelector('.msg-bubble');
        var actions=document.createElement('div');actions.className='rich-options';
        var useBtn=document.createElement('button');useBtn.className='rich-option';useBtn.innerHTML='<i class="ri-check-line"></i> 使用';useBtn.onclick=function(){disableOpts(actions);processTextInput(text);};actions.appendChild(useBtn);
        var editBtn=document.createElement('button');editBtn.className='rich-option';editBtn.innerHTML='<i class="ri-edit-line"></i> 编辑';editBtn.onclick=function(){disableOpts(actions);var input=document.getElementById('textInput');input.value=text;input.focus();autoResize(input);};actions.appendChild(editBtn);
        var retryBtn=document.createElement('button');retryBtn.className='rich-option danger';retryBtn.innerHTML='<i class="ri-refresh-line"></i> 重录';retryBtn.onclick=function(){disableOpts(actions);addMsg('system','请点击🎤按钮重新录音');};actions.appendChild(retryBtn);
        bubble.appendChild(actions);
      });
    },1000);
    return;
  }
  try{
    var fileId=null;
    var uploadId=addMsg('ai','<div class="rich-typing"><span></span><span></span><span></span></div> 上传语音...');
    var formData=new FormData();formData.append('file',blob,'voice.webm');
    var uploadResp=await fetch(config.baseUrl+'/v1/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+config.token},body:formData});
    var uploadResult=await uploadResp.json();
    var uploadEl=document.getElementById('msg-'+uploadId);if(uploadEl)uploadEl.remove();
    if(uploadResult.data&&uploadResult.data.file_id){fileId=uploadResult.data.file_id();addMsg('system','语音已上传，识别中...');}
    else{addMsg('system error','语音上传失败');return;}
    runWorkflow({user_input:'请识别语音中的制单信息',voice_file_id:fileId});
  }catch(e){addMsg('system error','语音识别失败: '+e.message);showToast('语音识别失败','error');}
}

function disableOpts(c){c.querySelectorAll('.rich-option').forEach(function(b){b.disabled=true;b.style.opacity='.4';b.style.pointerEvents='none';});}

document.addEventListener('paste',function(e){
  if(isProcessing)return;
  var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')!==-1){e.preventDefault();handleImageBlob(items[i].getAsFile());return;}}
});

(function(){
  var body=document.body,ov=document.getElementById('dropOverlay');
  body.addEventListener('dragover',function(e){e.preventDefault();ov.classList.add('active');});
  body.addEventListener('dragleave',function(e){if(!body.contains(e.relatedTarget))ov.classList.remove('active');});
  body.addEventListener('drop',function(e){e.preventDefault();ov.classList.remove('active');var files=e.dataTransfer.files;for(var i=0;i<files.length;i++){if(files[i].type.indexOf('image')!==-1){handleImageBlob(files[i]);return;}}});
})();

function handleImageBlob(blob){
  var url=URL.createObjectURL(blob);
  addMsg('user','📷 截图',function(el){var img=document.createElement('img');img.className='rich-image';img.src=url;el.querySelector('.msg-bubble').appendChild(img);});
  if(config.demoMode){
    addMsg('system','演示模式：模拟图片识别');
    setTimeout(function(){processTextInput('帮华创科技下个单，A3打印纸100箱');},500);
    return;
  }
  uploadFileToCoze(blob,function(fileId){if(fileId)runWorkflow({user_input:'请识别截图中的制单信息',image_file_id:fileId});});
}

async function uploadFileToCoze(blob,callback){
  try{
    var formData=new FormData();formData.append('file',blob,'upload.png');
    var response=await fetch(config.baseUrl+'/v1/files/upload',{method:'POST',headers:{'Authorization':'Bearer '+config.token},body:formData});
    var result=await response.json();
    if(result.data&&result.data.file_id)callback(result.data.file_id);
    else showToast('文件上传失败','error');
  }catch(e){showToast('文件上传失败','error');}
}

var sheetJsLoaded=false,mammothLoaded=false;

function handleFileSelect(e){
  var file=e.target.files[0];if(!file)return;e.target.value='';
  if(file.type.indexOf('image')!==-1){handleImageBlob(file);return;}
  var ext=file.name.split('.').pop().toLowerCase();
  if(['xlsx','xls'].indexOf(ext)!==-1)parseExcelFile(file);
  else if(['docx','doc'].indexOf(ext)!==-1)parseWordFile(file);
  else showToast('不支持的文件格式','error');
}

async function parseExcelFile(file){
  showFilePreview(file);
  if(!sheetJsLoaded){addMsg('system','加载Excel解析库...');await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');sheetJsLoaded=true;}
  try{
    var ab=await file.arrayBuffer();var wb=XLSX.read(ab,{type:'array'});var parts=[];
    wb.SheetNames.forEach(function(name){var data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1});data.forEach(function(row){var cells=row.map(function(c){return c!=null?String(c):''}).filter(function(c){return c});if(cells.length)parts.push(cells.join(' '));});});
    var text=parts.join('\n');if(text.length>10000)text=text.substring(0,10000)+'\n...(已截断)';
    addMsg('user','📎 Excel: '+file.name);
    processTextInput(text);
  }catch(e){showToast('Excel解析失败','error');}
  finally{clearFilePreview();}
}

async function parseWordFile(file){
  showFilePreview(file);
  if(!mammothLoaded){addMsg('system','加载Word解析库...');await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');mammothLoaded=true;}
  try{
    var ab=await file.arrayBuffer();var result=await mammoth.extractRawText({arrayBuffer:ab});var text=result.value;
    if(text.length>10000)text=text.substring(0,10000)+'\n...(已截断)';
    addMsg('user','📎 Word: '+file.name);
    processTextInput(text);
  }catch(e){showToast('Word解析失败','error');}
  finally{clearFilePreview();}
}

function showFilePreview(file){
  var size=(file.size/1024).toFixed(1)+' KB';
  var icon=file.name.indexOf('.doc')!==-1?'ri-file-word-2-line':'ri-file-excel-2-line';
  document.getElementById('filePreviewArea').innerHTML='<div class="file-preview"><i class="'+icon+'"></i><span class="fname">'+escapeHtml(file.name)+'</span><span style="color:var(--text3);font-size:9px;">'+size+'</span><i class="ri-close-line fremove" onclick="clearFilePreview()"></i></div>';
}
function clearFilePreview(){document.getElementById('filePreviewArea').innerHTML='';}

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatTime(d){return d.toTimeString().substring(0,5);}
function showToast(msg,type){var t=document.createElement('div');t.className='toast '+(type||'info');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.classList.add('show');},10);setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove();},300);},2500);}
function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('加载失败'));};document.head.appendChild(s);});}

loadConfig();
document.querySelectorAll('.config-input').forEach(function(el){el.addEventListener('change',saveConfig);});
showWelcome();
</script>
