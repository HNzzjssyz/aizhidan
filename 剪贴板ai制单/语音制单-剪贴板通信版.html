<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI制单 - Coze智能体版</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.19/libs/cn/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: calc(100vw - 750px);
  margin: 0;
  padding-left: 24px;
}
.header {
  text-align: center;
  color: #1f2937;
  margin-bottom: 24px;
}
.header h1 { font-size: 26px; }

.main-layout {
  display: block;
}

/* 识别结果区域 */
.result-section {
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  min-height: calc(100vh - 120px);
}
.result-section.active { display: block; }

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid #f0f0f0;
}
.result-title {
  font-size: 16px;
  font-weight: 600;
  color: #333;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-stats {
  display: flex;
  gap: 16px;
  font-size: 13px;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-value {
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 12px;
}
.stat-value.confirmed {
  background: #dcfce7;
  color: #166534;
}
.stat-value.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}
.empty-icon i {
  font-size: 48px;
}
.empty-text {
  font-size: 14px;
  line-height: 1.8;
}

/* 客户识别区域 */
.customer-section {
  margin-bottom: 20px;
}
.field-label {
  font-size: 12px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.customer-card {
  background: #f8f9fa;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.customer-card:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.customer-card.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.customer-card.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.customer-avatar {
  width: 44px;
  height: 44px;
  background: #3b82f6;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: white;
}
.customer-info { flex: 1; }
.customer-name {
  font-size: 15px;
  font-weight: 600;
  color: #333;
  margin-bottom: 2px;
}
.customer-meta {
  font-size: 11px;
  color: #888;
}
.customer-status {
  padding: 5px 10px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
}
.customer-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.customer-status.pending {
  background: #fef3c7;
  color: #92400e;
}

/* 产品区域 */
.product-section {
  margin-bottom: 20px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.product-actions {
  display: flex;
  gap: 8px;
}
.action-btn {
  padding: 6px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 6px;
  background: white;
  font-size: 12px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
}
.action-btn.primary {
  background: #3b82f6;
  color: white;
  border-color: transparent;
}
.action-btn.primary:hover {
  opacity: 0.9;
}

/* 产品列表 */
.product-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 480px;
  overflow-y: auto;
  padding-right: 4px;
}
.product-list::-webkit-scrollbar {
  width: 4px;
}
.product-list::-webkit-scrollbar-track {
  background: #f0f0f0;
  border-radius: 2px;
}
.product-list::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 2px;
}

/* 产品项 */
.product-item {
  background: #fafbfc;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  transition: all 0.2s;
  position: relative;
}
.product-item:hover {
  border-color: #bfdbfe;
  background: #eff6ff;
}
.product-item.confirmed {
  border-color: #4ade80;
  background: #f0fdf4;
}
.product-item.pending {
  border-color: #fbbf24;
  background: #fffbeb;
}
.product-item.error {
  border-color: #f87171;
  background: #fef2f2;
}
.product-item.new {
  border-color: #60a5fa;
  background: #eff6ff;
}

.product-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.product-index {
  width: 28px;
  height: 28px;
  background: #e8e8e8;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: #666;
  flex-shrink: 0;
}
.product-item.confirmed .product-index {
  background: #4ade80;
  color: white;
}
.product-item.pending .product-index {
  background: #fbbf24;
  color: white;
}
.product-item.error .product-index {
  background: #f87171;
  color: white;
}
.product-item.new .product-index {
  background: #60a5fa;
  color: white;
}
.product-main { flex: 1; min-width: 0; }
.product-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.product-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.product-match-type {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
}
.product-match-type.sku { background: #dbeafe; color: #1e40af; }
.product-match-type.code { background: #dcfce7; color: #166534; }
.product-match-type.name { background: #fef3c7; color: #92400e; }
.product-match-type.none { background: #fee2e2; color: #991b1b; }
.product-match-type.new { background: #dbeafe; color: #1e40af; }

.product-code {
  font-size: 11px;
  color: #888;
}
.product-status {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
  cursor: pointer;
  transition: all 0.2s;
}
.product-status.confirmed {
  background: #dcfce7;
  color: #166534;
}
.product-status.pending {
  background: #fef3c7;
  color: #92400e;
}
.product-status.error {
  background: #fee2e2;
  color: #991b1b;
}
.product-status.new {
  background: #dbeafe;
  color: #1e40af;
}
.product-status:hover {
  opacity: 0.8;
}

.product-details {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding-top: 12px;
  border-top: 1px solid #e8e8e8;
}
.detail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.detail-label {
  font-size: 10px;
  color: #999;
}
.detail-value {
  font-size: 13px;
  color: #333;
  font-weight: 500;
}
.detail-value.editable {
  cursor: pointer;
  border-bottom: 1px dashed #d1d5db;
  transition: all 0.2s;
  min-width: 40px;
  display: inline-block;
}
.detail-value.editable:hover {
  border-bottom-color: #3b82f6;
  color: #3b82f6;
  background: #eff6ff;
  border-radius: 2px;
}
.detail-value.editing {
  border-bottom: none;
  padding: 0;
}
.detail-value.editing input {
  width: 100%;
  padding: 2px 6px;
  border: 1px solid #3b82f6;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  color: #333;
  background: #fafbff;
  outline: none;
}
.detail-value .edit-hint {
  font-size: 9px;
  color: #9ca3af;
  margin-left: 2px;
}
.detail-value.modified {
  position: relative;
}
.detail-value.modified::after {
  content: '已改';
  font-size: 9px;
  color: #f59e0b;
  margin-left: 4px;
  font-weight: 400;
}

.product-actions-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed #e0e0e0;
}
.product-action-btn {
  padding: 4px 10px;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  background: white;
  font-size: 11px;
  color: #666;
  cursor: pointer;
  transition: all 0.2s;
}
.product-action-btn:hover {
  border-color: #3b82f6;
  color: #3b82f6;
}
.product-action-btn.new {
  background: #dbeafe;
  border-color: #60a5fa;
  color: #1e40af;
}
.product-action-btn.new:hover {
  background: #60a5fa;
  color: white;
}
.product-action-btn.delete:hover {
  border-color: #f87171;
  color: #f87171;
}

/* 批量操作栏 */
.batch-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: #f8f9fa;
  border-radius: 8px;
  margin-bottom: 12px;
}
.batch-info {
  font-size: 12px;
  color: #666;
}
.batch-actions {
  display: flex;
  gap: 8px;
}

/* 添加产品按钮 */
.add-product-btn {
  width: 100%;
  padding: 12px;
  border: 2px dashed #bfdbfe;
  border-radius: 10px;
  background: #fafbfc;
  font-size: 13px;
  color: #3b82f6;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 10px;
}
.add-product-btn:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}

/* 操作按钮 */
.action-bar {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #f0f0f0;
}
.btn {
  flex: 1;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
}
.btn-secondary {
  background: #f0f0f0;
  color: #666;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-primary {
  background: #3b82f6;
  color: white;
}
.btn-primary:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.btn-success {
  background: #16a34a;
  color: white;
}
.btn-success:hover {
  opacity: 0.9;
}

/* 候选弹窗 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow: hidden;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid #f0f0f0;
}
.modal-title {
  font-size: 17px;
  font-weight: 600;
  color: #333;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 12px;
  color: #999;
}
.modal-body {
  padding: 14px 22px;
  max-height: 50vh;
  overflow-y: auto;
}
.candidate-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.candidate-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 2px solid #f0f0f0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.candidate-item:hover {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-item.selected {
  border-color: #3b82f6;
  background: #eff6ff;
}
.candidate-rank {
  width: 26px;
  height: 26px;
  background: #f0f0f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: #666;
}
.candidate-item:hover .candidate-rank,
.candidate-item.selected .candidate-rank {
  background: #3b82f6;
  color: white;
}
.candidate-info { flex: 1; }
.candidate-name {
  font-size: 14px;
  font-weight: 500;
  color: #333;
  margin-bottom: 2px;
}
.candidate-meta {
  font-size: 11px;
  color: #999;
}
.candidate-similarity {
  padding: 3px 10px;
  background: #dcfce7;
  color: #166534;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid #f0f0f0;
  display: flex;
  gap: 10px;
}

/* 新建产品弹窗样式 */
.create-product-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 12px;
  color: #666;
  font-weight: 500;
}
.form-label .required {
  color: #f87171;
  margin-left: 2px;
}
.form-input, .form-select {
  padding: 10px 14px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
  transition: all 0.2s;
}
.form-input:focus, .form-select:focus {
  outline: none;
  border-color: #3b82f6;
  background: #fafbff;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-hint {
  font-size: 11px;
  color: #999;
  margin-top: 2px;
}
.original-info-box {
  background: #eff6ff;
  border-left: 3px solid #3b82f6;
  padding: 12px 14px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 16px;
}
.original-info-box .label {
  font-size: 11px;
  color: #3b82f6;
  margin-bottom: 4px;
}
.original-info-box .value {
  font-size: 13px;
  color: #333;
  font-weight: 500;
}

.customer-avatar i,
.recognition-icon i {
  font-size: inherit;
  line-height: 1;
}

/* Toast动画 */
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes slideUp {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to { opacity: 0; transform: translateX(-50%) translateY(-20px); }
}


.paste-btn:hover { background:#059669; }
.search-input-wrapper { position:relative; margin-bottom:12px; }
.search-input-wrapper i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9ca3af; }
.search-input-wrapper input { padding-left:36px; }
.order-success-icon { width:56px;height:56px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px; }
.order-detail-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px; }
.order-detail-row:last-child { border-bottom:none; }
.order-detail-label { color:#6b7280; }
.order-detail-value { color:#1f2937;font-weight:500; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="ri-robot-2-line"></i> AI制单</h1>
  </div>

  <div id="cozeConfigPanel" style="background:white;border-radius:12px;padding:14px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.08);margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
      <i class="ri-robot-2-line" style="color:#3b82f6;font-size:18px;"></i>
      <span style="font-size:13px;font-weight:600;color:#333;">Coze 智能体</span>
    </div>
    <input type="text" id="botIdInput" value="7638933573109792777" placeholder="Bot ID" style="flex:1;min-width:120px;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;font-family:monospace;background:white;">
    <input type="password" id="tokenInput" value="pat_zwWR14W4YEjLnqpD2BhItuhzKhC4VYH52oWfwYoeiB2Y9JuKBR1g1TfRzFDTbWQe" placeholder="PAT Token" style="flex:2;min-width:160px;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;font-family:monospace;background:white;">
    <button id="connectCozeBtn" onclick="initCozeSDK()" style="padding:8px 16px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;">
      <i class="ri-play-line" style="font-size:14px;"></i>
      <span>启动 Coze</span>
    </button>
    <span id="apiStatus" style="font-size:11px;color:#9ca3af;"></span>
  </div>

  <div class="main-layout">
    <!-- 左侧：单据草稿区 -->
    <div class="result-section" id="resultSection">
      <!-- 结果头部 -->
      <div class="result-header">
        <div class="result-title"><i class="ri-list-check"></i> 单据草稿</div>
        <div class="result-stats">
          <div class="stat-item">
            <span>已确认</span>
            <span class="stat-value confirmed" id="confirmedCount">0/0</span>
          </div>
          <div class="stat-item">
            <span>待确认</span>
            <span class="stat-value pending" id="pendingCount">0/0</span>
          </div>
        </div>
      </div>

      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><i class="ri-chat-voice-line" style="font-size:48px;"></i></div>
        <div class="empty-text">请在智能体对话中发送需求<br>复制 JSON 后匹配结果将在此展示</div>
      </div>

      <!-- 客户识别 -->
      <div class="customer-section" id="customerSection" style="display:none;">
        <div class="field-label"><i class="ri-user-line"></i> 客户信息</div>
        <div class="customer-card" id="customerCard" onclick="showCustomerModal()">
          <div class="customer-avatar"><i class="ri-building-line"></i></div>
          <div class="customer-info">
            <div class="customer-name" id="customerName">-</div>
            <div class="customer-meta" id="customerMeta">-</div>
          </div>
          <div class="customer-status" id="customerStatus">待识别</div>
        </div>
      </div>

      <!-- 产品明细 -->
      <div class="product-section" id="productSection" style="display:none;">
        <div class="section-header">
          <div class="field-label"><i class="ri-shopping-bag-line"></i> 产品明细 <span id="productCount" style="color: #999; font-weight: normal;">(0个)</span></div>
          <div class="product-actions">
            <button class="action-btn" onclick="confirmAllProducts()"><i class="ri-check-line"></i> 全部确认</button>
            <button class="action-btn primary" onclick="addProduct()"><i class="ri-add-line"></i> 添加产品</button>
          </div>
        </div>

        <!-- 批量操作栏 -->

  try {
    if (typeof CozeWebSDK === 'undefined') {
      throw new Error('Coze SDK 未加载，请刷新页面');
    }

    if (cozeClient && typeof cozeClient.destroy === 'function') {
      cozeClient.destroy();

    cozeClient = new CozeWebSDK.WebChatClient({
      config: {

      auth: {
        type: 'token',

        }

let lastClipboardContent = '';

function isOrderJSON(text) {
  if (!text || text.length < 10) return false;
  if (text.indexOf('{') === -1) return false;
  return text.indexOf('"customer_name"') !== -1 ||
         text.indexOf('"products"') !== -1 ||
         text.indexOf('"doc_type"') !== -1;
}

function tryReadClipboard() {
  if (!document.hasFocus()) return;
  if (!navigator.clipboard || !navigator.clipboard.readText) return;
  navigator.clipboard.readText().then(function(text) {
    if (text !== lastClipboardContent && text !== lastDetectedJSON && isOrderJSON(text)) {
      lastClipboardContent = text;
      handleClipboardText(text);
    }
  }).catch(function() {});
}

function isInCozeSDKArea(el) {
  while (el) {
    if (el.className && typeof el.className === 'string') {
      if (el.className.indexOf('coze-chat-sdk') !== -1 || el.className.indexOf('coz-') !== -1) {
        return true;
      }
    }
    el = el.parentElement;
  }
  return false;
}

function injectImageToCozeSDK(e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;

  var hasImage = false;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      hasImage = true;
      break;
    }
  }
  if (!hasImage) return;

  if (!isInCozeSDKArea(e.target)) return;

  var fileInput = document.querySelector('input.coze-chat-sdk-semi-upload-hidden-input');
  if (!fileInput) return;

  e.preventDefault();
  e.stopPropagation();

  var files = [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      var file = items[i].getAsFile();
      if (file) files.push(file);
    }
  }
  if (files.length === 0) return;

  var dataTransfer = new DataTransfer();
  files.forEach(function(f) { dataTransfer.items.add(f); });
  fileInput.files = dataTransfer.files;
  fileInput.dispatchEvent(new Event('change', { bubbles: true }));
}

function extractJSON(text) {
  const patterns = [
    /```json\s*([\s\S]*?)```/,
    /```\s*([\s\S]*?)```/,
    /(\{[\s\S]*"doc_type"[\s\S]*\})/,
    /(\{[\s\S]*"customer_name"[\s\S]*\})/,
    /(\{[\s\S]*"products"[\s\S]*\})/
  ];
  for (let i = 0; i < patterns.length; i++) {
    const match = text.match(patterns[i]);
    if (match && match[1]) {
      try {
        const obj = JSON.parse(match[1].trim());
        if (obj.doc_type || obj.customer_name || obj.products) return obj;
      } catch (e) { continue; }
    }
  }
  try {
    const obj = JSON.parse(text.trim());
    if (obj.doc_type || obj.customer_name || obj.products) return obj;
  } catch (e) {}
  return null;
}

function handleClipboardText(text) {
  const data = extractJSON(text);
  if (!data) return;

  if (text === lastDetectedJSON) return;
  lastDetectedJSON = text;

  const orderDraft = {
    source: 'clipboard',
    customer: {
      originalName: data.customer_name || '',
      matchType: 'none',
      status: 'pending'
    },
    products: (data.products || []).map(function(p) {
      const hasSpec = !!(p.spec && p.spec.trim());
      const match = findProductFuzzyMatch(p.name, hasSpec);
      const matchedProduct = match.matchId ? mockData.products.find(function(mp) { return mp.id === match.matchId; }) : null;
      return {
        originalName: p.name || '',
        originalQty: (p.qty || 0) + (p.unit || ''),
        originalPrice: p.price ? p.price + '元' : '',
        originalSpec: p.spec || '',
        matchedId: match.matchId,
        matchedName: matchedProduct ? matchedProduct.name : '',
        matchedCode: matchedProduct ? matchedProduct.code : '',
        matchedSku: matchedProduct ? matchedProduct.sku : '',
        matchedSpec: matchedProduct ? matchedProduct.spec : '',
        matchType: match.matchType,
        status: match.status,
        qty: (p.qty || 0) + (p.unit || ''),
        price: p.price ? p.price + '元' : '',
        note: p.spec || ''
      };
    })
  };

  showMatchProgress(orderDraft);
  showToast('已捕获 JSON，正在填充表单...');
}

function findProductFuzzyMatch(name, hasSpec) {
  let exact = null;
  for (let i = 0; i < mockData.products.length; i++) {
    if (mockData.products[i].name === name) { exact = mockData.products[i]; break; }
  }

  let sameNameCount = 0;
  for (let i = 0; i < mockData.products.length; i++) {
    if (mockData.products[i].name === name) sameNameCount++;
  }

  if (exact && sameNameCount === 1 && hasSpec) {
    return { matchId: exact.id, status: 'confirmed', matchType: 'sku' };
  }

  if (exact && sameNameCount > 1) {
    return { matchId: exact.id, status: 'pending', matchType: 'name' };
  }

  if (exact && sameNameCount === 1 && !hasSpec) {
    return { matchId: exact.id, status: 'pending', matchType: 'name' };
  }

  const fuzzy = fuzzyMatchProducts(name, 3);
  if (fuzzy.length === 1 && fuzzy[0].matchScore >= 80) {
    return { matchId: fuzzy[0].id, status: 'pending', matchType: 'name' };
  }
  if (fuzzy.length > 1 && fuzzy[0].matchScore >= 60) {
    return { matchId: fuzzy[0].id, status: 'pending', matchType: 'name' };
  }
  return { matchId: null, status: 'error', matchType: 'none' };
}

function getPinyin(text) {
  if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
    return pinyinPro.pinyin(text, { toneType: 'none', type: 'array' }).join('_');

  return text.toLowerCase().replace(/\s+/g, '_');
}

function identifyCustomer(customerName) {
  const candidates = mockData.customers.filter(function(c) {
    return c.name.includes(customerName.substring(0, 4)) || c.similarity > 80;
  }).sort(function(a, b) { return b.similarity - a.similarity; });

  if (candidates.length === 1) {
    selectCustomer(candidates[0]);
    updateCustomerMatchInfo(customerName, candidates[0], 'exact');
  } else if (candidates.length > 1) {
    showCustomerCard(candidates[0], 'pending');
    currentCustomer = candidates;
    updateCustomerMatchInfo(customerName, candidates[0], 'fuzzy');
  } else {
    document.getElementById('customerName').textContent = '未识别到客户';
    document.getElementById('customerMeta').textContent = '点击手动搜索或新建';
    document.getElementById('customerStatus').textContent = '待确认';
    document.getElementById('customerStatus').className = 'customer-status pending';
    document.getElementById('customerCard').className = 'customer-card pending';
    updateCustomerMatchInfo(customerName, null, 'none');
  }
}

function updateCustomerMatchInfo(originalName, matchedCustomer, matchType) {
  let matchInfoEl = document.getElementById('customerMatchInfo');
  if (!matchInfoEl) {
    matchInfoEl = document.createElement('div');
    matchInfoEl.id = 'customerMatchInfo';
    matchInfoEl.style.cssText = 'font-size:11px;color:#6b7280;margin-top:4px;';
    const customerInfo = document.querySelector('.customer-info');
    if (customerInfo) customerInfo.appendChild(matchInfoEl);
  }

  if (matchType === 'exact') {
    matchInfoEl.innerHTML = '<i class="ri-check-line" style="color:#16a34a;"></i> <span style="color:#16a34a;">精确匹配</span> · 原始: ' + originalName;
  } else if (matchType === 'fuzzy') {
    matchInfoEl.innerHTML = '<i class="ri-question-line" style="color:#f59e0b;"></i> <span style="color:#f59e0b;">模糊匹配</span> · 原始: ' + originalName + ' → ' + (matchedCustomer ? matchedCustomer.name : '');
  } else {
    matchInfoEl.innerHTML = '<i class="ri-close-line" style="color:#ef4444;"></i> <span style="color:#ef4444;">未匹配</span> · 原始: ' + originalName;
  }
}

function calculateSubtotal(qty, price) {
  if (!qty || !price) return '-';
  const qtyNum = parseInt(qty.replace(/[^0-9]/g, ''));
  const priceNum = parseInt(price.replace(/[^0-9]/g, ''));
  if (isNaN(qtyNum) || isNaN(priceNum)) return '-';
  return '¥' + (qtyNum * priceNum).toLocaleString();
}

function editField(el, productIndex, fieldName) {
  if (el.classList.contains('editing')) return;

  const product = currentProducts[productIndex];
  const currentValue = fieldName === 'price'
    ? (product.price ? product.price.replace('元', '') : '')
    : (product.note || '');

  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentValue;
  input.placeholder = fieldName === 'price' ? '输入单价' : '输入备注';

  el.classList.add('editing');
  el.classList.remove('editable');
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  function finishEdit() {
    const newValue = input.value.trim();

    if (fieldName === 'price') {
      const originalPrice = product.originalPrice || product.price || '';
      if (newValue) {
        product.price = newValue + '元';
        product._priceModified = (newValue + '元') !== originalPrice;
      } else {
        product.price = '';
        product._priceModified = !!originalPrice;
      }
    } else if (fieldName === 'note') {
      const originalNote = product.originalSpec || product.note || '';
      product.note = newValue;
      product._noteModified = newValue !== originalNote;
    }

    renderProductList();
  }

  input.addEventListener('blur', finishEdit);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    } else if (e.key === 'Escape') {
      input.removeEventListener('blur', finishEdit);
      renderProductList();
    }
  });
}

function updateStats() {
  const confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  const pending = currentProducts.filter(function(p) { return p.status === 'pending' || p.status === 'error'; }).length;
  const total = currentProducts.length;

  document.getElementById('confirmedCount').textContent = confirmed + '/' + total;
  document.getElementById('pendingCount').textContent = pending + '/' + total;

  const generateBtn = document.getElementById('generateBtn');
  if (pending > 0 || total === 0) {
    generateBtn.disabled = true;
    generateBtn.textContent = '还有' + pending + '个产品待确认';
  } else {
    generateBtn.disabled = false;
    generateBtn.textContent = '生成销售订单';
  }
}

function showProductModalForEdit(index) {
  editingProductIndex = index;
  creatingProductIndex = index;
  const product = currentProducts[index];

  const candidates = fuzzyMatchProducts(product.originalName || product.matchedName, 5);

  const container = document.getElementById('productCandidateList');
  document.getElementById('productModalSubtitle').textContent = '重新匹配: ' + (product.originalName || product.matchedName);

  if (candidates.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:32px;color:#999;"><i class="ri-search-line" style="font-size:32px;display:block;margin-bottom:8px;opacity:0.4;"></i>未找到相似产品<br><span style="font-size:11px;">请点击下方"新建产品"创建</span></div>';
  } else {
    container.innerHTML = candidates.map(function(p, i) {
      return '<div class="candidate-item ' + (product.id === p.id ? 'selected' : '') + '" onclick="selectProductForEdit(' + p.id + ')">' +
        '<div class="candidate-rank">' + (i + 1) + '</div>' +
        '<div class="candidate-info">' +
          '<div class="candidate-name">' + p.name + ' ' + p.spec + '</div>' +
          '<div class="candidate-meta">' + p.code + ' | SKU: ' + p.sku + ' | ' + p.category + '</div>' +
        '</div>' +
        '<div class="candidate-similarity">' + p.matchScore + '%</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('productModal').classList.add('active');
}

function fuzzyMatchProducts(name, limit) {
  if (!name) return [];
  const namePinyin = getPinyin(name);
  const scored = [];
  for (let i = 0; i < mockData.products.length; i++) {
    const p = mockData.products[i];
    let score = 0;
    if (p.name === name) {
      score = 100;
    } else if (p.name.includes(name) || name.includes(p.name)) {
      score = 85;
    } else {
      const productPinyin = getPinyin(p.name);
      if (namePinyin === productPinyin) {
        score = 95;
      } else if (namePinyin && productPinyin &&
                 (namePinyin.includes(productPinyin) || productPinyin.includes(namePinyin))) {
        score = 80;
      } else {
        const nameChars = name.split('');
        let matchCount = 0;
        for (let j = 0; j < nameChars.length; j++) {
          if (p.name.includes(nameChars[j])) matchCount++;
        }
        score = Math.round((matchCount / nameChars.length) * 60);
      }
    }
    if (score >= 30) {
      scored.push(Object.assign({}, p, { matchScore: score }));
    }
  }
  scored.sort(function(a, b) { return b.matchScore - a.matchScore; });
  return scored.slice(0, limit || 5);
}

function createNewProductFromModal() {
  closeModal('productModal');
  if (creatingProductIndex !== null) {
    showCreateProductModal(creatingProductIndex);
  }
}

function showCreateProductModal(index) {
  creatingProductIndex = index;
  const product = currentProducts[index];

  const originalInfo = (product.originalName + ' ' + product.qty + ' ' + product.price + ' ' + (product.note || '')).trim();
  document.getElementById('originalProductInfo').textContent = originalInfo || '无原始识别信息';

  document.getElementById('newProductName').value = product.originalName || product.matchedName || '';
  document.getElementById('newProductCode').value = generateProductCode();
  document.getElementById('newProductSku').value = '';
  document.getElementById('newProductSpec').value = '';
  document.getElementById('newProductUnit').value = extractUnit(product.qty) || '个';
  document.getElementById('newProductCategory').value = '其他';
  document.getElementById('newProductNote').value = product.note || '';

  document.getElementById('createProductModal').classList.add('active');
}

function generateProductCode() {
  const prefix = 'PRD-NEW';
  const suffix = String(nextProductId).padStart(3, '0');
  nextProductId++;
  return prefix + '-' + suffix;
}

function extractUnit(qty) {
  if (!qty) return '个';
  const units = ['箱', '盒', '包', '本', '个', '套', '件'];
  for (let i = 0; i < units.length; i++) {
    if (qty.includes(units[i])) return units[i];
  }
  return '个';
}

function saveNewProduct() {
  const name = document.getElementById('newProductName').value.trim();
  const code = document.getElementById('newProductCode').value.trim();

  if (!name || !code) {
    showToast('请填写必填项：产品名称和产品编号');
    return;
  }

  if (creatingProductIndex !== null) {
    const product = currentProducts[creatingProductIndex];

    product.matchedName = name;
    product.originalName = product.originalName || name;
    product.newCode = code;
    product.newSku = document.getElementById('newProductSku').value.trim();
    product.spec = document.getElementById('newProductSpec').value.trim();
    product.unit = document.getElementById('newProductUnit').value;
    product.category = document.getElementById('newProductCategory').value;
    product.note = document.getElementById('newProductNote').value.trim();
    product.status = 'new';
    product.matchType = 'new';
    product.id = nextProductId - 1;

    renderProductList();
    closeModal('createProductModal');
    creatingProductIndex = null;

    showToast('产品新建成功并已确认');
  }
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#16a34a;color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:9999;animation:slideDown 0.3s ease;';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(function() {
    toast.style.animation = 'slideUp 0.3s ease';
    setTimeout(function() { toast.remove(); }, 300);
  }, 2000);
}

function showConfirm(message, onConfirm) {
  document.getElementById('confirmModalBody').textContent = message;
  const okBtn = document.getElementById('confirmModalOkBtn');
  const newBtn = okBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(newBtn, okBtn);
  newBtn.addEventListener('click', function() {
    closeModal('confirmModal');
    if (onConfirm) onConfirm();
  });
  document.getElementById('confirmModal').classList.add('active');
}

function selectProductForEdit(productId) {
  if (editingProductIndex !== null) {
    const matchedProduct = mockData.products.find(function(p) { return p.id === productId; });
    currentProducts[editingProductIndex].id = productId;
    currentProducts[editingProductIndex].matchedId = productId;
    currentProducts[editingProductIndex].matchedName = matchedProduct ? matchedProduct.name : '';
    currentProducts[editingProductIndex].matchedCode = matchedProduct ? matchedProduct.code : '';
    currentProducts[editingProductIndex].matchedSku = matchedProduct ? matchedProduct.sku : '';
    currentProducts[editingProductIndex].matchedSpec = matchedProduct ? matchedProduct.spec : '';
    currentProducts[editingProductIndex].status = 'confirmed';
    currentProducts[editingProductIndex].matchType = 'sku';
    renderProductList();
    closeModal('productModal');
    editingProductIndex = null;
    creatingProductIndex = null;
  }
}

function confirmAllProducts() {
  currentProducts.forEach(function(p) {
    if (p.status !== 'error') {
      p.status = 'confirmed';
    }
  });
  renderProductList();
}

function addProduct() {
  const newIndex = currentProducts.length + 1;
  currentProducts.push({
    index: newIndex,
    originalName: '新产品',
    matchedName: '',
    matchedCode: '',
    matchedSku: '',
    matchedSpec: '',
    qty: '',
    price: '',
    note: '',
    status: 'error',
    matchType: 'none',
    id: null
  });
  renderProductList();

  setTimeout(function() {
    const list = document.getElementById('productList');
    list.scrollTop = list.scrollHeight;
  }, 100);
}

function toggleProductStatus(index) {
  const product = currentProducts[index];
  if (product.status === 'confirmed' || product.status === 'new') {
    product.status = 'pending';
  } else {
    product.status = 'confirmed';
  }
  renderProductList();
}

function deleteProduct(index) {
  showConfirm('确定删除此产品吗？', function() {
    currentProducts.splice(index, 1);
    currentProducts.forEach(function(p, i) { p.index = i + 1; });
    renderProductList();
  });
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

function searchCustomer() {
  closeModal('customerModal');
  const searchInput = document.getElementById('customerSearchInput');
  searchInput.value = '';
  document.getElementById('customerSearchResults').innerHTML = '';
  document.getElementById('customerSearchModal').classList.add('active');
  setTimeout(function() { searchInput.focus(); }, 100);
}

function searchCustomerByInput() {
  const keyword = document.getElementById('customerSearchInput').value.trim();
  const container = document.getElementById('customerSearchResults');
  if (!keyword) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">请输入关键字搜索</div>';
    return;
  }
  const results = mockData.customers.filter(function(c) {
    return c.name.includes(keyword) || c.pinyin.includes(keyword.toLowerCase());
  });
  if (results.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配客户</div>';
    return;
  }
  container.innerHTML = results.map(function(c, i) {
    return '<div class="candidate-item" onclick="selectCustomerFromSearch(' + c.id + ')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + c.name + '</div>' +
        '<div class="candidate-meta">' + c.address + ' | ' + c.contact + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + c.similarity + '%</div>' +
    '</div>';
  }).join('');
}

function selectCustomerFromSearch(id) {
  const customer = mockData.customers.find(function(c) { return c.id === id; });
  if (customer) {
    selectCustomer(customer);
    closeModal('customerSearchModal');
  }
}

function searchProduct() {
  const container = document.getElementById('productCandidateList');
  container.innerHTML =
    '<div class="search-input-wrapper">' +
      '<i class="ri-search-line"></i>' +
      '<input type="text" id="productSearchInput" class="form-input" placeholder="输入产品名称或关键字搜索..." oninput="searchProductByInput()" style="width:100%;">' +
    '</div>' +
    '<div id="productSearchResults"></div>';
  document.getElementById('productModalSubtitle').textContent = '搜索产品';
  setTimeout(function() {
    const input = document.getElementById('productSearchInput');
    if (input) input.focus();
  }, 100);
}

function searchProductByInput() {
  const keyword = (document.getElementById('productSearchInput') || {}).value || '';
  const trimmed = keyword.trim();
  const resultsContainer = document.getElementById('productSearchResults');
  if (!resultsContainer) return;
  if (!trimmed) {
    resultsContainer.innerHTML = '';
    return;
  }
  const results = fuzzyMatchProducts(trimmed, 10);
  if (results.length === 0) {
    resultsContainer.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">未找到匹配产品</div>';
    return;
  }
  resultsContainer.innerHTML = results.map(function(p, i) {
    return '<div class="candidate-item" onclick="selectProductForEdit(' + p.id + ')">' +
      '<div class="candidate-rank">' + (i + 1) + '</div>' +
      '<div class="candidate-info">' +
        '<div class="candidate-name">' + p.name + ' ' + p.spec + '</div>' +
        '<div class="candidate-meta">' + p.code + ' | SKU: ' + p.sku + ' | ' + p.category + '</div>' +
      '</div>' +
      '<div class="candidate-similarity">' + p.matchScore + '%</div>' +
    '</div>';
  }).join('');
}

function toggleSelectAll() {
  const checked = document.getElementById('selectAll').checked;
  currentProducts.forEach(function(p) { p.selected = checked; });
  renderProductList();
}

function batchConfirm() {
  currentProducts.forEach(function(p) {
    if (p.selected && p.status !== 'error') {
      p.status = 'confirmed';
    }
  });
  renderProductList();
}

function batchDelete() {
  const toDelete = currentProducts.filter(function(p) { return p.selected; });
  if (toDelete.length === 0) return;
  showConfirm('确定删除选中的' + toDelete.length + '个产品吗？', function() {
    currentProducts = currentProducts.filter(function(p) { return !p.selected; });
    currentProducts.forEach(function(p, i) { p.index = i + 1; });
    renderProductList();
  });
}

function resetForm() {
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('productSection').style.display = 'none';
  document.getElementById('actionBar').style.display = 'none';
  currentProducts = [];
  currentCustomer = null;
  selectedCustomerId = null;
  editingProductIndex = null;
  creatingProductIndex = null;
  lastDetectedJSON = '';
  const progressDiv = document.getElementById('matchProgress');
  if (progressDiv) progressDiv.remove();
}

function generateOrder() {
  const confirmed = currentProducts.filter(function(p) { return p.status === 'confirmed' || p.status === 'new'; }).length;
  const totalAmount = currentProducts.reduce(function(sum, p) {
    const subtotal = calculateSubtotal(p.qty, p.price);
    if (subtotal !== '-') {
      return sum + parseInt(subtotal.replace(/[^0-9]/g, ''));
    }
    return sum;
  }, 0);

  const newProducts = currentProducts.filter(function(p) { return p.status === 'new'; }).length;

  const body = document.getElementById('orderSuccessBody');
  body.innerHTML =
    '<div class="order-detail-row"><span class="order-detail-label">客户</span><span class="order-detail-value">' + document.getElementById('customerName').textContent + '</span></div>' +
    '<div class="order-detail-row"><span class="order-detail-label">产品数量</span><span class="order-detail-value">' + confirmed + '个</span></div>' +
    (newProducts > 0 ? '<div class="order-detail-row"><span class="order-detail-label">新建产品</span><span class="order-detail-value">' + newProducts + '个</span></div>' : '') +
    '<div class="order-detail-row"><span class="order-detail-label">订单总额</span><span class="order-detail-value" style="color:#16a34a;font-size:16px;">¥' + totalAmount.toLocaleString() + '</span></div>';

  document.getElementById('orderSuccessModal').classList.add('active');
}

window.onclick = function(event) {
  if (event.target.classList.contains('modal-overlay')) {
    event.target.classList.remove('active');
  }
};
</script>
