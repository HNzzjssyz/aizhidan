<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板制单原型 - 阶段一&amp;阶段二</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --primary: #3b82f6;
  --primary-light: #eff6ff;
  --success: #10b981;
  --success-light: #ecfdf5;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --purple: #8b5cf6;
  --purple-light: #f5f3ff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
  color: white;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.header-icon {
  width: 44px; height: 44px;
  background: rgba(255,255,255,0.15);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.header h1 { font-size: 20px; font-weight: 700; }
.header p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.header-badge {
  background: rgba(255,255,255,0.15);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}

.main-layout {
  display: flex;
  gap: 0;
  height: calc(100vh - 76px);
}

.left-panel {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  min-width: 0;
}

.right-panel {
  width: 400px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--card);
}

.section-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.section-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title i { color: var(--primary); font-size: 18px; }
.section-body { padding: 20px; }

.monitor-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  font-size: 13px;
  font-weight: 500;
}
.monitor-status.active { background: var(--success-light); color: #065f46; border: 1px solid #a7f3d0; }
.monitor-status.inactive { background: var(--danger-light); color: #991b1b; border: 1px solid #fecaca; }
.monitor-status .status-dot { width: 10px; height: 10px; border-radius: 50%; }
.monitor-status.active .status-dot { background: var(--success); animation: blink 2s infinite; }
.monitor-status.inactive .status-dot { background: var(--danger); }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.log-area {
  background: #1e293b;
  border-radius: var(--radius-sm);
  padding: 16px;
  max-height: 200px;
  overflow-y: auto;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.8;
}
.log-entry { display: flex; gap: 8px; padding: 2px 0; }
.log-time { color: #64748b; flex-shrink: 0; }
.log-type { flex-shrink: 0; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
.log-type.clip { background: rgba(59,130,246,0.2); color: #93c5fd; }
.log-type.parse { background: rgba(139,92,246,0.2); color: #c4b5fd; }
.log-type.match { background: rgba(16,185,129,0.2); color: #6ee7b7; }
.log-type.fill { background: rgba(245,158,11,0.2); color: #fcd34d; }
.log-type.error { background: rgba(239,68,68,0.2); color: #fca5a5; }
.log-type.info { background: rgba(59,130,246,0.2); color: #93c5fd; }
.log-msg { color: #e2e8f0; word-break: break-all; }

.json-preview {
  background: #1e293b;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 11px;
  color: #e2e8f0;
  line-height: 1.7;
  max-height: 180px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
.json-key { color: #93c5fd; }
.json-str { color: #86efac; }
.json-num { color: #fcd34d; }

.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: all 0.2s;
  background: var(--card);
}
.form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.form-input.filled { border-color: var(--success); background: var(--success-light); }
.form-input::placeholder { color: var(--text-muted); }

.product-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.product-table thead th {
  text-align: left;
  padding: 10px 12px;
  background: #f8fafc;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.product-table tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
.product-table tbody td:first-child { color: var(--text); font-weight: 500; }
.product-table tbody tr.filled { background: var(--success-light); }
.product-table tbody tr.filled td { color: #065f46; }

.empty-products { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }
.empty-products i { font-size: 32px; display: block; margin-bottom: 8px; opacity: 0.4; }

.action-bar {
  display: flex;
  gap: 10px;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  background: #fafbfc;
}
.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark, #2563eb); }
.btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
.btn-secondary { background: var(--card); color: var(--text); }
.btn-secondary:hover { background: #f3f4f4; }
.btn-success { background: var(--success); color: white; border-color: var(--success); }
.btn-danger { background: var(--danger); color: white; border-color: var(--danger); }

.right-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.right-header .chat-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 18px;
}
.right-header .chat-info h3 { font-size: 14px; font-weight: 600; }
.right-header .chat-info p { font-size: 11px; color: var(--text-muted); }

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.chat-msg { display: flex; gap: 10px; max-width: 95%; }
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg .msg-avatar {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.chat-msg.agent .msg-avatar { background: var(--primary-light); color: var(--primary); }
.chat-msg.user .msg-avatar { background: var(--purple-light); color: var(--purple); }
.chat-bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; word-break: break-word; }
.chat-msg.agent .chat-bubble { background: #f1f5f9; color: var(--text); }
.chat-msg.user .chat-bubble { background: var(--primary); color: white; }
.chat-bubble pre {
  background: #1e293b; color: #e2e8f0; padding: 12px; border-radius: 8px;
  font-size: 11px; line-height: 1.6; overflow-x: auto; margin: 8px 0 0;
  font-family: 'SF Mono', 'Fira Code', monospace;
}
.chat-bubble .copy-btn {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
  padding: 4px 10px; background: rgba(59,130,246,0.1); color: var(--primary);
  border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
}
.chat-bubble .copy-btn:hover { background: rgba(59,130,246,0.2); }
.chat-bubble .copy-btn.success { background: rgba(16,185,129,0.2); color: var(--success); }

.quick-samples {
  padding: 8px 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
  background: #fafbfc;
}
.quick-sample {
  padding: 4px 12px;
  background: var(--primary-light);
  color: var(--primary);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.quick-sample:hover { background: #dbeafe; }

.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
  background: #fafbfc;
}
.chat-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.chat-input:focus { outline: none; border-color: var(--primary); }
.chat-send {
  width: 38px; height: 38px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background 0.2s;
}
.chat-send:hover { background: var(--primary-dark, #2563eb); }

.match-result {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  margin-top: 12px;
  font-size: 13px;
}
.match-result.success { background: var(--success-light); border: 1px solid #a7f3d0; color: #065f46; }
.match-result.error { background: var(--danger-light); border: 1px solid #fecaca; color: #991b1b; }
.match-result.pending { background: var(--warning-light); border: 1px solid #fde68a; color: #92400e; }

.config-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: #fafbfc;
}
.config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.config-row:last-child { margin-bottom: 0; }
.config-label { font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 50px; }
.config-input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-family: 'SF Mono', monospace;
}
.config-input:focus { outline: none; border-color: var(--primary); }

.customer-card {
  background: #f8f9fa;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 16px;
}
.customer-card:hover { border-color: var(--primary); background: var(--primary-light); }
.customer-card.confirmed { border-color: var(--success); background: var(--success-light); }
.customer-card.pending { border-color: var(--warning); background: var(--warning-light); }
.customer-avatar {
  width: 44px; height: 44px;
  background: var(--primary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: white;
}
.customer-info { flex: 1; }
.customer-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.customer-meta { font-size: 11px; color: var(--text-muted); }
.customer-status {
  padding: 5px 10px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
}
.customer-status.confirmed { background: var(--success-light); color: #166534; }
.customer-status.pending { background: var(--warning-light); color: #92400e; }

.product-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
.product-item {
  background: #fafbfc;
  border: 2px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px;
  transition: all 0.2s;
}
.product-item:hover { border-color: #bfdbfe; background: var(--primary-light); }
.product-item.confirmed { border-color: var(--success); background: var(--success-light); }
.product-item.pending { border-color: var(--warning); background: var(--warning-light); }
.product-item.error { border-color: var(--danger); background: var(--danger-light); }
.product-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.product-index {
  width: 28px; height: 28px;
  background: #e8e8e8;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: var(--text-secondary);
}
.product-item.confirmed .product-index { background: var(--success); color: white; }
.product-item.pending .product-index { background: var(--warning); color: white; }
.product-item.error .product-index { background: var(--danger); color: white; }
.product-main { flex: 1; }
.product-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.product-spec { font-size: 11px; color: var(--text-muted); }
.product-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding-top: 8px; border-top: 1px solid #e0e0e0; }
.detail-item .detail-label { font-size: 10px; color: var(--text-muted); }
.detail-item .detail-value { font-size: 13px; font-weight: 500; color: var(--text); }
.product-status {
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
}
.product-status.confirmed { background: var(--success-light); color: #166534; }
.product-status.pending { background: var(--warning-light); color: #92400e; }
.product-status.error { background: var(--danger-light); color: #991b1b; }
.product-status:hover { opacity: 0.8; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state i { font-size: 48px; display: block; margin-bottom: 8px; opacity: 0.4; }

@media (max-width: 900px) {
  .main-layout { flex-direction: column; height: auto; }
  .right-panel { width: 100%; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
  .left-panel { height: 50vh; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon"><i class="ri-clipboard-line"></i></div>
    <div>
      <h1>剪贴板制单原型</h1>
      <p>阶段一：ClipboardMonitor · 阶段二：DataBridge · 阶段三：待集成Coze SDK</p>
    </div>
  </div>
  <div class="header-badge">
    <span style="width:8px;height:8px;background:#4ade80;border-radius:50%;"></span>
    <span id="phaseStatus">阶段一&amp;二就绪</span>
  </div>
</div>

<div class="main-layout">
  <div class="left-panel">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title"><i class="ri-file-list-3-line"></i> 单据草稿</div>
        <div style="display:flex;gap:6px;">
          <span id="fillStatus" style="font-size:11px;color:var(--text-muted);padding:4px 10px;background:#f8fafc;border-radius:20px;">未填充</span>
        </div>
      </div>
      <div class="section-body">
        <div class="form-group">
          <label class="form-label">单据类型</label>
          <input type="text" class="form-input" id="docType" placeholder="自动填充：销售订单 / 报价单 / 出库单" readonly>
        </div>

        <div id="customerSection" style="display:none;margin-bottom:16px;">
          <label class="form-label" style="margin-bottom:8px;">客户信息</label>
          <div class="customer-card" id="customerCard" onclick="handleCustomerClick()">
            <div class="customer-avatar"><i class="ri-building-line"></i></div>
            <div class="customer-info">
              <div class="customer-name" id="customerName">-</div>
              <div class="customer-meta" id="customerMeta">-</div>
            </div>
            <div class="customer-status pending" id="customerStatus">待确认</div>
          </div>
        </div>

        <div style="margin-bottom:8px;">
          <label class="form-label">产品明细</label>
        </div>
        <div class="product-list" id="productList">
          <div class="empty-state">
            <i class="ri-shopping-bag-line"></i>
            等待剪贴板JSON数据填充...
          </div>
        </div>

        <div id="matchResultArea"></div>
      </div>
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="resetForm()"><i class="ri-refresh-line"></i> 重置</button>
        <button class="btn btn-primary" id="matchBtn" onclick="submitMatch()" disabled><i class="ri-search-eye-line"></i> 提交匹配</button>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="right-header">
      <div class="chat-avatar"><i class="ri-robot-2-line"></i></div>
      <div class="chat-info">
        <h3>智能制单助手</h3>
        <p>模拟对话 · 复制JSON触发填充</p>
      </div>
    </div>

    <div class="config-section">
      <div class="config-row">
        <span class="config-label">阶段</span>
        <select class="config-input" id="phaseSelect" onchange="switchPhase()">
          <option value="1">阶段一：剪贴板监听</option>
          <option value="2" selected>阶段二：数据桥接</option>
        </select>
      </div>
      <div style="margin-top:8px;display:flex;gap:6px;">
        <button class="btn btn-secondary" onclick="clearLogs()" style="padding:6px 12px;font-size:11px;"><i class="ri-delete-bin-line"></i> 清空日志</button>
        <button class="btn btn-primary" onclick="testClipboardMonitor()" style="padding:6px 12px;font-size:11px;"><i class="ri-test-tube-line"></i> 测试监听</button>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="chat-msg agent">
        <div class="msg-avatar"><i class="ri-robot-2-line"></i></div>
        <div class="chat-bubble">
          你好！我是智能制单助手。<br><br>
          请输入客户和产品信息，我会返回结构化 JSON。<br>
          <strong>复制 JSON 内容</strong>后，左侧表单将自动填充并匹配。<br><br>
          <span style="font-size:11px;color:#6b7280;">💡 点击下方快捷示例快速体验</span>
        </div>
      </div>
    </div>

    <div class="quick-samples">
      <span class="quick-sample" onclick="useQuickSample(0)">6产品订单</span>
      <span class="quick-sample" onclick="useQuickSample(1)">7产品订单</span>
      <span class="quick-sample" onclick="useQuickSample(2)">口语化表达</span>
    </div>

    <div class="chat-input-area">
      <input class="chat-input" id="chatInput" placeholder="输入客户和产品信息..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="chat-send" onclick="sendChat()"><i class="ri-send-plane-line"></i></button>
    </div>
  </div>
</div>

<div id="logPanel" style="display:none; position:fixed; bottom:20px; right:20px; width:380px; background:white; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.15); z-index:1000; overflow:hidden;">
  <div style="padding:12px 16px; background:#1e293b; display:flex; justify-content:space-between; align-items:center;">
    <span style="color:white; font-size:13px; font-weight:600;">📋 实时日志</span>
    <button onclick="document.getElementById('logPanel').style.display='none'" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:18px;">×</button>
  </div>
  <div id="logArea" class="log-area" style="max-height:250px; border-radius:0;"></div>
</div>

<script>
// ============================================================
// 阶段一：ClipboardMonitor 剪贴板监听类
// ============================================================
class ClipboardMonitor {
  constructor(options = {}) {
    this.options = {
      interval: options.interval || 1000,
      minLength: options.minLength || 10,
      onClipboardChange: options.onClipboardChange || null,
      onJSONExtracted: options.onJSONExtracted || null,
      onError: options.onError || null,
      debug: options.debug || false
    };
    this.lastContent = '';
    this.isActive = false;
    this.pollTimer = null;
    this.patterns = [
      /```json\s*([\s\S]*?)```/,
      /```\s*([\s\S]*?)```/,
      /(\{[\s\S]*"doc_type"[\s\S]*\})/,
      /(\{[\s\S]*"customer_name"[\s\S]*\})/,
      /(\{[\s\S]*"products"[\s\S]*\})/
    ];
    this._bindEvents();
  }

  _bindEvents() {
    document.addEventListener('copy', (e) => {
      const selection = window.getSelection().toString();
      if (selection) {
        setTimeout(() => this._handleText(selection, 'copy'), 100);
      }
    });

    document.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (text) {
        setTimeout(() => this._handleText(text, 'paste'), 100);
      }
    });
  }

  start() {
    if (this.isActive) return;
    this.isActive = true;
    this._log('info', 'ClipboardMonitor 已启动');

    this.pollTimer = setInterval(() => {
      this._pollClipboard();
    }, this.options.interval);
  }

  stop() {
    if (!this.isActive) return;
    this.isActive = false;
    if (this.pollTimer) {
      clearInterval(this.pollTimer);
      this.pollTimer = null;
    }
    this._log('info', 'ClipboardMonitor 已停止');
  }

  _pollClipboard() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(text => {
        if (text && text !== this.lastContent && text.length >= this.options.minLength) {
          this.lastContent = text;
          this._handleText(text, 'poll');
        }
      }).catch(() => {});
    }
  }

  _handleText(text, source) {
    this._log('clip', `来源: ${source} | 长度: ${text.length}字符`);

    if (this.options.onClipboardChange) {
      this.options.onClipboardChange(text, source);
    }

    const json = this.extractJSON(text);
    if (json) {
      this._log('parse', `JSON提取成功 | doc_type: ${json.doc_type || '-'} | products: ${(json.products || []).length}条`);
      if (this.options.onJSONExtracted) {
        this.options.onJSONExtracted(json, text);
      }
    } else {
      this._log('error', '未检测到有效JSON结构');
      if (this.options.onError) {
        this.options.onError('INVALID_JSON', text);
      }
    }
  }

  extractJSON(text) {
    for (const pattern of this.patterns) {
      const match = text.match(pattern);
      if (match && match[1]) {
        try {
          const obj = JSON.parse(match[1].trim());
          if (obj.doc_type || obj.customer_name || obj.products) {
            return obj;
          }
        } catch (e) { continue; }
      }
    }
    try {
      const obj = JSON.parse(text.trim());
      if (obj.doc_type || obj.customer_name || obj.products) {
        return obj;
      }
    } catch (e) {}
    return null;
  }

  _log(type, msg) {
    if (this.options.debug) {
      DataBridge.log(type, msg);
    }
  }
}

// 阶段二：DataBridge 数据桥接器
// ============================================================
const DataBridge = {
  listeners: {},

  on(event, callback) {
    if (!this.listeners[event]) {
      this.listeners[event] = [];
    }
    this.listeners[event].push(callback);
  },

  emit(event, data) {
    if (this.listeners[event]) {
      this.listeners[event].forEach(cb => cb(data));
    }
  },

  log(type, msg) {
    const area = document.getElementById('logArea') || document.getElementById('mainLogArea');
    if (!area) return;

    const now = new Date();
    const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
      .map(n => String(n).padStart(2, '0')).join(':');

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">${time}</span><span class="log-type ${type}">${type.toUpperCase()}</span><span class="log-msg">${msg}</span>`;
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;

    const panel = document.getElementById('logPanel');
    if (panel) panel.style.display = 'block';
  },

  highlightJSON(obj) {
    const json = JSON.stringify(obj, null, 2);
    return json
      .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
      .replace(/: "([^"]*)"/g, ': <span class="json-str">"$1"</span>')
      .replace(/: (\d+\.?\d*)/g, ': <span class="json-num">$1</span>');
  }
};

let clipboardMonitor = null;

// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  initClipboardMonitor();
  DataBridge.log('info', '系统初始化完成');
  DataBridge.log('info', '阶段一：ClipboardMonitor 就绪');
  DataBridge.log('info', '阶段二：DataBridge 就绪');
  DataBridge.log('info', '请在右侧输入或使用示例测试');
});

function initClipboardMonitor() {
  clipboardMonitor = new ClipboardMonitor({
    interval: 1000,
    minLength: 10,
    debug: true,
    onClipboardChange: (text, source) => {
      DataBridge.log('clip', `捕获来源: ${source}`);
    },
    onJSONExtracted: (json, rawText) => {
      currentJSON = json;
      DataBridge.log('parse', 'JSON解析成功');
      DataBridge.emit('jsonExtracted', json);
      handleJSONData(json);
    },
    onError: (error, text) => {
      DataBridge.log('error', `错误: ${error}`);
    }
  });
  clipboardMonitor.start();
  DataBridge.log('info', '剪贴板监听已启动（轮询间隔1秒）');
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addChatBubble('user', text);
  DataBridge.log('info', `发送消息: ${text.substring(0, 50)}...`);

  setTimeout(() => {
    let matchedIndex = 0;
    if (text.includes('北京') || text.includes('宏达')) matchedIndex = 1;
    else if (text.includes('上海') || text.includes('鼎盛')) matchedIndex = 2;

    const resp = mockData.samples[matchedIndex].response;
    const jsonStr = JSON.stringify(resp, null, 2);

    const bubbleContent = `已识别制单需求，结构化数据如下：<pre>${jsonStr}</pre><div class="copy-btn" onclick="copyJSON(this)"><i class="ri-clipboard-line"></i> 点击复制 JSON</div>`;

    addChatBubble('agent', bubbleContent);
    DataBridge.log('info', '模拟智能体返回JSON，请点击复制触发监听');
  }, 800);
}

function addChatBubble(role, content) {
  const container = document.getElementById('chatContainer');
  const msg = document.createElement('div');
  msg.className = `chat-msg ${role}`;
  const avatarIcon = role === 'agent' ? 'ri-robot-2-line' : 'ri-user-line';
  msg.innerHTML = `<div class="msg-avatar"><i class="${avatarIcon}"></i></div><div class="chat-bubble">${content}</div>`;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}

function copyJSON(el) {
  const pre = el.parentElement.querySelector('pre');
  if (pre) {
    const text = pre.textContent;
    navigator.clipboard.writeText(text).then(() => {
      el.classList.add('success');
      el.innerHTML = '<i class="ri-check-line"></i> 已复制！';
      setTimeout(() => {
        el.classList.remove('success');
        el.innerHTML = '<i class="ri-clipboard-line"></i> 点击复制 JSON';
      }, 2000);
    }).catch(() => {
      const range = document.createRange();
      range.selectNodeContents(pre);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
    });
  }
}

function useQuickSample(index) {
  const sample = mockData.samples[index];
  if (!sample) return;
  document.getElementById('chatInput').value = sample.input;
  sendChat();
}

function handleJSONData(json) {
  DataBridge.log('match', '开始数据匹配流程');
  fillForm(json);
  matchCustomer(json.customer_name);
  matchProducts(json.products);
}

function fillForm(data) {
  DataBridge.log('fill', `填充表单 — 类型: ${data.doc_type}`);

  const fields = {
    docType: data.doc_type,
    customerName: data.customer_name,
    paymentTerm: data.payment_term,
    remark: data.remark
  };

  for (const [id, value] of Object.entries(fields)) {
    const input = document.getElementById(id);
    if (input && value) {
      input.value = value;
      input.classList.add('filled');
    }
  }

  document.getElementById('fillStatus').textContent = '已填充';
  document.getElementById('fillStatus').style.background = '#ecfdf5';
  document.getElementById('fillStatus').style.color = '#065f46';
}

function matchCustomer(customerName) {
  DataBridge.log('match', `匹配客户: ${customerName}`);

  const candidates = mockData.customers.filter(c =>
    c.name.includes(customerName.substring(0, 4)) ||
    c.similarity > 85
  ).sort((a, b) => b.similarity - a.similarity);

  if (candidates.length === 1) {
    selectCustomer(candidates[0]);
  } else if (candidates.length > 1) {
    showCustomerCard(candidates[0], 'pending');
  }
}

function showCustomerCard(customer, status) {
  document.getElementById('customerSection').style.display = 'block';
  document.getElementById('customerName').textContent = customer.name;
  document.getElementById('customerMeta').textContent = customer.address + ' | ' + customer.contact;

  const statusEl = document.getElementById('customerStatus');
  statusEl.textContent = status === 'confirmed' ? '已确认' : '待确认';
  statusEl.className = `customer-status ${status}`;
  document.getElementById('customerCard').className = `customer-card ${status}`;

  DataBridge.log('match', `客户状态: ${status} | 相似度: ${customer.similarity}%`);
}

function selectCustomer(customer) {
  selectedCustomerId = customer.id;
  showCustomerCard(customer, 'confirmed');
}

function handleCustomerClick() {
  DataBridge.log('info', '客户卡片点击');
}

function matchProducts(products) {
  DataBridge.log('match', `匹配 ${products.length} 个产品`);

  currentProducts = products.map((p, i) => {
    const match = findProductMatch(p.name);
    return {
      index: i + 1,
      raw: p,
      name: p.name,
      spec: p.spec || '',
      qty: p.qty,
      unit: p.unit || '',
      price: p.price,
      matchId: match.id,
      status: match.status
    };
  });

  renderProductList();
  updateMatchButton();

  DataBridge.log('match', `匹配完成 — 已确认: ${currentProducts.filter(p => p.status === 'confirmed').length} | 待确认: ${currentProducts.filter(p => p.status === 'pending').length} | 未匹配: ${currentProducts.filter(p => p.status === 'error').length}`);
}

function findProductMatch(name) {
  const exact = mockData.products.find(p => p.name === name);
  if (exact) {
    const sameCount = mockData.products.filter(p => p.name === name).length;
    return { id: exact.id, status: sameCount === 1 ? 'confirmed' : 'pending' };
  }
  return { id: null, status: 'error' };
}

function renderProductList() {
  const container = document.getElementById('productList');

  if (currentProducts.length === 0) {
    container.innerHTML = '<div class="empty-state"><i class="ri-shopping-bag-line"></i>暂无产品</div>';
    return;
  }

  container.innerHTML = currentProducts.map(p => {
    const productInfo = mockData.products.find(mp => mp.id === p.matchId) || {};
    const statusText = p.status === 'confirmed' ? '已确认' : p.status === 'pending' ? '待确认' : '未匹配';
    const subtotal = (p.qty || 0) * (p.price || 0);

    return `
      <div class="product-item ${p.status}">
        <div class="product-header">
          <div class="product-index">${p.index}</div>
          <div class="product-main">
            <div class="product-name">${productInfo.name || p.name}</div>
            <div class="product-spec">${productInfo.code || '-'} | ${productInfo.spec || p.spec || '-'}</div>
          </div>
          <div class="product-status ${p.status}">${statusText}</div>
        </div>
        <div class="product-details">
          <div class="detail-item">
            <div class="detail-label">数量</div>
            <div class="detail-value">${p.qty}${p.unit}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">单价</div>
            <div class="detail-value">¥${p.price}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">小计</div>
            <div class="detail-value">¥${subtotal.toLocaleString()}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">操作</div>
            <div class="detail-value" style="cursor:pointer;color:var(--primary);" onclick="toggleProductStatus(${p.index - 1})">切换</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleProductStatus(index) {
  const p = currentProducts[index];
  if (p.status === 'confirmed') {
    p.status = 'pending';
  } else if (p.status === 'pending') {
    p.status = 'confirmed';
  }
  renderProductList();
  updateMatchButton();
  DataBridge.log('info', `产品${p.name}状态切换为: ${p.status}`);
}

function updateMatchButton() {
  const btn = document.getElementById('matchBtn');
  const confirmed = currentProducts.filter(p => p.status === 'confirmed').length;
  const total = currentProducts.length;

  if (total === 0) {
    btn.disabled = true;
    btn.innerHTML = '<i class="ri-search-eye-line"></i> 提交匹配';
  } else {
    btn.disabled = false;
    const pending = total - confirmed;
    btn.innerHTML = pending > 0
      ? `<i class="ri-search-eye-line"></i> 提交匹配 (${pending}个待确认)`
      : `<i class="ri-search-eye-line"></i> 提交匹配`;
  }
}

function submitMatch() {
  DataBridge.log('info', '提交匹配查询');

  const resultArea = document.getElementById('matchResultArea');
  resultArea.innerHTML = '<div class="match-result pending"><i class="ri-loader-4-line"></i> 正在查询匹配...</div>';

  setTimeout(() => {
    const confirmed = currentProducts.filter(p => p.status === 'confirmed').length;

    resultArea.innerHTML = `<div class="match-result success">
      <strong>✓ 匹配完成</strong><br>
      客户匹配度: ${matchRate}%<br>
      产品确认: ${confirmed}/${total}个
    </div>`;

    DataBridge.log('match', `匹配完成 — 客户: ${document.getElementById('customerName').textContent} | 产品: ${confirmed}/${total}`);
  }, 1200);
}

function resetForm() {
  const fields = ['docType', 'paymentTerm', 'remark'];
  fields.forEach(id => {
    const input = document.getElementById(id);
    if (input) {
      input.value = '';
      input.classList.remove('filled');
    }
  });

  if (document.getElementById('customerName')) {
    document.getElementById('customerName').textContent = '-';
    document.getElementById('customerName').nextElementSibling.textContent = '-';
  }

  document.getElementById('productList').innerHTML = '<div class="empty-state"><i class="ri-shopping-bag-line"></i>等待剪贴板JSON数据填充...</div>';
  document.getElementById('customerSection').style.display = 'none';
  document.getElementById('matchResultArea').innerHTML = '';
  document.getElementById('fillStatus').textContent = '未填充';
  document.getElementById('fillStatus').style.background = '#f8fafc';
  document.getElementById('fillStatus').style.color = '#9ca3af';
  const matchBtn = document.getElementById('matchBtn');
  if (matchBtn) {
    matchBtn.disabled = true;
    matchBtn.innerHTML = '<i class="ri-search-eye-line"></i> 提交匹配';
  }

  currentJSON = null;
  currentProducts = [];
  selectedCustomerId = null;

  DataBridge.log('info', '表单已重置');
}

function switchPhase() {
  const phase = document.getElementById('phaseSelect').value;
  DataBridge.log('info', `切换至阶段${phase}`);

  if (phase === '1') {
    document.getElementById('phaseStatus').textContent = '阶段一：监听模式';
    document.getElementById('chatContainer').style.display = 'none';
  } else {
    document.getElementById('phaseStatus').textContent = '阶段二：数据桥接';
    document.getElementById('chatContainer').style.display = 'flex';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'l' && e.ctrlKey) {
    const panel = document.getElementById('logPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
});
</script>

</body>
</html>
